<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>bnb care</title>
<meta name="apple-mobile-web-app-title" content="bnb care">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  body.not-admin [data-tab="staff"], body.not-admin [data-tab="all"]{display:none;}
  body.company [data-tab="map"]{display:none;}
  .top-user{position:absolute;right:12px;top:14px;border:1px solid var(--paper-line);background:var(--surface);border-radius:14px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-soft);font-family:var(--sans);}
  .login-wrap{position:fixed;inset:0;background:var(--paper,#faf7f2);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-box{width:100%;max-width:340px;}
  .login-box h2{margin:0 0 4px;font-size:20px;}
  .login-box input{width:100%;box-sizing:border-box;padding:12px;margin-top:10px;border:1px solid var(--paper-line,#ddd);border-radius:8px;font-size:16px;font-family:inherit;}
  .login-box button{width:100%;margin-top:14px;padding:13px;border:none;border-radius:8px;background:var(--ink,#222);color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
  .login-err{color:#b3402a;font-size:13px;margin-top:10px;min-height:18px;}
  :root{
    --paper: #EEF0EA;
    --paper-line: #D9DCCF;
    --surface: #FFFFFF;
    --ink: #1F2A22;
    --ink-soft: #57604F;
    --teal: #2B6E63;
    --teal-soft: #E1EEEB;
    --mustard: #B4842A;
    --mustard-soft: #F5EAD3;
    --clay: #A6432A;
    --clay-soft: #F5E2DB;
    --radius: 10px;
    --serif: "Roboto Slab","Noto Serif KR",serif;
    --sans: -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
    --mono: "IBM Plex Mono","SFMono-Regular",Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);overflow-x:hidden;}
  body{padding-bottom:90px;}
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--paper-line);
    padding:14px 16px 0 16px;
  }
  .topbar h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:20px;
    margin:2px 0 12px 0;
    letter-spacing:-0.2px;
  }
  .tabs{display:flex;gap:0;margin:0;}
  .tab{
    flex:1;text-align:center;padding:10px 0 12px 0;
    font-size:14px;font-weight:600;color:var(--ink-soft);
    border-bottom:2px solid transparent;cursor:pointer;
    background:none;border-top:none;border-left:none;border-right:none;
    font-family:var(--sans);
  }
  .tab.active{color:var(--ink);border-bottom:2px solid var(--teal);}
  main{padding:14px 14px 0 14px;max-width:520px;margin:0 auto;}
  main.wide{max-width:1100px;}

  /* summary bar */
  .summary{
    background:var(--surface);border:1px solid var(--paper-line);
    border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;
  }
  .summary .date{font-size:12px;color:var(--ink-soft);}
  .summary .count{font-family:var(--serif);font-size:20px;font-weight:700;margin-top:2px;}
  .summary .count span{color:var(--teal);}
  .count-row{display:flex;align-items:center;gap:16px;margin-top:6px;}
  .count-item{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink);}
  .count-item span{color:var(--teal);}
  .summary-actions{display:flex;gap:6px;margin-left:auto;}
  .summary-actions button{
    width:30px;height:30px;font-size:14px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--paper-line);
    border-radius:50%;cursor:pointer;font-family:var(--sans);display:flex;align-items:center;justify-content:center;padding:0;
  }
  .relist-btn{
    font-size:12px;color:var(--ink-soft);background:none;border:1px solid var(--paper-line);
    border-radius:20px;padding:6px 12px;cursor:pointer;font-family:var(--sans);
  }

  /* picker */
  .picker-intro{font-size:13px;color:var(--ink-soft);margin:4px 0 12px 0;line-height:1.5;}
  .paste-box{background:var(--surface);border:1px solid var(--paper-line);border-radius:var(--radius);padding:12px;margin-bottom:14px;}
  .paste-box label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .paste-box textarea{width:100%;min-height:70px;padding:9px 10px;border:1px solid var(--paper-line);border-radius:8px;font-size:13px;font-family:var(--sans);background:var(--paper);color:var(--ink);resize:vertical;}
  .paste-box button{margin-top:8px;font-size:12.5px;border:1px solid var(--paper-line);background:var(--paper);border-radius:8px;padding:8px 12px;cursor:pointer;font-family:var(--sans);}
  .picker-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .picker-row{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--paper-line);
    border-radius:8px;padding:10px 12px;cursor:pointer;
  }
  .picker-row.checked{border-color:var(--teal);background:var(--teal-soft);}
  .picker-row input{width:18px;height:18px;accent-color:var(--teal);flex-shrink:0;}
  .priority-toggle{
    flex-shrink:0;font-size:11px;border:1px solid var(--paper-line);background:var(--surface);color:var(--ink-soft);
    border-radius:14px;padding:5px 9px;cursor:pointer;font-family:var(--sans);
  }
  .priority-toggle.active{background:var(--clay);border-color:var(--clay);color:#fff;}
  .picker-row .pname{font-size:14px;font-weight:600;}
  .picker-row .paddr{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .confirm-btn{
    position:sticky;bottom:14px;width:100%;
    background:var(--ink);color:#fff;border:none;border-radius:var(--radius);
    padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--sans);
  }
  .confirm-btn:disabled{background:#B9BEB2;}
  .export-btn{
    width:100%;background:var(--ink);color:#fff;border:none;border-radius:var(--radius);
    padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans);margin-top:16px;
  }

  /* today card */
  .job-card{
    background:var(--surface);border:1px solid var(--paper-line);
    border-left:4px solid var(--mustard);
    border-radius:var(--radius);padding:14px;margin-bottom:12px;
  }
  .job-card.done{border-left-color:var(--teal);opacity:0.72;}
  .job-card.priority{border-left-color:var(--clay);}
  .job-head{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .job-addr-inline{
    display:block;font-size:12px;color:var(--teal);text-decoration:none;margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .nav-icon-btn{
    flex-shrink:0;font-size:18px;text-decoration:none;padding:2px 4px;line-height:1;
  }
  .meta-addr{color:var(--teal);margin-bottom:4px;}
  .order-cluster{display:flex;flex-direction:row;align-items:center;gap:4px;flex-shrink:0;}
  .order-num{
    flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;
    font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .job-title-block{display:flex;flex-direction:column;min-width:0;flex:1;}
  .job-detail{display:none;}
  .job-card.open .job-detail{display:block;}
  .order-controls-mini{display:flex;flex-direction:column;gap:1px;}
  .order-controls-mini button{
    width:20px;height:14px;border:none;background:none;
    font-size:8px;line-height:1;cursor:pointer;color:var(--ink-soft);padding:0;
  }
  .order-controls-mini button:disabled{opacity:0.25;cursor:default;}
  .meta-line{
    font-size:12px;color:var(--ink-soft);margin-top:10px;padding-bottom:10px;
    border-bottom:1px solid var(--paper-line);
  }
  .photo-strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .pthumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--paper-line,#ddd);cursor:pointer;}
  .photo-view{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;}
  .photo-view img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:6px;}
  .photo-view .pv-actions{display:flex;gap:10px;margin-top:14px;}
  .photo-view button{padding:10px 18px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}
  .cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .cal-head .ttl{font-size:18px;font-weight:700;flex:1;min-width:110px;}
  .cal-head button{border:1px solid var(--paper-line);background:var(--surface);border-radius:8px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);color:var(--ink);}
  .cal-head button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .mc-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--paper-line);border:1px solid var(--paper-line);border-radius:8px;overflow:hidden;}
  .cal-dow{background:#F4F5F0;text-align:center;font-size:12px;font-weight:700;padding:6px 0;}
  .cal-cell{background:var(--surface);min-height:84px;padding:3px 2px 4px;cursor:pointer;overflow:hidden;}
  .cal-cell.out{background:#F7F8F4;}
  .cal-cell.out .dn{opacity:.4;}
  .cal-cell.sel{outline:2px solid var(--teal);outline-offset:-2px;}
  .cal-cell .dn{font-size:11px;font-weight:700;padding:0 2px 2px;display:flex;justify-content:space-between;align-items:center;}
  .cal-cell .dn .hol{font-size:9px;font-weight:600;color:#c0392b;}
  .cal-cell .dn .cnt{font-size:9px;font-weight:700;color:var(--ink-soft);}
  .cal-cell.today .dn b{background:var(--teal);color:#fff;border-radius:10px;padding:0 6px;}
  .cchip{display:block;font-size:9.5px;line-height:1.35;padding:1px 3px;margin-bottom:2px;border-radius:3px;background:#F3D2C5;color:#5a2a1c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cchip.pri{background:#E7B3A0;font-weight:700;}
  .cchip.done{background:var(--teal-soft);color:var(--teal);}
  .cchip .fn{display:none;}
  @media(min-width:700px){ .cchip .fn{display:inline;} .cchip .sn{display:none;} }
  .red{color:#c0392b;} .blue{color:#2f5fb5;}
  .wk-day{background:var(--surface);border:1px solid var(--paper-line);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;}
  .wk-day.today{outline:2px solid var(--teal);}
  .wk-day .wd{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;}
  .wk-day .wd b{font-size:20px;}
  .wk-day .wd .cn{margin-left:auto;font-size:13px;color:var(--ink-soft);}
  .wk-chip{display:flex;align-items:center;gap:8px;font-size:16px;padding:9px 11px;margin:5px 0;border-radius:8px;background:var(--clay-soft,#f3d9d2);}
  .wk-chip.done{background:var(--teal-soft,#dcebe7);}
  .wk-chip .nm{flex:1;min-width:0;font-weight:600;}
  .wk-chip .tag{font-size:12px;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.08);white-space:nowrap;}
  .wk-empty{font-size:14px;color:var(--ink-soft);padding:4px 0;}
  .cal-list-row{background:var(--surface);border:1px solid var(--paper-line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;}
  .cal-list-row.sel{outline:2px solid var(--teal);}
  .cal-list-row .d{font-weight:700;font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between;}
  .cal-list-row .chips{display:flex;flex-wrap:wrap;gap:4px;}
  .cal-list-row .cchip{font-size:12px;padding:3px 7px;margin:0;border-radius:6px;overflow:visible;}
  @media(min-width:700px){ .cal-cell{min-height:118px;} .cchip{font-size:11.5px;padding:2px 5px;} .cal-cell .dn{font-size:13px;} }
  .assign-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .assign-row select{flex:1;padding:8px;border-radius:8px;border:1px solid var(--paper-line);font-size:14px;font-family:var(--sans);background:#fff;}
  .warn-line{font-size:12px;color:var(--clay);margin-top:4px;line-height:1.4;}
  .worker-badge{flex-shrink:0;font-size:10px;font-weight:700;background:#eee;color:#444;border-radius:6px;padding:1px 6px;}
  .day-note{width:100%;box-sizing:border-box;border:1px solid var(--paper-line);border-radius:8px;padding:8px;font-size:13px;font-family:var(--sans);resize:vertical;min-height:36px;}
  .staff-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--paper-line);font-size:13px;}
  .staff-item .sname{font-weight:700;font-size:14px;}
  .staff-item button{border:none;background:#f0f0f0;border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;}
  .section-divider{border-top:1px solid var(--paper-line);margin:12px 0;}
  .excluded-section{margin-top:6px;padding:12px 14px;background:var(--paper);border:1px dashed var(--paper-line);border-radius:var(--radius);}
  .excluded-title{font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:8px;}
  .excluded-item{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-soft);padding:4px 0;}
  .excluded-meta{font-size:11px;font-family:var(--mono);}
  .job-name{font-family:var(--serif);font-size:16px;font-weight:700;}
  .job-owner{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .badge-row{display:flex;gap:6px;flex-shrink:0;}
  .badge{font-size:11px;font-family:var(--mono);padding:3px 6px;border-radius:5px;background:var(--mustard-soft);color:var(--mustard);white-space:nowrap;}
  .job-addr{font-size:13px;color:var(--ink-soft);margin-top:8px;line-height:1.4;}
  .job-addr a{color:var(--teal);text-decoration:none;}
  .job-addr a:active{opacity:0.7;}
  .job-notes{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5;background:var(--paper);border-radius:6px;padding:8px 10px;}
  .pw-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .notes-row{display:flex;align-items:flex-start;gap:8px;margin-top:8px;}
  .notes-edit{
    flex:1;font-size:12.5px;line-height:1.5;background:var(--paper);color:var(--ink);
    border:1px solid transparent;border-radius:6px;padding:8px 10px;resize:vertical;min-height:38px;font-family:var(--sans);
  }
  .notes-edit:focus{border-color:var(--ink-soft);outline:none;background:var(--surface);}
  .pw-icon{font-size:14px;flex-shrink:0;}
  .pw-edit{
    flex:1;font-family:var(--mono);font-size:13px;background:var(--clay-soft);color:var(--clay);
    border:1px solid transparent;border-radius:6px;padding:7px 10px;letter-spacing:0.3px;
  }
  .pw-edit:focus{border-color:var(--clay);outline:none;background:var(--surface);}

  /* clock in/out */
  .clock-card{background:var(--surface);border:1px solid var(--paper-line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;}
  .clock-row{display:flex;gap:10px;}
  .clock-item{flex:1;display:flex;flex-direction:column;gap:4px;align-items:flex-start;}
  .clock-label{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .clock-btn{width:100%;background:var(--ink);color:#fff;border:none;border-radius:8px;padding:9px 0;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans);}
  .clock-time-edit{width:100%;font-family:var(--mono);font-size:14px;border:1px solid var(--paper-line);border-radius:8px;padding:6px 8px;background:var(--paper);color:var(--ink);}
  .time-stepper{display:flex;align-items:center;gap:4px;}
  .time-stepper .clock-time-edit{flex:1;text-align:center;padding:6px 2px;}
  .time-stepper button{
    flex-shrink:0;width:30px;height:30px;border:1px solid var(--paper-line);background:var(--surface);
    border-radius:6px;font-size:11px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:var(--mono);
  }
  .clock-dim{font-size:13px;color:var(--ink-soft);padding:6px 0;}
  .clock-duration{margin-top:8px;font-size:12px;color:var(--teal);font-weight:600;}
  .job-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .pill-btn{
    font-size:12px;border:1px solid var(--paper-line);background:var(--paper);
    border-radius:20px;padding:6px 11px;cursor:pointer;color:var(--ink);text-decoration:none;
    font-family:var(--sans);display:inline-flex;align-items:center;gap:4px;
  }
  .pw-value{font-family:var(--mono);font-size:13px;background:var(--clay-soft);color:var(--clay);padding:6px 10px;border-radius:6px;letter-spacing:0.3px;}
  .parking-link{font-size:13px;color:var(--teal);text-decoration:none;}
  .task-list{margin-top:12px;display:flex;flex-direction:row;gap:6px;}
  .task-item{
    display:flex;flex-direction:row;align-items:center;gap:2px;
    border:none;border-radius:8px;padding:4px 4px 4px 8px;
    background:var(--paper);flex:1;min-width:0;
  }
  .task-item-main{display:flex;flex-direction:row;align-items:center;gap:6px;cursor:pointer;flex:1;min-width:0;padding:5px 0;}
  .task-item .box{
    width:16px;height:16px;border-radius:5px;border:1.5px solid var(--ink-soft);
    flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#fff;
  }
  .task-item.done{background:var(--teal-soft);}
  .task-item.done .box{background:var(--teal);border-color:var(--teal);}
  .task-item .ttext{font-size:12.5px;line-height:1.3;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .task-item.done .ttext{color:var(--ink-soft);text-decoration:line-through;}
  .task-remove{
    flex-shrink:0;width:20px;height:20px;border:none;background:none;color:var(--ink-soft);
    font-size:11px;cursor:pointer;border-radius:50%;
  }
  .task-missing-row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .task-add-back{
    font-size:11px;color:var(--ink-soft);background:var(--surface);border:1px dashed var(--paper-line);
    border-radius:14px;padding:5px 10px;cursor:pointer;font-family:var(--sans);
  }
  .task-meta{font-size:11px;color:var(--ink-soft);margin-top:8px;}

  /* all list */
  .search-box{
    width:100%;padding:11px 14px;border:1px solid var(--paper-line);border-radius:var(--radius);
    font-size:14px;margin-bottom:12px;background:var(--surface);color:var(--ink);font-family:var(--sans);
  }
  .prop-card{
    background:var(--surface);border:1px solid var(--paper-line);
    border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;
  }
  .prop-top{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px;}
  .prop-name{font-family:var(--serif);font-size:15px;font-weight:700;}
  .prop-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .chevron{font-size:12px;color:var(--ink-soft);flex-shrink:0;transition:transform .15s;}
  .prop-card.open .chevron{transform:rotate(90deg);}
  .prop-detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--paper-line);}
  .prop-card.open .prop-detail{display:block;}
  .detail-row{font-size:13px;margin-bottom:6px;color:var(--ink);}
  .detail-row b{color:var(--ink-soft);font-weight:600;margin-right:4px;}
  .detail-actions{display:flex;gap:8px;margin-top:10px;}
  .detail-actions button{flex:1;padding:8px;border-radius:8px;font-size:12.5px;cursor:pointer;font-family:var(--sans);border:1px solid var(--paper-line);background:var(--paper);}
  .detail-actions .del{color:var(--clay);}

  .fab{
    position:fixed;right:18px;bottom:18px;
    width:52px;height:52px;border-radius:50%;
    background:var(--ink);color:#fff;border:none;font-size:26px;
    box-shadow:0 4px 10px rgba(0,0,0,0.25);cursor:pointer;z-index:30;
  }

  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:13px;line-height:1.6;}

  /* map tab */
  .map-scope{display:flex;gap:8px;margin-bottom:12px;}
  .scope-btn{
    flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
    border:1px solid var(--paper-line);background:var(--surface);color:var(--ink-soft);font-family:var(--sans);
  }
  .scope-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  #kakaoMapDiv{
    width:100%;height:62vh;border-radius:var(--radius);border:1px solid var(--paper-line);
    background:var(--surface);
  }
  .map-hint{font-size:12px;color:var(--ink-soft);margin-top:10px;line-height:1.5;}
  .setup-card{background:var(--surface);border:1px solid var(--paper-line);border-radius:var(--radius);padding:16px;}
  .setup-card h3{font-family:var(--serif);font-size:16px;margin:0 0 8px 0;}
  .setup-card p{font-size:13px;color:var(--ink-soft);line-height:1.6;margin:0 0 12px 0;}
  .setup-card input{width:100%;padding:10px 11px;border:1px solid var(--paper-line);border-radius:8px;font-size:13px;font-family:var(--mono);background:var(--paper);color:var(--ink);margin-bottom:10px;}
  .link-row{margin-top:6px;}
  .link-row button{font-size:11px;color:var(--ink-soft);background:none;border:none;text-decoration:underline;cursor:pointer;padding:0;font-family:var(--sans);}

  /* history tab */

  .history-nav button{background:var(--surface);border:1px solid var(--paper-line);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;font-family:var(--sans);color:var(--ink);}
  .history-nav .month-label{font-family:var(--serif);font-size:16px;font-weight:700;}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:11px;color:var(--ink-soft);margin-bottom:4px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:44px;gap:4px;margin-bottom:16px;width:100%;}
  .cal-day{
    min-width:0;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:8px;font-size:13px;color:var(--ink-soft);cursor:pointer;position:relative;background:var(--surface);border:1px solid transparent;
  }
  .cal-day.empty{background:none;border:none;cursor:default;}
  .cal-day.has-record{color:var(--ink);border-color:var(--paper-line);}
  .cal-day.has-record .dot{width:5px;height:5px;border-radius:50%;background:var(--teal);margin-top:2px;}
  .cal-day.selected{background:var(--ink);color:#fff;}
  .cal-day.selected .dot{background:#fff;}
  .cal-day.is-today{font-weight:700;}
  .schedule-cal-bar{
    display:flex;align-items:center;justify-content:space-between;background:var(--surface);
    border:1px solid var(--paper-line);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;font-size:14px;
  }
  .schedule-cal-bar button{
    font-size:12px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--paper-line);
    border-radius:20px;padding:6px 10px;cursor:pointer;font-family:var(--sans);
  }

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(20,24,18,0.45);
    display:flex;align-items:flex-end;justify-content:center;z-index:100;
  }
  .sheet{
    background:var(--surface);width:100%;max-width:520px;
    border-radius:16px 16px 0 0;padding:18px 16px 22px 16px;
    max-height:86vh;overflow-y:auto;
  }
  .sheet h2{font-family:var(--serif);font-size:17px;margin:0 0 14px 0;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
  .field input,.field textarea{
    width:100%;padding:10px 11px;border:1px solid var(--paper-line);border-radius:8px;
    font-size:14px;font-family:var(--sans);background:var(--paper);color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:50px;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .sheet-actions{display:flex;gap:8px;margin-top:14px;}
  .sheet-actions button{flex:1;padding:12px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;border:none;font-family:var(--sans);}
  .save-btn{background:var(--ink);color:#fff;}
  .cancel-btn{background:var(--paper);color:var(--ink);border:1px solid var(--paper-line) !important;}
</style>

<script>
// ===== 빌드 설정 (개인용: 서버 없이 이 폰에만 저장 / 회사용: 로그인 + 서버 공유) =====
const CLOUD_ENABLED = true;
const COMPANY_MODE = true;
// ===== Firebase 연결 (로그인 + 실시간 공유 저장소) =====
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB3KSGfToHr1oPxDJTk7sAYof7pKelfNGY",
  authDomain: "bnbcare-d1603.firebaseapp.com",
  projectId: "bnbcare-d1603",
  storageBucket: "bnbcare-d1603.firebasestorage.app",
  messagingSenderId: "454006613109",
  appId: "1:454006613109:web:589a7ed412af59e358843c"
};
const ADMIN_EMAILS = ['leeje@bnbcare.com'];
const EMAIL_DOMAIN = '@bnbcare.com';
const FB_VER = '10.14.1';
let cloud = null; // { auth, db, user, fn }
const isAdmin = () => !CLOUD_ENABLED || !!(cloud && cloud.user && ADMIN_EMAILS.includes((cloud.user.email||'').toLowerCase()));

// 공유되는 데이터(숙소, 직원, 날짜별 일정, 보고기록)만 서버에 저장. 나머지(시급, 출퇴근, 카카오키 등)는 이 폰에만 저장
const isSharedKey = k => CLOUD_ENABLED && (k==='properties:list' || k==='staff:list' || k==='report-log:list' || k.startsWith('today:'));
const localStore = {
  async get(key){ const raw = localStorage.getItem(key); return (raw===null||raw===undefined) ? null : { key, value: raw }; },
  async set(key, value){ localStorage.setItem(key, value); return { key, value }; },
  async delete(key){ localStorage.removeItem(key); return { key, deleted:true }; },
  async list(prefix){ return { keys: Object.keys(localStorage).filter(k=>!prefix||k.startsWith(prefix)), prefix }; }
};
const kvDoc = key => cloud.fn.doc(cloud.db, 'kv', key);
window.storage = {
  async get(key, shared){
    if(isSharedKey(key)){
      if(!(cloud && cloud.user)) return null;
      const snap = await cloud.fn.getDoc(kvDoc(key));
      return snap.exists() ? { key, value: snap.data().value } : null;
    }
    return localStore.get(key);
  },
  async set(key, value, shared){
    if(isSharedKey(key)){
      if(!(cloud && cloud.user)) throw new Error('로그인 필요');
      await cloud.fn.setDoc(kvDoc(key), { value, updatedAt: Date.now(), by: cloud.user.email });
      return { key, value };
    }
    return localStore.set(key, value);
  },
  async delete(key, shared){
    if(isSharedKey(key)){
      if(!(cloud && cloud.user)) return null;
      await cloud.fn.deleteDoc(kvDoc(key));
      return { key, deleted:true };
    }
    return localStore.delete(key);
  },
  async list(prefix, shared){ return localStore.list(prefix); }
};
async function initCloud(){
  const base = 'https://www.gstatic.com/firebasejs/'+FB_VER;
  const [appM, authM, fsM] = await Promise.all([
    import(base+'/firebase-app.js'), import(base+'/firebase-auth.js'), import(base+'/firebase-firestore.js')
  ]);
  const app = appM.initializeApp(FIREBASE_CONFIG);
  const auth = authM.getAuth(app);
  let db;
  try{ db = fsM.initializeFirestore(app, { localCache: fsM.persistentLocalCache() }); }
  catch(e){ db = fsM.getFirestore(app); }
  cloud = { auth, db, user:null, fn:{ ...authM, ...fsM } };
}

const KEY_PROPS = 'properties:list';
const todayStr = () => {
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};
const todayKey = () => 'today:' + state.selectedDate;
const tomorrowStr = () => {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};
function tomorrowLabel(){
  const [y,m,d] = tomorrowStr().split('-').map(Number);
  const days = ['일','월','화','수','목','금','토'];
  const wd = new Date(y, m-1, d).getDay();
  return `${m}월 ${d}일 (${days[wd]})`;
}

let state = {
  tab: 'today',
  selectedDate: null, // 초기화 시 todayStr()로 세팅됨
  properties: [],
  todayRecord: null, // {propertyIds:[], tasks:{id:[{text,done}]}} - state.selectedDate 기준
  pickerSelection: new Set(),
  pickerPriority: new Set(),
  openJobIds: new Set(),
  toolsOpen: false,
  calPasteText: '',
  calPasteResultMsg: '',
  pasteMatchOrder: [],
  scheduleCalendarOpen: false,
  editTodayOpen: false,
  search: '',
  openIds: new Set(),
  editing: null, // property object being edited, or {} for new
  kakaoKey: null,
  companyLocation: null,
  hourlyWage: 0,
  staff: [],
  calMonth: (()=>{ const d=new Date(); return { year:d.getFullYear(), month:d.getMonth() }; })(),
  calView: 'grid',
  monthRecords: {},
  calWeekStart: null,
  photos: {}, // {propId:[{id,ts,by,thumb}]} 선택한 날짜 기준
  mapScope: 'today', // 'today' | 'all'
  mapReady: false,
  geocodeCache: {},
  photoLog: [],
  reportLog: [],
  workLog: [],
  historyDates: null, // Set of 'YYYY-MM-DD' strings that have records, loaded lazily
  historyMonth: (()=>{ const d=new Date(); return { year: d.getFullYear(), month: d.getMonth() }; })()
};

const DEFAULT_PROPERTIES = []; // 숙소 데이터는 서버(Firebase)에서 불러옴. 코드에는 넣지 않음


async function loadProperties(){
  try{
    const res = await window.storage.get(KEY_PROPS, false);
    if(res && res.value){ state.properties = cleanProps(JSON.parse(res.value)); return; }
  }catch(e){}
  state.properties = DEFAULT_PROPERTIES;
}
async function saveProperties(){
  try{ await window.storage.set(KEY_PROPS, JSON.stringify(state.properties), false); }catch(e){}
}
let lastTodayRaw = null;
async function loadTodayRecord(){
  try{
    const res = await window.storage.get(todayKey(), false);
    lastTodayRaw = (res && res.value) ? res.value : null;
    if(res && res.value){
      const rec = JSON.parse(res.value);
      if(rec && rec.tasks){ state.todayRecord = rec; return; } // 예전 형식이면 새로 만들게 함
    }
  }catch(e){}
  state.todayRecord = null;
}

async function loadStaff(){
  try{
    const res = await window.storage.get('staff:list', false);
    if(res && res.value){ state.staff = JSON.parse(res.value) || []; }
  }catch(e){}
}
async function saveStaff(){
  try{ await window.storage.set('staff:list', JSON.stringify(state.staff), false); }catch(e){}
}
const DAY_NAMES = ['일','월','화','수','목','금','토'];
function staffById(id){ return state.staff.find(x=>x.id===id); }
function selectedWeekday(){
  const [y,m,d] = state.selectedDate.split('-').map(Number);
  return new Date(y,m-1,d).getDay();
}
function offLabel(st){ return st.onRequest ? '연락 시' : '불가'; }
function staffUnavailable(st){
  if(st.onRequest) return true; // 요일 미정: 연락 온 날만 배정
  const wd = selectedWeekday();
  const days = (st.days && st.days.length) ? st.days : [0,1,2,3,4,5,6];
  return !days.includes(wd);
}
function warningsFor(st, p){
  const w = [];
  if(!st || !p) return w;
  if(st.onRequest) w.push('연락 온 날만 배정 (요일 미정)');
  else if(staffUnavailable(st)) w.push(`${DAY_NAMES[selectedWeekday()]}요일은 근무 불가`);
  (st.forbidden||[]).forEach(k=>{
    if(k && (p.name||'').includes(k)) w.push(`${st.name}님은 ${k} 배정 금지`);
  });
  if(st.endTime) w.push(`⏰ ${st.endTime} 이후 근무 불가`);
  return w;
}
async function setAssign(propId, staffId){
  const r = state.todayRecord;
  r.assign = r.assign || {};
  if(staffId) r.assign[propId] = staffId; else delete r.assign[propId];
  await saveTodayRecord();
  render();
}
function buildAssignText(){
  const r = state.todayRecord;
  const lines = [`[${renderDateLabel()} 근무배정]`];
  r.propertyIds.forEach((id,i)=>{
    const p = propById(id); if(!p) return;
    const st = staffById((r.assign||{})[id]);
    const pri = (r.priorityIds||[]).includes(id) ? '●' : '-';
    const note = (r.dayNotes||{})[id] || '';
    lines.push(`${i+1}. ${p.name} / ${pri} / ${st?st.name:'미정'}${note?' / '+note:''}`);
  });
  return lines.join('\n');
}
function openAssignSheet(){
  const r = state.todayRecord;
  const counts = {};
  r.propertyIds.forEach(id=>{ const sid=(r.assign||{})[id]; if(sid) counts[sid]=(counts[sid]||0)+1; });
  const unassigned = r.propertyIds.filter(id=>!(r.assign||{})[id]).length;
  const summary = state.staff.map(st=>`<div style="font-size:13px;padding:2px 0;">${esc(st.name)} · ${counts[st.id]||0}곳${staffUnavailable(st)?' <span style="color:var(--clay)">(오늘 ${offLabel(st)})</span>':''}</div>`).join('');
  const root = document.createElement('div');
  root.className='overlay'; root.id='overlay';
  root.innerHTML = `
    <div class="sheet">
      <h2>📋 배정표</h2>
      <div style="margin-bottom:8px;">${summary || '<div style="font-size:13px;">직원이 없어. 관리 도구에서 먼저 등록해줘.</div>'}
        ${unassigned?`<div style="font-size:13px;color:var(--clay);padding-top:4px;">미배정 ${unassigned}곳</div>`:''}</div>
      <textarea id="assignText" class="day-note" style="min-height:200px;" readonly>${esc(buildAssignText())}</textarea>
      <div class="sheet-actions">
        <button class="cancel-btn" id="closeAssign">닫기</button>
        <button class="save-btn" id="shareAssign">공유 / 복사</button>
      </div>
    </div>`;
  document.body.appendChild(root);
  document.getElementById('closeAssign').onclick = ()=> root.remove();
  document.getElementById('shareAssign').onclick = async ()=>{
    const text = buildAssignText();
    if(navigator.share){ try{ await navigator.share({text}); return; }catch(e){ if(e && e.name==='AbortError') return; } }
    try{ await navigator.clipboard.writeText(text); alert('복사했어.'); }
    catch(e){ const ta=document.getElementById('assignText'); ta.removeAttribute('readonly'); ta.select(); alert('텍스트를 길게 눌러 복사해줘.'); }
  };
}
function openStaffEditSheet(st){
  const cur = st || { id:'st_'+Date.now(), name:'', phone:'', days:[0,1,2,3,4,5,6], endTime:'', forbidden:[], onRequest:false };
  const root = document.createElement('div');
  root.className='overlay'; root.id='overlay2';
  root.innerHTML = `
    <div class="sheet">
      <h2>${st?'직원 수정':'직원 추가'}</h2>
      <div class="field"><label>이름</label><input id="sf_name" value="${esc(cur.name)}"></div>
      <div class="field"><label>연락처</label><input id="sf_phone" value="${esc(cur.phone||'')}"></div>
      <div class="field"><label>근무 가능 요일</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${DAY_NAMES.map((n,i)=>`<label style="display:flex;align-items:center;gap:3px;font-size:14px;"><input type="checkbox" class="sf_day" value="${i}" ${(cur.days||[]).includes(i)?'checked':''}>${n}</label>`).join('')}
        </div></div>
      <div class="field"><label>근무 종료 제한 (예: 15:30, 없으면 비움)</label><input id="sf_end" value="${esc(cur.endTime||'')}"></div>
      <div class="field"><label>배정 금지 숙소 키워드 (쉼표로 구분)</label><input id="sf_forbid" value="${esc((cur.forbidden||[]).join(','))}"></div>
      <label style="display:flex;align-items:center;gap:6px;font-size:14px;margin:6px 0;"><input type="checkbox" id="sf_req" ${cur.onRequest?'checked':''}>요일 미정: 연락 온 날만 배정 (평소엔 불가로 처리)</label>
      <div class="sheet-actions">
        <button class="cancel-btn" id="sf_cancel">취소</button>
        <button class="save-btn" id="sf_save">저장</button>
      </div>
      ${st?`<button id="sf_del" style="background:none;border:none;color:var(--clay);font-size:12px;margin-top:10px;cursor:pointer;">직원 삭제</button>`:''}
    </div>`;
  document.body.appendChild(root);
  document.getElementById('sf_cancel').onclick = ()=> root.remove();
  document.getElementById('sf_save').onclick = async ()=>{
    const name = document.getElementById('sf_name').value.trim();
    if(!name){ alert('이름을 입력해줘.'); return; }
    const days = Array.from(root.querySelectorAll('.sf_day')).filter(c=>c.checked).map(c=>Number(c.value));
    const obj = { id:cur.id, name, phone:document.getElementById('sf_phone').value.trim(), days,
      endTime:document.getElementById('sf_end').value.trim(),
      forbidden:document.getElementById('sf_forbid').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),
      onRequest:document.getElementById('sf_req').checked };
    const i = state.staff.findIndex(x=>x.id===cur.id);
    if(i>=0) state.staff[i]=obj; else state.staff.push(obj);
    await saveStaff();
    root.remove();
    const o=document.getElementById('overlay'); if(o) o.remove();
    render();
  };
  const del = document.getElementById('sf_del');
  if(del) del.onclick = async ()=>{
    if(!confirm(cur.name+' 직원을 삭제할까?')) return;
    state.staff = state.staff.filter(x=>x.id!==cur.id);
    await saveStaff();
    root.remove();
    render();
  };
}

function staffAssignedProps(stId){
  const r = state.todayRecord;
  if(!r) return [];
  return r.propertyIds.filter(id => (r.assign||{})[id] === stId);
}
// 전달 표시 (이 폰에만 저장)
const sentKey = ()=> 'sent:'+state.selectedDate;
function getSent(){ try{ return JSON.parse(localStorage.getItem(sentKey())||'{}'); }catch(e){ return {}; } }
function staffSig(stId){
  const r = state.todayRecord; if(!r) return '';
  const ids = staffAssignedProps(stId).slice().sort();
  return ids.map(id=> id+':'+(((r.dayNotes||{})[id])||'')).join('|');
}
function markSent(stId){ const m = getSent(); m[stId] = {t:Date.now(), sig:staffSig(stId)}; try{ localStorage.setItem(sentKey(), JSON.stringify(m)); }catch(e){} }
// none / ok / changed
function sentState(stId){
  const v = getSent()[stId]; if(!v) return {s:'none'};
  const t = (typeof v==='number')? v : v.t;
  const sig = (typeof v==='number')? null : v.sig;
  if(sig!==null && sig!==staffSig(stId)) return {s:'changed', t};
  return {s:'ok', t};
}
function sentBadge(stId){
  const x = sentState(stId);
  if(x.s==='ok') return `<span style="font-size:12px;color:var(--teal);">✅ ${fmtClock(x.t)} 전달함</span>`;
  if(x.s==='changed') return `<span style="font-size:12px;color:var(--clay);font-weight:700;">⚠️ 수정됨 · 다시 보내기</span>`;
  return '';
}
function renderSendStrip(){
  if(!isAdmin() || !state.staff.length || !state.todayRecord) return '';
  const chips = state.staff.map(st=>{
    const n = staffAssignedProps(st.id).length;
    const x = sentState(st.id);
    if(!n && x.s==='none') return '';
    const mark = x.s==='ok' ? ' ✅' : (x.s==='changed' ? ' ⚠️' : '');
    const border = x.s==='changed' ? 'border-color:var(--clay);color:var(--clay);' : (x.s==='ok' ? 'border-color:var(--teal);' : '');
    return `<button class="pill-btn" data-staff-msg="${st.id}" style="${border}">${esc(st.name)} ${n}건 ✉️${mark}</button>`;
  }).filter(Boolean).join('');
  if(!chips) return '';
  return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;align-items:center;"><span style="font-size:12px;color:var(--ink-soft);">보내기</span>${chips}</div>`;
}
function fmtClock(ts){ const d = new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function smsHref(phone, body){
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  return 'sms:'+String(phone).replace(/[^0-9+]/g,'')+(ios?'&':'?')+'body='+encodeURIComponent(body);
}
async function shareOrCopy(text){
  if(navigator.share){ try{ await navigator.share({ text }); return true; }catch(e){ if(e && e.name==='AbortError') return false; } }
  try{ await navigator.clipboard.writeText(text); alert('복사했어. 카톡에 붙여넣어줘.'); return true; }
  catch(e){ prompt('아래 문구를 복사해줘', text); return true; }
}
function getTemplates(){ try{ return JSON.parse(localStorage.getItem('pref:noticeTpl')||'[]'); }catch(e){ return []; } }
function saveTemplates(a){ try{ localStorage.setItem('pref:noticeTpl', JSON.stringify(a.slice(0,8))); }catch(e){} }
function openNoticeSheet(){
  const root = document.createElement('div');
  root.className='overlay'; root.id='overlay';

function buildPersonalText(st, withPw, withAddr, greet){
  if(withAddr===undefined) withAddr = true;
  const r = state.todayRecord;
  const ids = staffAssignedProps(st.id);
  const NUM = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
  const tm = (t)=> /^\d{1,2}$/.test(String(t).trim()) ? String(t).trim()+'시' : String(t).trim();
  const bar = '━━━━━━━━━━━━';
  const lines = [`${renderDateLabel()} ${st.name}님 일정 (${ids.length}곳)`];
  ids.forEach((id,i)=>{
    const p = propById(id); if(!p) return;
    const note = (r.dayNotes||{})[id];
    lines.push('');
    if(i>0){ lines.push(bar); }
    const pwTxt = /매번\s*(바뀜|바뀌|변경)/.test(p.password||'') ? '비번 추후 전달' : (p.password||'');

    if(withAddr && p.address) lines.push(`- ${p.address}`);
    if(note) lines.push(`- ${note}`);
  });
  if(greet){ lines.push(''); lines.push(greet); }
  return lines.join('\n');
}

function loadImageEl(file){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); res(img); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('이미지를 열 수 없어')); };
    img.src = url;
  });
}
function imgToDataUrl(img, maxDim, quality){
  const r = Math.min(1, maxDim / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * r)), h = Math.max(1, Math.round(img.height * r));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  return c.toDataURL('image/jpeg', quality);
}
async function uploadPhotos(propId, files){
  const date = state.selectedDate;
  let ok = 0;
  for(const file of files){
    try{
      const img = await loadImageEl(file);
      let full = imgToDataUrl(img, 1280, 0.72);
      if(full.length > 700000) full = imgToDataUrl(img, 1000, 0.6);
      const thumb = imgToDataUrl(img, 240, 0.6);
      const id = date+'_'+propId+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
      const base = { pdate: date, propId, id, ts: Date.now(), by: cloud.user.email };
      await cloud.fn.setDoc(kvDoc('pf:'+id), { ...base, kind:'full', data: full });
      await cloud.fn.setDoc(kvDoc('photo:'+id), { ...base, kind:'thumb', thumb });
      ok++;
    }catch(e){ alert('사진 올리기에 실패했어: '+(e.message||e)); }
  }
  return ok;
}

function readLocalMonth(){

  for(let d=-6; d<=38; d++){
    const dt = new Date(year, month, d); const ds = ymd(dt.getFullYear(), dt.getMonth(), dt.getDate());

  }

function moveCalMonth(delta){
  let { year, month } = state.calMonth;
  month += delta;

  while(month > 11){ month -= 12; year++; }
  state.calMonth = { year, month };
  watchMonth();

}

  for(let i=0; i<rowsNeeded*7; i++){
    const dt = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate() + i);

async function moveProperty(id){
  const p = propById(id); const rec = state.todayRecord;
  if(!p || !rec) return;
  const v = prompt(p.name+' 일정을 어느 날짜로 옮길까? (예: 10/15)');
  if(!v) return;
  const m = v.match(/(\d{1,2})\s*[\/\-.월]\s*(\d{1,2})/);
  if(!m){ alert('날짜를 "10/15" 형식으로 입력해줘.'); return; }
  const yy = Number(state.selectedDate.slice(0,4));
  const ds = yy+'-'+pad2(Number(m[1]))+'-'+pad2(Number(m[2]));
  if(ds === state.selectedDate){ alert('같은 날짜야.'); return; }
  let tgt = null;
  try{ const x = await window.storage.get('today:'+ds, false); if(x && x.value) tgt = JSON.parse(x.value); }catch(e){}
  if(!tgt) tgt = { propertyIds:[], tasks:{}, priorityIds:[], excludedIds:[] };
  tgt.propertyIds = tgt.propertyIds||[]; tgt.tasks = tgt.tasks||{}; tgt.priorityIds = tgt.priorityIds||[]; tgt.excludedIds = tgt.excludedIds||[];
  if(tgt.propertyIds.includes(id)){ alert('그 날짜에 이미 있어.'); return; }
  if(!confirm(p.name+' 일정을 '+Number(m[1])+'/'+Number(m[2])+'로 옮길까?')) return;
  tgt.propertyIds.push(id);
  tgt.tasks[id] = (rec.tasks||{})[id] || tasksForProperty(p).map(text=>({text, done:false}));
  if((rec.priorityIds||[]).includes(id) && !tgt.priorityIds.includes(id)) tgt.priorityIds.push(id);
  if((rec.assign||{})[id]){ tgt.assign = tgt.assign||{}; tgt.assign[id] = rec.assign[id]; }
  if((rec.dayNotes||{})[id]){ tgt.dayNotes = tgt.dayNotes||{}; tgt.dayNotes[id] = rec.dayNotes[id]; }
  try{ await window.storage.set('today:'+ds, JSON.stringify(tgt), false); }catch(e){ alert('저장에 실패했어.'); return; }
  // 저장 직후 실시간 반영으로 state.todayRecord가 새 객체로 바뀔 수 있어서 다시 가져옴
  const cur = state.todayRecord || rec;
  cur.propertyIds = (cur.propertyIds||[]).filter(x=>x!==id);
  if(cur.tasks) delete cur.tasks[id];
  cur.priorityIds = (cur.priorityIds||[]).filter(x=>x!==id);
  if(cur.assign) delete cur.assign[id];
  if(cur.dayNotes) delete cur.dayNotes[id];
  state.todayRecord = cur;
  await saveTodayRecord();
  render();
}
function parseScheduleText(text, defYear){
  const out = {};
  String(text||'').split(/\r?\n/).forEach(line=>{
    const m = line.match(/^\s*(?:(\d{4})[-\/.])?(\d{1,2})\s*[\/\-.월]\s*(\d{1,2})\s*일?\s*(?:\([^)]*\))?\s*[:：]?\s*(.*)$/);
    if(!m) return;
    const y = m[1] ? Number(m[1]) : defYear;
    const ds = y+'-'+pad2(Number(m[2]))+'-'+pad2(Number(m[3]));
    m[4].split(/[,，]/).map(x=>x.trim()).filter(Boolean).forEach(it=>{
      const parts = it.split('|');
      (out[ds] = out[ds] || []).push({ raw: parts[0].trim(), note: parts.slice(1).join('|').trim() });
    });
  });
  return out;
}

function parseKakaoSchedule(text, defYear){
  const out = []; const seen = new Set();
  const nowM = new Date().getMonth()+1;
  String(text||'').split(/\r?\n/).forEach(line=>{
    const m = line.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일\s*(?:\([^)]*\))?\s*(.*)$/);
    if(!m) return;
    const mo = Number(m[1]), d = Number(m[2]); let yy = defYear;
    if(mo < nowM - 6) yy = defYear + 1;
    const ds = yy+'-'+pad2(mo)+'-'+pad2(d);
    if(seen.has(ds)) return; seen.add(ds);
    const rest = m[3] || '';
    const g = rest.match(/(\d{1,2})\s*[~∼～\-]\s*(\d{1,2})/);
    const n = rest.match(/(\d+)\s*명/);
    out.push({ ds, gap: g ? g[1]+'~'+g[2] : '', guests: n ? Number(n[1]) : 0, today: /[■□◼◻▪]|당일/.test(rest) });
  });
  return out;
}

function cleanAddr(a){ return typeof a==='string' ? a.replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').trim() : a; }
function cleanProps(list){ return Array.isArray(list) ? list.map(p=> (p && typeof p.address==='string' && p.address.includes('](')) ? Object.assign({}, p, {address: cleanAddr(p.address)}) : p) : list; }
function normalizeAddressSpacing(address){
  if(!address) return address;
  // "로" 뒤에 바로 건물번호 숫자가 오면 띄어씀. 단 "OO로25길"처럼 로 다음이 길로 이어지는
  // 도로명(번길)은 규정상 붙여 쓰는 게 맞아서 그대로 둠.
  let a = address.replace(/(로)(\d+)(?!\d)(?!길)/g, '$1 $2');
  a = a.replace(/(길)(\d+)(?!\d)/g, '$1 $2');
  return a;
}

async function cleanupAddressSpacing(){
  let changed = 0;
  state.properties = state.properties.map(p=>{
    const fixed = normalizeAddressSpacing(p.address);
    if(fixed !== p.address) changed++;
    return { ...p, address: fixed };
  });
  await saveProperties();
  render();
  alert(changed > 0 ? `${changed}곳 주소 띄어쓰기를 정리했어.` : '이미 다 정리돼 있어서 바뀐 게 없어.');
}

function unitFromAddr(a){ const t = String(a||''); const b = t.match(/([A-Za-z])\s*동\s*(\d{3,4})\s*호/); if(b) return b[1].toUpperCase()+b[2]; const ms = [...t.matchAll(/(\d{3,4})\s*호/g)]; return ms.length ? ms[ms.length-1][1] : ''; }
function suggestPropName(old, all, addr){
  if(/^창천/.test(String(old||'').trim()) && addr && unitFromAddr(addr)) { const rm = /투룸/.test(old) ? '2룸' : ((String(old).match(/([123])\s*룸/)||[])[1] ? String(old).match(/([123])\s*룸/)[1]+'룸' : '2룸'); return ((/잇다/.test(old) || /신촌로\s*3나?길\s*8-10/.test(addr)) ? '창천잇다 ' : '창천 ')+rm+' '+unitFromAddr(addr); }
  let r = suggestPropName0(old, all).replace(/(\d)호(?=\s|$)/g,'$1');
  if(addr && !/\d{3,}/.test(r) && !/\d층$/.test(r) && !/\s[A-D]$/.test(r)){ const u = unitFromAddr(addr); if(u) r += ' '+u; else { const f = String(addr).match(/(\d{1,2})\s*층/); if(f) r += ' '+f[1]+'층'; } }
  return r;
}
function suggestPropName0(old, all){
  let n = String(old||'').trim().replace(/\s+/g,' ');
  let m;
  if((m = n.match(/^(?:LG|엘지)\s*팰리스\s*(\d{3,4})호?$/i))) return `LG팰리스 ${m[1]}호`;
  if((m = n.match(/^파라다이스텔\s*(\d{3,4})호?$/))) return `파라다이스텔 ${m[1]}호`;
  if((m = n.match(/^동교스테이\s*([A-Da-d])$/))) return `동교스테이 ${m[1].toUpperCase()}`;
  if((m = n.match(/^창천동?\s*잇다\s*(\d룸)\s*(\d{3}호)?$/))) return `창천잇다 ${m[1]}${m[2]?' '+m[2]:''}`;
  if((m = n.match(/^홍대\s*(\d{3})호?$/))) return `홍대 ${m[1]}호`;
  if((m = n.match(/^와우산로\s*(\d+)$/))) return `와우산로 ${m[1]}`;
  n = n.replace(/투룸/g,'2룸').replace(/원룸/g,'1룸').replace(/북측/g,'복층');
  if((m = n.match(/^(망원|연남|용강|서교|창천|이대|합정|상수|연희)동?\s*([123]룸|복층)(\s*\d층)?$/))) n = `${m[1]} ${m[2]}${m[3]?' '+m[3].trim():''}`;
  if(n==='망원 3룸' && all.some(x=>/^망원동?\s*3룸\s*2층$/.test(x.name))) n = '망원 3룸 1층';
  return n;
}

    <div id="rn_list" style="max-height:52vh;overflow-y:auto;"></div>
    <div class="sheet-actions"><button class="cancel-btn" id="rn_close">닫기</button><button class="save-btn" id="rn_apply">바꾸기</button></div>
  </div>`;
  document.body.appendChild(root);

  root.querySelector('#rn_apply').onclick = async ()=>{
    const todo = rows.filter(r=>r.nu.trim() && r.nu.trim()!==r.old);
    if(!todo.length) return;
    if(!confirm(`${todo.length}곳 이름을 바꿀까?`)) return;
    const map = new Map(todo.map(r=>[r.id, r.nu.trim()]));

      if(!map.has(p.id)) return p;
      const al = Array.from(new Set([p.name, ...(p.aliases||[])])).filter(x=>x && x!==map.get(p.id));
      return { ...p, name: map.get(p.id), aliases: al };
    });
    await saveProperties();

}

function getWorkEntry(dateStr){

async function upsertWorkEntry(dateStr, patch){
  const idx = state.workLog.findIndex(e=>e.date === dateStr);
  if(idx === -1){
    state.workLog.push({ date: dateStr, clockIn: null, clockOut: null, ...patch });
  } else {
    state.workLog[idx] = { ...state.workLog[idx], ...patch };
  }
  await saveWorkLog();
}
function nowHHMM(){
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function durationMinutes(clockIn, clockOut){
  const [ih, im] = clockIn.split(':').map(Number);
  const [oh, om] = clockOut.split(':').map(Number);
  let mins = (oh*60+om) - (ih*60+im);
  if(mins < 0) mins += 24*60; // 자정 넘어간 경우
  return mins;
}
function formatMinutes(mins){
  const h = Math.floor(mins/60), m = mins%60;
  return `${h}시간 ${m}분`;
}
function formatDuration(clockIn, clockOut){
  return formatMinutes(durationMinutes(clockIn, clockOut));
}
function computeThisMonthPay(){
  const now = new Date();
  const monthPrefix = `${now.getFullYear()}-${pad2(now.getMonth()+1)}`;
  const entries = state.workLog.filter(e => e.date.startsWith(monthPrefix) && e.clockIn && e.clockOut);
  const totalMinutes = entries.reduce((sum,e)=> sum + durationMinutes(e.clockIn, e.clockOut), 0);
  const pay = Math.round((totalMinutes/60) * (state.hourlyWage || 0));
  return { totalMinutes, pay };
}
async function setHourlyWage(){
  const cur = state.hourlyWage ? String(state.hourlyWage) : '';
  const input = prompt('시급을 숫자로 입력해줘 (원)', cur);

  await saveHourlyWage(n);
  render();
}

function triggerPhotoShare(propertyId){
  const p = propById(propertyId);
  if(!p) return;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.multiple = true;
  input.capture = 'environment';
  input.onchange = async (e)=>{
    const files = Array.from(e.target.files || []);
    if(files.length === 0) return;
    try{
      if(navigator.canShare && navigator.canShare({ files })){
        await navigator.share({ files, title: p.name, text: `${p.name} 사진` });
      } else {
        alert('이 브라우저에서는 자동 공유가 안 돼. 사진 앱에서 담당자에게 직접 보내줘.');

    }
    await logPhotoSend(propertyId, p.name, files.length);
    render();

  input.click();
}

async function stepClockTime(field, delta){
  const entry = getWorkEntry(todayStr()) || { clockIn: null, clockOut: null };
  const cur = entry[field] || nowHHMM();
  const [h, m] = cur.split(':').map(Number);
  let total = ((h*60 + m + delta) % 1440 + 1440) % 1440;
  const nh = Math.floor(total/60), nm = total%60;
  const newVal = `${String(nh).padStart(2,'0')}:${String(nm).padStart(2,'0')}`;
  await upsertWorkEntry(todayStr(), { [field]: newVal });
  render();
}

function pad2(n){ return String(n).padStart(2,'0'); }
function dateKeyOf(year, month, day){ return `${year}-${pad2(month+1)}-${pad2(day)}`; }

function renderScheduleCalendar(){
  const dateLabel = formatDateLabel(state.selectedDate);
  const isTodaySelected = state.selectedDate === todayStr();

  if(!state.scheduleCalendarOpen){
    return `
      <div class="schedule-cal-bar">
        <div>${isTodaySelected ? '📅 오늘 · ' : '📅 '}<b>${dateLabel}</b></div>
        <button id="toggleScheduleCal">다른 날짜 ▾</button>
      </div>
    `;
  }

  const { year, month } = state.historyMonth;
  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStrVal = todayStr();

  let cells = '';
  for(let i=0;i<firstWeekday;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const key = dateKeyOf(year, month, d);
    const hasRecord = state.historyDates && state.historyDates.has(key);
    const isTodayCell = key === todayStrVal;
    const isSelected = key === state.selectedDate;
    cells += `
      <div class="cal-day ${hasRecord?'has-record':''} ${isTodayCell?'is-today':''} ${isSelected?'selected':''}" data-select-date="${key}">
        ${d}${hasRecord?'<div class="dot"></div>':''}
      </div>
    `;
  }

  return `
    <div class="history-nav">
      <button data-month-nav="-1">‹ 이전달</button>
      <div class="month-label">${year}년 ${month+1}월</div>
      <button data-month-nav="1">다음달 ›</button>
    </div>
    <div class="cal-weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="cal-grid">${cells}</div>
    <button class="relist-btn" id="toggleScheduleCal" style="width:100%;margin-bottom:12px;">달력 접기 ▴</button>
  `;
}

function formatDateLabel(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const days = ['일','월','화','수','목','금','토'];
  const wd = new Date(y, m-1, d).getDay();
  return `${m}월 ${d}일 (${days[wd]})`;
}

function exportWorkLogCSV(){
  const hasWage = !!state.hourlyWage;
  const header = hasWage ? ['날짜','출근','퇴근','근무시간','예상급여(원)'] : ['날짜','출근','퇴근','근무시간'];
  const rows = [header];
  state.workLog.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
    const duration = (e.clockIn && e.clockOut) ? formatDuration(e.clockIn, e.clockOut) : '';
    const row = [e.date, e.clockIn || '', e.clockOut || '', duration];
    if(hasWage){
      const pay = (e.clockIn && e.clockOut) ? Math.round((durationMinutes(e.clockIn, e.clockOut)/60) * state.hourlyWage) : '';
      row.push(pay);
    }
    rows.push(row);
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '출퇴근기록.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

let kakaoSDKPromise = null;
function loadKakaoSDK(key){
  if(window.kakao && window.kakao.maps && window.kakao.maps.services){
    return Promise.resolve();
  }
  if(kakaoSDKPromise) return kakaoSDKPromise;
  kakaoSDKPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&autoload=false&libraries=services`;
    script.onload = ()=>{
      window.kakao.maps.load(()=> resolve());
    };
    script.onerror = ()=>{ kakaoSDKPromise = null; reject(new Error('sdk load failed')); };
    document.head.appendChild(script);
  });
  return kakaoSDKPromise;
}

function cleanAddressForGeocode(address){
  if(!address) return address;
  let a = address.trim();
  // "도로명 156, 1408호"처럼 콤마 뒤에 호수가 붙은 경우 콤마 앞부분만 사용
  const commaIdx = a.lastIndexOf(',');
  if(commaIdx > 0){
    return a.slice(0, commaIdx).trim();
  }
  // "4-17 102호" / "483-33 201호" / "b동201호" 처럼 끝에 붙은 호수/층 제거
  const stripped = a.replace(/\s*[a-zA-Z0-9]*\s*\d+\s*(호|층)\s*$/, '').trim();
  return stripped || a;
}

function geocodeAddress(address){
  if(state.geocodeCache[address]) return Promise.resolve(state.geocodeCache[address]);
  const geocoder = new kakao.maps.services.Geocoder();
  return new Promise((resolve)=>{
    const tryGeocode = (addr, onFail)=>{
      geocoder.addressSearch(addr, (result, status)=>{
        if(status === kakao.maps.services.Status.OK && result[0]){
          const coord = { lat: Number(result[0].y), lng: Number(result[0].x) };
          state.geocodeCache[address] = coord; // 원본 주소를 키로 캐싱
          resolve(coord);
        } else if(onFail){
          onFail();
        } else {
          resolve(null);
        }
      });
    };
    // 1차: 원본 주소 그대로 시도, 실패하면 호수/층 뗀 주소로 재시도
    tryGeocode(address, ()=>{
      const cleaned = cleanAddressForGeocode(address);
      if(cleaned && cleaned !== address){
        tryGeocode(cleaned, ()=> resolve(null));
      } else {
        resolve(null);
      }
    });
  });
}

let kakaoMapInstance = null;
async function setupMapIfNeeded(){
  if(!state.kakaoKey) return;
  const container = document.getElementById('kakaoMapDiv');
  if(!container) return;

  container.innerHTML = '<div style="padding:16px;font-size:13px;color:var(--ink-soft);">지도를 불러오는 중...</div>';
  try{
    await loadKakaoSDK(state.kakaoKey);
  }catch(e){
    container.innerHTML = '<div style="padding:16px;font-size:13px;color:var(--clay);">지도를 불러오지 못했어. 키가 맞는지, 이 주소가 카카오 개발자센터의 Web 플랫폼에 등록돼 있는지 확인해줘.</div>';
    return;
  }
  container.innerHTML = '';

  const targetIds = state.mapScope === 'today'
    ? (state.todayRecord ? state.todayRecord.propertyIds : [])
    : state.properties.map(p=>p.id);
  const targets = targetIds.map(id=>propById(id)).filter(p=>p && p.address);

  if(targets.length === 0 && !state.companyLocation){
    container.innerHTML = '<div style="padding:16px;font-size:13px;color:var(--ink-soft);">표시할 업체가 없어. ' + (state.mapScope==='today' ? '먼저 "오늘" 탭에서 오늘의 리스트를 만들어줘.' : '') + '</div>';
    return;
  }

  const map = new kakao.maps.Map(container, {
    center: new kakao.maps.LatLng(37.5563, 126.9236), // 마포구 기준
    level: 7
  });
  kakaoMapInstance = map;

  const bounds = new kakao.maps.LatLngBounds();
  const infowindow = new kakao.maps.InfoWindow({ removable: true });
  let placed = 0;
  let companyGeocodeFailed = false;

  for(const p of targets){
    const coord = await geocodeAddress(p.address);
    if(!coord) continue;
    const pos = new kakao.maps.LatLng(coord.lat, coord.lng);
    const marker = new kakao.maps.Marker({ position: pos, map });
    kakao.maps.event.addListener(marker, 'click', ()=>{
      const navUrl = `https://map.kakao.com/link/to/${encodeURIComponent(p.name)},${coord.lat},${coord.lng}`;
      infowindow.setContent(`
        <div style="padding:8px 10px;font-size:12.5px;line-height:1.6;">
          <div style="font-weight:700;margin-bottom:4px;">${esc(p.name)}</div>
          <a href="${navUrl}" target="_blank" rel="noopener" style="color:#2B6E63;text-decoration:underline;">🧭 길찾기</a>
        </div>
      `);
      infowindow.open(map, marker);
    });
    bounds.extend(pos);
    placed++;
  }

  if(state.companyLocation){
    const coord = await geocodeAddress(state.companyLocation.address);
    if(coord){
      const pos = new kakao.maps.LatLng(coord.lat, coord.lng);
      const companyLabel = state.companyLocation.name || '회사';
      const label = new kakao.maps.CustomOverlay({
        position: pos, map, yAnchor: 1.4,
        content: `<div style="background:#A6432A;color:#fff;font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;white-space:nowrap;">🏢 ${esc(companyLabel)}</div>`
      });
      const companyMarker = new kakao.maps.Marker({ position: pos, map });
      kakao.maps.event.addListener(companyMarker, 'click', ()=>{
        const navUrl = `https://map.kakao.com/link/to/${encodeURIComponent(companyLabel)},${coord.lat},${coord.lng}`;
        const c = state.companyLocation;
        infowindow.setContent(`
          <div style="padding:8px 10px;font-size:12.5px;line-height:1.6;">
            <div style="font-weight:700;margin-bottom:4px;">🏢 ${esc(companyLabel)}</div>
            ${c.owner ? `<div>대표 ${esc(c.owner)}</div>` : ''}
            ${c.phone ? `<div>${esc(c.phone)}</div>` : ''}
            ${c.carPlate ? `<div>🚗 ${esc(c.carPlate)}</div>` : ''}
            <a href="${navUrl}" target="_blank" rel="noopener" style="color:#2B6E63;text-decoration:underline;">🧭 길찾기</a>
          </div>
        `);
        infowindow.open(map, companyMarker);
      });
      bounds.extend(pos);
      placed++;
    } else {
      companyGeocodeFailed = true;
    }
  }

  await saveGeocodeCache();

function normalizeForMatch(s){
  return (s||'').replace(/\s+/g,'').toLowerCase();
}
function levenshteinDistance(a, b){
  const dp = [];
  for(let i=0;i<=a.length;i++){ dp.push([i, ...Array(b.length).fill(0)]); }
  for(let j=0;j<=b.length;j++) dp[0][j] = j;
  for(let i=1;i<=a.length;i++){
    for(let j=1;j<=b.length;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
    }
  }
  return dp[a.length][b.length];
}
function nameKey(s){
  return (s||'').toLowerCase().replace(/\s+/g,'')
    .replace(/lg/g,'엘지').replace(/팰리스/g,'').replace(/호/g,'')
    .replace(/투룸/g,'2룸').replace(/원룸/g,'1룸').replace(/북측/g,'복층')
    .replace(/동(?=\d)/g,'').replace(/25길9(?=\d)/g,'25길')
    .replace(/2룸(?=\d{3})/g,'');
}
function findBestPropertyMatch(line){
  const normLine = normalizeForMatch(line);
  // 0차: 이름이 정확히 같으면 그걸 우선
  const exact = state.properties.find(p=>normalizeForMatch(p.name)===normLine) || state.properties.find(p=>(p.aliases||[]).some(a=>normalizeForMatch(a)===normLine));
  if(exact) return exact;
  // 0.5차: 표기만 다른 같은 이름(LG/엘지, 투룸/2룸 등) 정리해서 비교
  const keyLine = nameKey(line);
  const keyHit = state.properties.filter(p=>nameKey(p.name)===keyLine || (p.aliases||[]).some(a=>nameKey(a)===keyLine));
  if(keyHit.length===1) return keyHit[0];
  // 1차: 포함 관계로 정확히 찾히는 것 우선 (더 짧게 일치하는 쪽이 더 정확한 매칭)
  let best = null;
  state.properties.forEach(p=>{
    const normName = normalizeForMatch(p.name);
    if(normName.includes(normLine) || normLine.includes(normName)){
      if(!best || normName.length < normalizeForMatch(best.name).length) best = p;
    }
  });
  if(best) return best;
  // 2차: 축약/오타 허용 - 편집거리(유사도) 기준으로 가장 가까운 것 사용
  let bestDist = Infinity, bestP = null;
  state.properties.forEach(p=>{
    const normName = normalizeForMatch(p.name);
    const d = levenshteinDistance(normLine, normName);
    if(d < bestDist){ bestDist = d; bestP = p; }
  });
  const threshold = Math.max(2, Math.floor(normLine.length * 0.4));
  return (bestP && bestDist <= threshold) ? bestP : null;
}
function matchPastedCalendar(text){
  // 줄바꿈뿐 아니라 "-", "·", "," 로 구분된 순서 메시지도 인식
  const lines = text.split(/[\n\-,·/]+/).map(l=>l.trim()).filter(l=>l.length>=2);
  let matchedCount = 0;
  const matchedNames = [];
  const orderedIds = [];
  lines.forEach(line=>{
    const match = findBestPropertyMatch(line);
    if(match){
      if(!orderedIds.includes(match.id)) orderedIds.push(match.id);
      if(!state.pickerSelection.has(match.id)){
        state.pickerSelection.add(match.id);
        matchedCount++;
        matchedNames.push(match.name);
      }
    }
  });
  state.pasteMatchOrder = orderedIds;
  return { matchedCount, matchedNames };
}

function parseInTimeForSort(inVal){
  const n = parseInt(inVal, 10);
  return isNaN(n) ? 9999 : n; // 체크인 시간 없으면 맨 뒤로
}

function buildOrderedRecord(){
  const tasks = {};
  const selected = Array.from(state.pickerSelection);
  // 항상 당일체크인으로 표시하도록 지정해둔 업체는 자동으로 우선순위에 포함
  selected.forEach(id=>{
    const p = propById(id);
    if(p && p.alwaysPriority) state.pickerPriority.add(id);
  });
  const sortByPriorityAndTime = (a,b)=>{
    const pa = state.pickerPriority.has(a) ? 0 : 1;
    const pb = state.pickerPriority.has(b) ? 0 : 1;
    if(pa !== pb) return pa - pb;
    return parseInTimeForSort(propById(a).in) - parseInTimeForSort(propById(b).in);
  };
  let orderedIds;
  if(state.pasteMatchOrder && state.pasteMatchOrder.length > 0){
    // 붙여넣은 메시지에 적힌 순서를 최우선으로 쓰고, 그 외 추가로 체크한 곳은 뒤에 붙임
    const pasteIds = state.pasteMatchOrder.filter(id => state.pickerSelection.has(id));
    const rest = selected.filter(id => !pasteIds.includes(id)).sort(sortByPriorityAndTime);
    orderedIds = [...pasteIds, ...rest];
  } else {
    orderedIds = selected.sort(sortByPriorityAndTime);
  }
  orderedIds.forEach(id=>{
    const p = propById(id);
    tasks[id] = tasksForProperty(p).map(text=>({text, done:false}));
  });
  return { propertyIds: orderedIds, tasks, priorityIds: Array.from(state.pickerPriority) };
}

async function applyEditToday(){
  const existingIds = state.todayRecord.propertyIds;
  const existingTasks = state.todayRecord.tasks;
  const existingExcluded = state.todayRecord.excludedIds || [];
  const newSelection = Array.from(state.pickerSelection);
  // 항상 당일체크인으로 표시하도록 지정해둔 업체는 자동으로 우선순위에 포함
  newSelection.forEach(id=>{
    const p = propById(id);
    if(p && p.alwaysPriority) state.pickerPriority.add(id);
  });
  // 기존에 있던 곳은 순서·진행상황 그대로 유지, 새로 체크한 곳만 뒤에 추가
  const kept = existingIds.filter(id => state.pickerSelection.has(id));
  const removed = existingIds.filter(id => !state.pickerSelection.has(id));
  const addedRaw = newSelection.filter(id => !existingIds.includes(id));
  let added;
  if(state.pasteMatchOrder && state.pasteMatchOrder.length > 0){
    const pasteAdded = state.pasteMatchOrder.filter(id => addedRaw.includes(id));
    const restAdded = addedRaw.filter(id => !pasteAdded.includes(id))
      .sort((a,b)=> parseInTimeForSort(propById(a).in) - parseInTimeForSort(propById(b).in));
    added = [...pasteAdded, ...restAdded];
  } else {
    added = addedRaw.sort((a,b)=> parseInTimeForSort(propById(a).in) - parseInTimeForSort(propById(b).in));
  }
  const finalIds = [...kept, ...added];
  const tasks = {};
  finalIds.forEach(id=>{
    tasks[id] = existingTasks[id] || tasksForProperty(propById(id)).map(text=>({text, done:false}));
  });
  const newlyExcluded = removed.map(id=>{
    const p = propById(id);
    return { id, name: p ? p.name : '(삭제된 업체)', tasks: existingTasks[id] || [], excludedAt: new Date().toISOString() };
  });
  // 다시 추가된 곳은 "제외됨" 목록에서 빠짐
  const excludedIds = [...existingExcluded.filter(e => !finalIds.includes(e.id)), ...newlyExcluded];
  state.todayRecord = { propertyIds: finalIds, tasks, priorityIds: Array.from(state.pickerPriority), excludedIds,
    assign: state.todayRecord.assign || {}, dayNotes: state.todayRecord.dayNotes || {} };
  closeEditToday();
  await saveTodayRecord();
  render();
}

  if(!isAdmin()) return;
  const keys = Object.keys(localStorage).filter(isSharedKey);
  if(!keys.length){ alert('이 폰에 올릴 데이터가 없어.'); return; }
  if(!confirm(`이 폰에 저장된 숙소·직원·일정 데이터 ${keys.length}건을 서버에 올릴까?\n서버에 같은 항목이 있으면 덮어써.`)) return;
  let n = 0;
  for(const k of keys){
    const v = localStorage.getItem(k);
    if(!v) continue;
    try{ await cloud.fn.setDoc(kvDoc(k), { value:v, updatedAt:Date.now(), by:cloud.user.email }); n++; }catch(e){ alert('올리는 중 오류: '+k); return; }
  }
  alert(`${n}건을 서버에 올렸어.`);
  await loadProperties(); await loadStaff(); await loadTodayRecord();
  render();
}

// ===== 로그인 화면 =====
function showLogin(msg){
  let el = document.getElementById('loginWrap');
  if(el) el.remove();
  el = document.createElement('div');
  el.className = 'login-wrap'; el.id = 'loginWrap';
  el.innerHTML = `
    <div class="login-box">
      <h2>bnb care</h2>
      <div style="font-size:13px;color:var(--ink-soft,#777);">직원 전용</div>
      <input id="lg_id" type="text" inputmode="email" autocapitalize="off" autocomplete="username" placeholder="아이디 (또는 이메일)">
      <input id="lg_pw" type="password" autocomplete="current-password" placeholder="비밀번호">
      <div class="login-err" id="lg_err">${esc(msg||'')}</div>
      <button id="lg_btn">로그인</button>
    </div>`;
  document.body.appendChild(el);
  const go = async ()=>{
    let id = document.getElementById('lg_id').value.trim();
    const pw = document.getElementById('lg_pw').value;
    if(!id || !pw){ document.getElementById('lg_err').textContent = '아이디와 비밀번호를 입력해줘.'; return; }
    if(!id.includes('@')) id += EMAIL_DOMAIN;
    const btn = document.getElementById('lg_btn'); btn.disabled = true; btn.textContent = '확인 중…';
    try{
      await cloud.fn.signInWithEmailAndPassword(cloud.auth, id, pw);
    }catch(e){
      btn.disabled = false; btn.textContent = '로그인';
      const bad = ['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'];
      document.getElementById('lg_err').textContent = bad.includes(e.code) ? '아이디 또는 비밀번호가 맞지 않아.' : (e.code==='auth/too-many-requests' ? '시도가 너무 많아. 잠시 후 다시 해줘.' : '로그인에 실패했어. 인터넷 연결을 확인해줘.');
    }
  };
  document.getElementById('lg_btn').onclick = go;
  document.getElementById('lg_pw').onkeydown = e=>{ if(e.key==='Enter') go(); };
}

let appStarted = false;
async function startApp(){
  if(appStarted) return;
  appStarted = true;
  const lw = document.getElementById('loginWrap'); if(lw) lw.remove();
  document.body.classList.toggle('not-admin', !isAdmin());
  document.body.classList.toggle('company', COMPANY_MODE);
  if(COMPANY_MODE){
    document.title = 'bnb care';
    const h1 = document.querySelector('.topbar h1'); if(h1) h1.textContent = 'bnb care';
    const tb = document.querySelector('.topbar'); if(tb && !document.getElementById('topUser') && cloud && cloud.user){
      tb.style.position = 'relative';
      const b = document.createElement('button'); b.id = 'topUser'; b.className = 'top-user';
      b.textContent = (cloud.user.email||'').split('@')[0] + (isAdmin() ? ' · 관리자' : '');
      b.onclick = async ()=>{ if(confirm('로그아웃할까?')){ await cloud.fn.signOut(cloud.auth); location.reload(); } };
      tb.appendChild(b);
    }
    if(!state._init){ state.tab = 'cal'; state._init = 1; }
    if(!isAdmin() && state.tab !== 'today' && state.tab !== 'cal') state.tab = 'today';
  }
  state.selectedDate = todayStr();
  try{ const v = localStorage.getItem('pref:calView'); if(v) state.calView = v; }catch(e){}
  await loadProperties();
  await loadStaff();
  await loadTodayRecord();
  await loadKakaoKey();
  await loadCompanyLocation();
  await loadHourlyWage();
  await loadGeocodeCache();
  await loadPhotoLog();
  await loadReportLog();
  await loadWorkLog();
  render();
  if(cloud) watchShared();
  // 관리자 첫 로그인: 서버가 비어 있고 이 폰에 예전 데이터가 있으면 올릴지 물어봄
  if(cloud && isAdmin() && state.properties.length === 0 && localStorage.getItem(KEY_PROPS)){
    if(confirm('서버에 숙소 데이터가 아직 없어. 이 폰에 저장된 데이터를 서버로 올릴까?')) await uploadLocalData();
  }
}

(async function init(){
  if(!CLOUD_ENABLED){ startApp(); return; }
  document.getElementById('view').innerHTML = '<div class="empty">불러오는 중…</div>';
  try{
    await initCloud();
  }catch(e){
    document.getElementById('view').innerHTML = '<div class="empty">서버에 연결하지 못했어.<br>인터넷 연결을 확인하고 다시 열어줘.</div>';
    return;
  }
  cloud.fn.onAuthStateChanged(cloud.auth, user=>{
    cloud.user = user;
    if(user){ startApp(); }
    else{ appStarted = false; showLogin(); }
  });
})();
</script>
