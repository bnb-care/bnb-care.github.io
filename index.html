function normalizeForMatch(s){
  return (s||'').replace(/\s+/g,'').toLowerCase();
}
function levenshteinDistance(a, b){
  const dp = [];
  for(let i=0;i<=a.length;i++){ dp.push([i, ...Array(b.length).fill(0)]); }
  for(let j=0;j<=b.length;j++) dp[0][j] = j;
  for(let i=1;i<=a.length;i++){
    for(let j=1;j<=b.length;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
    }
  }
  return dp[a.length][b.length];
}
function nameKey(s){
  return (s||'').toLowerCase().replace(/\s+/g,'')
    .replace(/lg/g,'엘지').replace(/팰리스/g,'').replace(/호/g,'')
    .replace(/투룸/g,'2룸').replace(/원룸/g,'1룸').replace(/북측/g,'복층')
    .replace(/동(?=\d)/g,'').replace(/25길9(?=\d)/g,'25길')
    .replace(/2룸(?=\d{3})/g,'');
}
function findBestPropertyMatch(line){
  const normLine = normalizeForMatch(line);
  // 0차: 이름이 정확히 같으면 그걸 우선
  const exact = state.properties.find(p=>normalizeForMatch(p.name)===normLine) || state.properties.find(p=>(p.aliases||[]).some(a=>normalizeForMatch(a)===normLine));
  if(exact) return exact;
  // 0.5차: 표기만 다른 같은 이름(LG/엘지, 투룸/2룸 등) 정리해서 비교
  const keyLine = nameKey(line);
  const keyHit = state.properties.filter(p=>nameKey(p.name)===keyLine || (p.aliases||[]).some(a=>nameKey(a)===keyLine));
  if(keyHit.length===1) return keyHit[0];
  // 1차: 포함 관계로 정확히 찾히는 것 우선 (더 짧게 일치하는 쪽이 더 정확한 매칭)
  let best = null;
  state.properties.forEach(p=>{
    const normName = normalizeForMatch(p.name);
    if(normName.includes(normLine) || normLine.includes(normName)){
      if(!best || normName.length < normalizeForMatch(best.name).length) best = p;
    }
  });
  if(best) return best;
  // 2차: 축약/오타 허용 - 편집거리(유사도) 기준으로 가장 가까운 것 사용
  let bestDist = Infinity, bestP = null;
  state.properties.forEach(p=>{
    const normName = normalizeForMatch(p.name);
    const d = levenshteinDistance(normLine, normName);
    if(d < bestDist){ bestDist = d; bestP = p; }
  });
  const threshold = Math.max(2, Math.floor(normLine.length * 0.4));
  return (bestP && bestDist <= threshold) ? bestP : null;
}
function matchPastedCalendar(text){
  // 줄바꿈뿐 아니라 "-", "·", "," 로 구분된 순서 메시지도 인식
  const lines = text.split(/[\n\-,·/]+/).map(l=>l.trim()).filter(l=>l.length>=2);
  let matchedCount = 0;
  const matchedNames = [];
  const orderedIds = [];
  lines.forEach(line=>{
    const match = findBestPropertyMatch(line);
    if(match){
      if(!orderedIds.includes(match.id)) orderedIds.push(match.id);
      if(!state.pickerSelection.has(match.id)){
        state.pickerSelection.add(match.id);
        matchedCount++;
        matchedNames.push(match.name);
      }
    }
  });
  state.pasteMatchOrder = orderedIds;
  return { matchedCount, matchedNames };
}

// 숙소 카드 끌어서 순서 바꾸기 (손잡이를 누른 채로 위아래로 끌기)
function setupCardDrag(){
  document.querySelectorAll('.drag-handle').forEach(h=>{
    h.onclick = (ev)=> ev.stopPropagation();
    const startDrag = (ev)=>{
      if(ev.button !== undefined && ev.button !== 0) return;
      const id = h.dataset.drag;
      const card = h.closest('.job-card');
      const cards = Array.from(document.querySelectorAll('.job-card'));
      const from = cards.indexOf(card); if(from < 0) return;
      ev.preventDefault();
      try{ h.setPointerCapture(ev.pointerId); }catch(e){}
      const sy0 = window.scrollY, y0 = ev.clientY;
      const rects = cards.map(c=>{ const r=c.getBoundingClientRect(); return { top:r.top+sy0, h:r.height }; });
      const myH = rects[from].h + 12;
      // 당일 체크인(🔴)은 항상 맨 위 고정 → 같은 묶음(당일끼리 / 나머지끼리) 안에서만 움직이게 제한
      const priSet = new Set((state.todayRecord.priorityIds)||[]);
      const isPri = c=> priSet.has((c.querySelector('.drag-handle')||{dataset:{}}).dataset.drag);
      const myPri = isPri(card);
      const lo = 0, hi = cards.length-1; // 어디든 자유롭게 이동
      cards.forEach((c,i)=>{ if(i!==from) c.classList.add('shifting'); });
      card.classList.add('dragging');
      let dy = 0, target = from, lastY = ev.clientY, raf = null;
      const update = ()=>{
        dy = (lastY + window.scrollY) - (y0 + sy0);
        const rawDy = dy;
        dy = Math.max(rects[lo].top - rects[from].top, Math.min(dy, rects[hi].top + rects[hi].h - rects[from].top - rects[from].h));
        card.style.transform = `translateY(${dy}px)`;
        const center = rects[from].top + rects[from].h/2 + rawDy;
        target = from;
        cards.forEach((c,i)=>{
          if(i===from) return;
          const mid = rects[i].top + rects[i].h/2;
          if(i>from && mid < center) target = Math.max(target, i);
          if(i<from && mid > center) target = Math.min(target, i);
        });
        target = Math.max(lo, Math.min(hi, target));
        cards.forEach((c,i)=>{
          if(i===from) return;
          let sh = 0;
          if(from<target && i>from && i<=target) sh = -myH;
          if(from>target && i<from && i>=target) sh = myH;
          c.style.transform = sh ? `translateY(${sh}px)` : '';
        });
      };
      // 화면 가장자리에 가면 자동으로 스크롤
      const tick = ()=>{
        const edge = 70, vh = window.innerHeight;
        if(lastY < edge) window.scrollBy(0, -12);
        else if(lastY > vh - edge) window.scrollBy(0, 12);
        update();
        raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
      const blockScroll = (e)=>{ if(e.cancelable) e.preventDefault(); };
      document.addEventListener('touchmove', blockScroll, {passive:false});
      h.onpointermove = (e)=>{ lastY = e.clientY; update(); };
      const finish = async (cancel)=>{
        h.onpointermove = null; h.onpointerup = null; h.onpointercancel = null;
        document.removeEventListener('touchmove', blockScroll);
        if(raf) cancelAnimationFrame(raf);
        cards.forEach(c=>{ c.style.transform=''; c.classList.remove('dragging','shifting'); });
        if(!cancel && target !== from){
          const ids = state.todayRecord.propertyIds;
          const i = ids.indexOf(id);
          if(i >= 0){
            ids.splice(i,1); ids.splice(target,0,id);
            // 옮긴 카드의 작업자는 카드가 놓인 위쪽부터 1·2·3번째로 번호를 다시 매김
            const rr = state.todayRecord, stId = (rr.assign||{})[id];
            if(stId){
              const seq = ids.filter(x=>(rr.assign||{})[x]===stId);
              if(seq.length>1){ rr.workOrder = rr.workOrder || {}; seq.forEach((x,k)=>{ rr.workOrder[x] = k+1; }); }
            }
            await saveTodayRecord();
          }
        }
        render();
      };
      h.onpointerup = ()=> finish(false);
      h.onpointercancel = ()=> finish(true);
    };
    // 실수로 스치기만 해도 순서가 바뀌지 않게: 터치는 0.35초 꾹 눌러야 끌기가 시작돼
    h.onpointerdown = (ev)=>{
      if(ev.button !== undefined && ev.button !== 0) return;
      const pid = ev.pointerId, x0 = ev.clientX, y0 = ev.clientY;
      let ly = y0, timer = null;
      const stop = ()=>{ clearTimeout(timer); h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', stop); h.removeEventListener('pointercancel', stop); h.classList.remove('arming'); };
      const mv = (e)=>{ ly = e.clientY; if(Math.hypot(e.clientX-x0, e.clientY-y0) > 8) stop(); };
      h.addEventListener('pointermove', mv); h.addEventListener('pointerup', stop); h.addEventListener('pointercancel', stop);
      const go = ()=>{
        stop();
        startDrag({ button:0, pointerId:pid, clientY:ly, preventDefault(){} });
      };
      if(ev.pointerType === 'mouse'){ go(); return; }
      h.classList.add('arming');
      timer = setTimeout(go, 350);
    };
  });
}

// ===== 청소 예상 시간 (대략적인 가이드) =====
const TRAVEL_MIN = 30, START_MIN = 11*60, WARN_SLACK = 60;
function staffShort(n){ n=String(n||'').trim(); return (/^[가-힣]{3,4}$/.test(n)) ? n.slice(1) : n; }
function isPickupOnly(p){ return !!p.pickupOnly || /^연남동?\s*3\s*룸/.test(p.name||''); }
function parseClockMin(str){
  if(!str) return null; const t = String(str);
  let m = t.match(/(\d{1,2})\s*:\s*(\d{2})/);
  let h, mi = 0;
  if(m){ h = +m[1]; mi = +m[2]; }
  else { m = t.match(/(\d{1,2})\s*시(?:\s*(\d{1,2})\s*분)?/) || t.match(/^\s*(\d{1,2})\s*$/); if(!m) return null; h = +m[1]; mi = +(m[2]||0); }
  if(/오후|pm/i.test(t) && h < 12) h += 12;
  else if(!/오전|am/i.test(t) && h >= 1 && h <= 8) h += 12; // IN 3시 → 15시
  return h*60 + mi;
}
function fmtMin(n){ return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0'); }
function roomCount(p){
  const t = `${p.rooms||''} ${p.name||''}`;
  const m = String(p.rooms||'').match(/^\s*(\d+)/);
  if(m) return +m[1];
  if(/3\s*룸|쓰리룸/.test(t)) return 3;
  if(/복층|투룸|2\s*룸/.test(t)) return 2;
  return 1;
}
function bedCount(p){ const n=(String(p.beds||'').match(/\d+/g)||[]).map(Number); return n.reduce((a,b)=>a+b,0); }
// 기본: 룸 수로 시간, 침대가 (룸×2)개보다 많으면 1개당 +10분
function cleanMinutes(p){
  if(p.cleanMin && +p.cleanMin > 0) return +p.cleanMin;
  const rc = roomCount(p), base = rc>=3 ? 180 : (rc===2 || /복층/.test(`${p.rooms||''} ${p.name||''}`)) ? 135 : 90;
  const bc = bedCount(p), extra = bc ? Math.max(0, bc - rc*2) : 0;
  return base + extra*10;
}
function fmtDur(n){ const h=Math.floor(n/60), m=n%60; return (h?h+'시간':'')+(m?(h?' ':'')+m+'분':''); }
function etaBadge(id){
  const p = propById(id); if(!p || isPickupOnly(p)) return '';
  const inT = parseClockMin(p.in);
  return `<div class="eta">${inT!=null?'IN '+fmtMin(inT)+' 마감 · ':''}청소 약 ${fmtDur(cleanMinutes(p))}</div>`;
}
// 체크인 시간이 빠른 순 → 같으면 청소시간이 긴(큰) 숙소 먼저. 수거 전용은 맨 아래
async function suggestOrder(){
  const r = state.todayRecord; const ids = r.propertyIds;
  const main = ids.filter(id=>{ const p=propById(id); return p && !isPickupOnly(p); });
  const rest = ids.filter(id=>!main.includes(id));
  if(!main.length){ alert('순서를 정할 숙소가 없어.'); return; }
  const pri = new Set(r.priorityIds||[]);
  const inOf = id=>{ const t=parseClockMin(propById(id).in); return t==null?9999:t; };
  // 예상 청소 끝나는 시각: 작업자별로 11:00 시작 → 청소시간 누적 + 곳 사이 이동 30분 (작업자 순서 기준)
  const eta = {};
  (state.staff||[]).forEach(st=>{
    let t = START_MIN, first = true;
    staffAssignedProps(st.id).forEach(id=>{
      const p = propById(id); if(!p || isPickupOnly(p)) return;
      t += (first?0:TRAVEL_MIN) + cleanMinutes(p); first = false; eta[id] = t;
    });
  });
  main.forEach(id=>{ if(eta[id]==null) eta[id] = START_MIN + cleanMinutes(propById(id)); }); // 배정 없는 곳은 첫 작업으로 계산
  // 당일 체크인(🔴)은 마감이 급하니 먼저, 그 안에서 / 나머지(늦게까지 해도 되는 곳)는 먼저 끝나는 순서로 확인
  main.sort((a,b)=> ((pri.has(b)?1:0)-(pri.has(a)?1:0)) || (eta[a]-eta[b]) || (inOf(a)-inOf(b)));
  const lines = main.map((id,i)=>{ const p=propById(id), st=staffById((r.assign||{})[id]); return `${i+1}. ${p.name}${st?' ('+st.name+')':''} · 예상 ${fmtMin(eta[id])}`; }).join('\n');
  if(!confirm('당일 체크인 먼저, 그다음 청소가 먼저 끝날 걸로 예상되는 순서로 정렬할까?\n(작업자별 순서대로 11:00 시작 · 청소시간 + 이동 30분 누적)\n\n'+lines+(rest.length?`\n\n순서 제외(맨 아래): ${rest.map(id=>propById(id)?.name).join(', ')}`:''))) return;
  // 정렬해도 작업자별 순서(1·2번째)는 지금 그대로 고정
  r.workOrder = r.workOrder || {};
  (state.staff||[]).forEach(st=> staffAssignedProps(st.id).forEach((id,k)=>{ r.workOrder[id] = k+1; }));
  r.propertyIds = main.concat(rest);
  await saveTodayRecord(); render();
}
async function moveJobCard(id, direction){
  const ids = state.todayRecord.propertyIds;
  const idx = ids.indexOf(id);
  const newIdx = idx + direction;
  if(idx === -1 || newIdx < 0 || newIdx >= ids.length) return;
  [ids[idx], ids[newIdx]] = [ids[newIdx], ids[idx]];
  await saveTodayRecord();
  render();
}

async function removeTask(id, idx){
  const tasks = state.todayRecord.tasks[id];
  tasks.splice(idx, 1);
  await saveTodayRecord();
  render();
}
async function addTaskBack(id, text){
  state.todayRecord.tasks[id].push({ text, done: false });
  await saveTodayRecord();
  render();
}

function buildOrderedRecord(){
  const tasks = {};
  const selected = Array.from(state.pickerSelection);
  // 항상 당일체크인으로 표시하도록 지정해둔 업체는 자동으로 우선순위에 포함
  selected.forEach(id=>{
    const p = propById(id);
    if(p && p.alwaysPriority) state.pickerPriority.add(id);
  });
  const sortByPriorityAndTime = (a,b)=>{
    const pa = state.pickerPriority.has(a) ? 0 : 1;
    const pb = state.pickerPriority.has(b) ? 0 : 1;
    if(pa !== pb) return pa - pb;
    return parseInTimeForSort(propById(a).in) - parseInTimeForSort(propById(b).in);
  };
  let orderedIds;
  if(state.pasteMatchOrder && state.pasteMatchOrder.length > 0){
    // 붙여넣은 메시지에 적힌 순서를 최우선으로 쓰고, 그 외 추가로 체크한 곳은 뒤에 붙임
    const pasteIds = state.pasteMatchOrder.filter(id => state.pickerSelection.has(id));
    const rest = selected.filter(id => !pasteIds.includes(id)).sort(sortByPriorityAndTime);
    orderedIds = [...pasteIds, ...rest];
  } else {
    orderedIds = selected.sort(sortByPriorityAndTime);
  }
  orderedIds.forEach(id=>{
    const p = propById(id);
    tasks[id] = tasksForProperty(p).map(text=>({text, done:false}));
  });
  return { propertyIds: orderedIds, tasks, priorityIds: Array.from(state.pickerPriority) };
}

function closeEditToday(){

  state.pickerSelection = new Set();
  state.pickerPriority = new Set();

  state.calPasteResultMsg = '';

}
async function applyEditToday(){
  const existingIds = state.todayRecord.propertyIds;
  const existingTasks = state.todayRecord.tasks;
  const existingExcluded = state.todayRecord.excludedIds || [];
  const newSelection = Array.from(state.pickerSelection);
  // 항상 당일체크인으로 표시하도록 지정해둔 업체는 자동으로 우선순위에 포함
  newSelection.forEach(id=>{
    const p = propById(id);
    if(p && p.alwaysPriority) state.pickerPriority.add(id);
  });
  // 기존에 있던 곳은 순서·진행상황 그대로 유지, 새로 체크한 곳만 뒤에 추가
  const kept = existingIds.filter(id => state.pickerSelection.has(id));
  const removed = existingIds.filter(id => !state.pickerSelection.has(id));
  const addedRaw = newSelection.filter(id => !existingIds.includes(id));
  let added;
  if(state.pasteMatchOrder && state.pasteMatchOrder.length > 0){
    const pasteAdded = state.pasteMatchOrder.filter(id => addedRaw.includes(id));
    const restAdded = addedRaw.filter(id => !pasteAdded.includes(id))
      .sort((a,b)=> parseInTimeForSort(propById(a).in) - parseInTimeForSort(propById(b).in));
    added = [...pasteAdded, ...restAdded];
  } else {
    added = addedRaw.sort((a,b)=> parseInTimeForSort(propById(a).in) - parseInTimeForSort(propById(b).in));
  }
  const finalIds = [...kept, ...added];
  const tasks = {};
  finalIds.forEach(id=>{
    tasks[id] = existingTasks[id] || tasksForProperty(propById(id)).map(text=>({text, done:false}));
  });
  const newlyExcluded = removed.map(id=>{
    const p = propById(id);
    return { id, name: p ? p.name : '(삭제된 업체)', tasks: existingTasks[id] || [], excludedAt: new Date().toISOString() };
  });
  // 다시 추가된 곳은 "제외됨" 목록에서 빠짐
  const excludedIds = [...existingExcluded.filter(e => !finalIds.includes(e.id)), ...newlyExcluded];
  state.todayRecord = { propertyIds: finalIds, tasks, priorityIds: Array.from(state.pickerPriority), excludedIds,
    assign: state.todayRecord.assign || {}, dayNotes: state.todayRecord.dayNotes || {}, dayPass: state.todayRecord.dayPass || {} };
  closeEditToday();
  await saveTodayRecord();
  render();
}

document.querySelectorAll('.tab').forEach(t=>{

});
document.getElementById('fab').onclick = ()=> openEditSheet(null);

// 좌우로 밀어서 탭 이동 (보이는 탭 순서대로)
(function(){
  let sx=0, sy=0, st=0, ok=false;
  const blocked = el=>{
    if(!el || !el.closest) return true;
    if(el.closest('input,textarea,select,[contenteditable],.overlay,.drag-handle,.job-card.dragging,#map,.map-wrap')) return true;
    for(let n=el; n && n!==document.body; n=n.parentElement){
      if(n.scrollWidth > n.clientWidth+4){ const ox=getComputedStyle(n).overflowX; if(ox==='auto'||ox==='scroll') return true; }
    }
    return false;
  };
  document.addEventListener('touchstart', e=>{
    if(e.touches.length!==1){ ok=false; return; }
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now();
    ok = !blocked(e.target) && sx>28 && sx<window.innerWidth-28 && !document.getElementById('overlay') && !document.querySelector('.job-card.dragging');
  }, {passive:true});
  document.addEventListener('touchend', e=>{
    if(!ok) return; ok=false;
    const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
    if(Date.now()-st>700 || Math.abs(dx)<80 || Math.abs(dy)>Math.abs(dx)*0.5) return;
    const tabs=Array.from(document.querySelectorAll('.tab')).filter(b=>b.offsetParent!==null);
    const i=tabs.findIndex(b=>b.dataset.tab===state.tab); if(i<0) return;
    const nx=tabs[i+(dx<0?1:-1)]; if(!nx) return;
    state.tab=nx.dataset.tab; render(); window.scrollTo(0,0);
  }, {passive:true});
})();

// ===== 실시간 동기화 =====
const unsubs = {};
let pendingRender = false;
function isTyping(){
  const a = document.activeElement;
  return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && document.getElementById('view').contains(a));
}
function safeRender(){
  if(isTyping()){ pendingRender = true; return; }
  render();
}
document.addEventListener('focusout', ()=>{
  if(!pendingRender) return;
  setTimeout(()=>{ if(!isTyping()){ pendingRender = false; render(); } }, 300);
});
function watchKey(name, key, onData){
  if(!cloud) return;
  if(unsubs[name]){ unsubs[name](); unsubs[name]=null; }
  unsubs[name] = cloud.fn.onSnapshot(kvDoc(key), snap=>{
    if(snap.metadata.hasPendingWrites) return;
    onData(snap.exists() ? snap.data().value : null);
  }, ()=>{});
}
function watchToday(){
  watchKey('today', todayKey(), v=>{
    if(v === lastTodayRaw) return;
    lastTodayRaw = v;
    let rec = null;
    try{ rec = v ? JSON.parse(v) : null; }catch(e){}
    state.todayRecord = (rec && rec.tasks) ? ensureLaundryStep(rec) : null;
    state.historyDates = null;
    safeRender();
  });
}
let lastPropsRaw = null, lastStaffRaw = null;
function watchShared(){
  watchKey('props', KEY_PROPS, v=>{
    if(v === lastPropsRaw) return; lastPropsRaw = v;
    try{ state.properties = v ? cleanProps(JSON.parse(v)) : []; }catch(e){}
    safeRender();
  });
  watchKey('staff', 'staff:list', v=>{
    if(v === lastStaffRaw) return; lastStaffRaw = v;
    try{ state.staff = v ? (JSON.parse(v)||[]) : []; }catch(e){}
    safeRender();
  });
  watchToday();
  watchPhotos();
  watchMonth();
}
async function uploadLocalData(){
  if(!isAdmin()) return;
  const keys = Object.keys(localStorage).filter(isSharedKey);
  if(!keys.length){ alert('이 폰에 올릴 데이터가 없어.'); return; }
  if(!confirm(`이 폰에 저장된 숙소·직원·일정 데이터 ${keys.length}건을 서버에 올릴까?\n서버에 같은 항목이 있으면 덮어써.`)) return;
  let n = 0;
  for(const k of keys){
    const v = localStorage.getItem(k);
    if(!v) continue;
    try{ await cloud.fn.setDoc(kvDoc(k), { value:v, updatedAt:Date.now(), by:cloud.user.email }); n++; }catch(e){ alert('올리는 중 오류: '+k); return; }
  }
  alert(`${n}건을 서버에 올렸어.`);
  await loadProperties(); await loadStaff(); await loadTodayRecord();
  render();
}

// ===== 로그인 화면 =====
function showLogin(msg){
  let el = document.getElementById('loginWrap');
  if(el) el.remove();
  el = document.createElement('div');
  el.className = 'login-wrap'; el.id = 'loginWrap';
  el.innerHTML = `
    <div class="login-box">
      <h2>bnb care</h2>
      <div style="font-size:13px;color:var(--ink-soft,#777);">직원 전용</div>
      <input id="lg_id" type="text" inputmode="email" autocapitalize="off" autocomplete="username" placeholder="아이디 (또는 이메일)">
      <input id="lg_pw" type="password" autocomplete="current-password" placeholder="비밀번호">
      <div class="login-err" id="lg_err">${esc(msg||'')}</div>
      <button id="lg_btn">로그인</button>
    </div>`;
  document.body.appendChild(el);
  const go = async ()=>{
    let id = document.getElementById('lg_id').value.trim();
    const pw = document.getElementById('lg_pw').value;
    if(!id || !pw){ document.getElementById('lg_err').textContent = '아이디와 비밀번호를 입력해줘.'; return; }
    if(!id.includes('@')) id += EMAIL_DOMAIN;
    const btn = document.getElementById('lg_btn'); btn.disabled = true; btn.textContent = '확인 중…';
    try{
      await cloud.fn.signInWithEmailAndPassword(cloud.auth, id, pw);
    }catch(e){
      btn.disabled = false; btn.textContent = '로그인';
      const bad = ['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'];
      document.getElementById('lg_err').textContent = bad.includes(e.code) ? '아이디 또는 비밀번호가 맞지 않아.' : (e.code==='auth/too-many-requests' ? '시도가 너무 많아. 잠시 후 다시 해줘.' : '로그인에 실패했어. 인터넷 연결을 확인해줘.');
    }
  };
  document.getElementById('lg_btn').onclick = go;
  document.getElementById('lg_pw').onkeydown = e=>{ if(e.key==='Enter') go(); };
}

let appStarted = false;
async function startApp(){
  if(appStarted) return;
  appStarted = true;
  const lw = document.getElementById('loginWrap'); if(lw) lw.remove();
  document.body.classList.toggle('not-admin', !isAdmin());
  document.body.classList.toggle('company', COMPANY_MODE);
  if(COMPANY_MODE){
    document.title = 'bnb care';
    const h1 = document.querySelector('.topbar h1'); if(h1) h1.textContent = 'bnb care';
    const tb = document.querySelector('.topbar'); if(tb && !document.getElementById('topUser') && cloud && cloud.user){
      tb.style.position = 'relative';
      const b = document.createElement('button'); b.id = 'topUser'; b.className = 'top-user';
      b.textContent = (cloud.user.email||'').split('@')[0] + (isAdmin() ? ' · 관리자' : '');
      b.onclick = async ()=>{ if(confirm('로그아웃할까?')){ await cloud.fn.signOut(cloud.auth); location.reload(); } };
      tb.appendChild(b);
    }
    if(!state._init){ state.tab = 'cal'; state._init = 1; }
    if(!isAdmin() && state.tab !== 'today' && state.tab !== 'cal') state.tab = 'today';
  }
  state.selectedDate = todayStr();
  try{ let _nw = isNarrowCal(); window.addEventListener('resize', ()=>{ const n = isNarrowCal(); if(n!==_nw){ _nw = n; if(state.tab==='cal') render(); } }); }catch(e){}
  try{ const v = localStorage.getItem('pref:calView'); if(v) state.calView = v; }catch(e){}
  window._bootCacheFirst = true; // 앱 켤 때는 저장된 사본을 먼저 보여주고, 최신 내용은 실시간 연결이 곧바로 갱신
  await Promise.all([loadProperties(), loadStaff(), loadTodayRecord()]);
  window._bootCacheFirst = false;
  render();
  await Promise.all([loadKakaoKey(), loadCompanyLocation(), loadHourlyWage(), loadGeocodeCache(), loadPhotoLog(), loadReportLog(), loadWorkLog()]);
  if(state.tab === 'staff' || state.tab === 'map') render();
  cleanupOldDayPass();
  if(cloud) watchShared();
  // 관리자 첫 로그인: 서버가 비어 있고 이 폰에 예전 데이터가 있으면 올릴지 물어봄
  if(cloud && isAdmin() && state.properties.length === 0 && localStorage.getItem(KEY_PROPS)){
    if(confirm('서버에 숙소 데이터가 아직 없어. 이 폰에 저장된 데이터를 서버로 올릴까?')) await uploadLocalData();
  }
}

(async function init(){
  if(!CLOUD_ENABLED){ startApp(); return; }
  document.getElementById('view').innerHTML = '<div class="empty">불러오는 중…</div>';
  try{
    await initCloud();
  }catch(e){
    document.getElementById('view').innerHTML = '<div class="empty">서버에 연결하지 못했어.<br>인터넷 연결을 확인하고 다시 열어줘.</div>';
    return;
  }
  cloud.fn.onAuthStateChanged(cloud.auth, user=>{
    cloud.user = user;
    if(user){ startApp(); }
    else{ appStarted = false; showLogin(); }
  });
})();
