<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>bnb care</title>
<meta name="apple-mobile-web-app-title" content="bnb care">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  body.not-admin [data-tab="staff"], body.not-admin [data-tab="all"]{display:none;}
  body.company [data-tab="map"]{display:none;}
  .top-user{position:absolute;right:12px;top:14px;border:1px solid var(--paper-line);background:var(--surface);border-radius:14px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-soft);font-family:var(--sans);}
  .login-wrap{position:fixed;inset:0;background:var(--paper,#faf7f2);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-box{width:100%;max-width:340px;}
  .login-box h2{margin:0 0 4px;font-size:20px;}
  .login-box input{width:100%;box-sizing:border-box;padding:12px;margin-top:10px;border:1px solid var(--paper-line,#ddd);border-radius:8px;font-size:16px;font-family:inherit;}
  .login-box button{width:100%;margin-top:14px;padding:13px;border:none;border-radius:8px;background:var(--ink,#222);color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
  .login-err{color:#b3402a;font-size:13px;margin-top:10px;min-height:18px;}
  :root{
    --paper: #EEF0EA;
    --paper-line: #D9DCCF;
    --surface: #FFFFFF;
    --ink: #1F2A22;
    --ink-soft: #57604F;
    --teal: #2B6E63;
    --teal-soft: #E1EEEB;
    --mustard: #B4842A;
    --mustard-soft: #F5EAD3;
    --clay: #A6432A;
    --clay-soft: #F5E2DB;
    --radius: 10px;
    --serif: "Roboto Slab","Noto Serif KR",serif;
    --sans: -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
    --mono: "IBM Plex Mono","SFMono-Regular",Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);overflow-x:hidden;}
  body{padding-bottom:90px;}
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--paper-line);
    padding:14px 16px 0 16px;
  }
  .topbar h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:20px;
    margin:2px 0 12px 0;
    letter-spacing:-0.2px;
  }
  .tabs{display:flex;gap:0;margin:0;}
  .tab{
    flex:1;text-align:center;padding:10px 0 12px 0;
    font-size:14px;font-weight:600;color:var(--ink-soft);
    border-bottom:2px solid transparent;cursor:pointer;
    background:none;border-top:none;border-left:none;border-right:none;
    font-family:var(--sans);
  }
  .tab.active{color:var(--ink);border-bottom:2px solid var(--teal);}
  main{padding:14px 14px 0 14px;max-width:520px;margin:0 auto;}
  main.wide{max-width:1100px;}

  /* summary bar */
  .summary{
    background:var(--surface);border:1px solid var(--paper-line);
    border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;
  }
  .summary .date{font-size:12px;color:var(--ink-soft);}
  .summary .count{font-family:var(--serif);font-size:20px;font-weight:700;margin-top:2px;}
  .summary .count span{color:var(--teal);}
  .count-row{display:flex;align-items:center;gap:6px 12px;margin-top:0;flex-wrap:wrap;}
  .count-item{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--ink);}
  .count-item span{color:#6b7068;}
  .count-item.full span{color:var(--teal);}
  .summary-actions{display:flex;gap:6px;margin-left:auto;}
  .summary-actions button{position:relative;}
  .summary-actions .sdot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--clay);border:2px solid #fff;}
  .summary-actions button{
    width:30px;height:30px;font-size:14px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--paper-line);
    border-radius:50%;cursor:pointer;font-family:var(--sans);display:flex;align-items:center;justify-content:center;padding:0;
  }
  @media(max-width:430px){ .count-row{gap:6px 9px;} .count-item{font-size:17px;} .summary-actions{gap:4px;} .summary-actions button{width:28px;height:28px;font-size:13px;} }
  .relist-btn{
    font-size:12px;color:var(--ink-soft);background:none;border:1px solid var(--paper-line);
    border-radius:20px;padding:6px 12px;cursor:pointer;font-family:var(--sans);
  }

  /* picker */
  .picker-intro{font-size:13px;color:var(--ink-soft);margin:4px 0 12px 0;line-height:1.5;}
  .paste-box{background:var(--surface);border:1px solid var(--paper-line);border-radius:var(--radius);padding:12px;margin-bottom:14px;}
  .paste-box label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .paste-box textarea{width:100%;min-height:70px;padding:9px 10px;border:1px solid var(--paper-line);border-radius:8px;font-size:13px;font-family:var(--sans);background:var(--paper);color:var(--ink);resize:vertical;}
  .paste-box button{margin-top:8px;font-size:12.5px;border:1px solid var(--paper-line);background:var(--paper);border-radius:8px;padding:8px 12px;cursor:pointer;font-family:var(--sans);}
  .picker-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .picker-row{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--paper-line);
    border-radius:8px;padding:10px 12px;cursor:pointer;
  }
  .picker-row.checked{border-color:var(--teal);background:var(--teal-soft);}
  .picker-row input{width:18px;height:18px;accent-color:var(--teal);flex-shrink:0;}
  .priority-toggle{
    flex-shrink:0;font-size:11px;border:1px solid var(--paper-line);background:var(--surface);color:var(--ink-soft);
    border-radius:14px;padding:5px 9px;cursor:pointer;font-family:var(--sans);
  }
  .priority-toggle.active{background:var(--clay);border-color:var(--clay);color:#fff;}
  .picker-row .pname{font-size:14px;font-weight:600;}
  .picker-row .paddr{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .confirm-btn{
    position:sticky;bottom:14px;width:100%;
    background:var(--ink);color:#fff;border:none;border-radius:var(--radius);
    padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--sans);
  }
  .confirm-btn:disabled{background:#B9BEB2;}
  .export-btn{
    width:100%;background:var(--ink);color:#fff;border:none;border-radius:var(--radius);
    padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans);margin-top:16px;
  }

  /* today card */
  .job-card{
    background:var(--surface);border:1px solid var(--paper-line);
    
    border-radius:var(--radius);padding:12px 12px 12px 10px;margin-bottom:12px;
  }
  .job-card.done{background:#E6F3EC;border-color:#BFDCCB;}
  /* 당일 표시는 번호 동그라미(빨강)로 하고, 왼쪽 막대는 대표 색/회색 그대로 둠 */
  .job-head{display:flex;align-items:center;gap:6px;cursor:pointer;}
  .job-addr-inline{
    display:block;font-size:12px;color:var(--teal);text-decoration:none;margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .nav-icon-btn{
    flex-shrink:0;font-size:18px;text-decoration:none;padding:2px 4px;line-height:1;
  }
  .meta-addr{color:var(--teal);margin-bottom:4px;font-size:inherit;}
  .meta-sub{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:inherit;}
  .meta-sub span{min-width:0;}
  .order-cluster{display:flex;flex-direction:row;align-items:center;align-self:flex-start;gap:0;flex-shrink:0;}
  .order-num{
    flex-shrink:0;min-width:16px;height:24px;line-height:24px;position:relative;top:1px;color:var(--ink);
    font-family:var(--serif);font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .order-num.pri{color:var(--clay);}
  .lat{font-size:.93em;}
  .jn-num{display:inline-block;width:18px;color:var(--ink);}
  .jn-num.pri{color:var(--clay);}
  .job-title-block{display:flex;flex-direction:column;min-width:0;flex:1;}
  .job-detail{display:none;}
  .job-card.open .job-detail{display:block;}
  .drag-handle{width:36px;height:46px;margin:-8px 0;display:flex;align-items:center;justify-content:center;touch-action:pan-y;cursor:grab;flex-shrink:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  .drag-handle.arming i{opacity:1;transform:scale(1.2);transition:transform .2s;}
  .drag-handle i{display:block;width:14px;height:22px;background-image:radial-gradient(circle,var(--ink-soft) 1.7px,transparent 1.9px);background-size:7px 7px;opacity:.7;}
  .job-card.dragging{position:relative;z-index:50;box-shadow:0 10px 28px rgba(0,0,0,.22);transition:none;}
  .job-card.shifting{transition:transform .15s ease;}
  .order-controls-mini{display:flex;flex-direction:column;gap:1px;}
  .order-controls-mini button{
    width:20px;height:14px;border:none;background:none;
    font-size:8px;line-height:1;cursor:pointer;color:var(--ink-soft);padding:0;
  }
  .order-controls-mini button:disabled{opacity:0.25;cursor:default;}
  .meta-line{
    font-size:12px;color:var(--ink-soft);margin-top:10px;padding-bottom:10px;
    border-bottom:1px solid var(--paper-line);
  }
  .photo-strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .pthumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--paper-line,#ddd);cursor:pointer;}
  .photo-view{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;}
  .photo-view img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:6px;}
  .photo-view .pv-actions{display:flex;gap:10px;margin-top:14px;}
  .photo-view button{padding:10px 18px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}
  .cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .cal-head .ttl{font-size:18px;font-weight:700;flex:1;min-width:110px;}
  .cal-head button{border:1px solid var(--paper-line);background:var(--surface);border-radius:8px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);color:var(--ink);}
  .cal-head button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .cal-head .navg{display:flex;gap:4px;align-items:center;}
  .cal-head .navg button{padding:7px 10px;}
  .cal-head .seg{display:flex;border:1px solid var(--paper-line);border-radius:8px;overflow:hidden;background:var(--surface);}
  .cal-head .seg button{border:none;border-radius:0;padding:7px 12px;background:transparent;}
  .cal-head .seg button + button{border-left:1px solid var(--paper-line);}
  .cal-head .seg button.on{background:var(--ink);color:#fff;}
  .cal-head .imp{padding:7px 9px;}
  .cal-head .ttl{order:0;} .cal-head .navg{order:1;} .cal-head .seg{order:2;} .cal-head .imp{order:3;}
  @media (max-width:560px){ .cal-head .ttl{flex-basis:100%;} .cal-head .seg{flex:1;} .cal-head .seg button{flex:1;} }
  .mc-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--paper-line);border:1px solid var(--paper-line);border-radius:8px;overflow:hidden;}
  .cal-dow{background:#F4F5F0;text-align:center;font-size:12px;font-weight:700;padding:6px 0;}
  .cal-cell{background:var(--surface);min-height:84px;padding:3px 2px 4px;cursor:pointer;overflow:hidden;}
  .cal-cell.out{background:#F7F8F4;}
  .cal-cell.out .dn{opacity:.4;}
  .cal-cell.sel{outline:2px solid var(--teal);outline-offset:-2px;}
  .cal-cell .dn{font-size:11px;font-weight:700;padding:2px 4px;margin-bottom:3px;background:#E8E9E3;border-radius:5px;display:flex;justify-content:space-between;align-items:center;}
  .cal-cell .dn .hol{font-size:9px;font-weight:600;color:#c0392b;}
  .cal-cell.dow-red .dn{background:#F8E4E1;} .cal-cell.dow-blue .dn{background:#E3ECF6;}
  .cc-cell:not(.today) .n.red{background:#F8E4E1;} .cc-cell:not(.today) .n.blue{background:#E3ECF6;}
  .cal-day.dow-red{background:#FBEDEB;} .cal-day.dow-blue{background:#EAF0F8;}
  .cal-cell .dn .cnt{font-size:9px;font-weight:700;color:var(--ink-soft);}
  .cal-cell.today .dn b{background:var(--teal);color:#fff;border-radius:10px;padding:0 6px;}
  .cchip{display:block;font-size:9.5px;line-height:1.35;padding:1px 3px;margin-bottom:2px;border-radius:3px;background:var(--surface);box-shadow:inset 0 0 0 1px #D9D6CA;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cchip.pri{font-weight:700;color:#B3321A;}
  .cchip.pri.done{color:var(--teal);}
  .cchip.fx{display:flex;align-items:center;gap:3px;}
  .cchip.fx .nmw{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cchip.fx .wm{flex-shrink:0;}
  .cchip.lg{display:inline-flex;align-items:center;gap:3px;margin:0;padding:3px 8px;font-size:11px;}
  .cchip .pd{color:var(--clay);font-weight:800;}
  .cchip.done{background:var(--teal-soft);color:var(--teal);box-shadow:none;}
  .past .cchip,.past .wk-chip,.past .dn,.past .n,.past .dots,.past .cc-cell .cn,.past .wd,.wk-day.past .cn,.cal-list-row.past .d,.cal-list-row.past .chips{opacity:.5;}
  .cal-cell.past .dn,.cc-cell.past .n,.wk-day.past .wd{opacity:.5;}
  .cchip .fn{display:none;}
  @media(min-width:700px){ .cchip .fn{display:inline;} .cchip .sn{display:none;} }
  .red{color:#c0392b;} .blue{color:#2f5fb5;}
  .wk-day{background:var(--surface);border:1px solid var(--paper-line);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;}
  .wk-day.today{outline:2px solid var(--teal);}
  .wk-day .wd{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;}
  .wk-day .wd b{font-size:20px;}
  .wk-day .wd .cn{margin-left:auto;font-size:13px;color:var(--ink-soft);}
  .wk-chip{display:flex;align-items:center;gap:8px;font-size:16px;padding:9px 11px;margin:5px 0;border-radius:8px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--paper-line);}
  .wk-chip.done{background:var(--teal-soft,#dcebe7);box-shadow:none;}
  .wk-chip.cp-row{background:var(--surface);border:1px solid var(--paper-line);}
  .wk-chip.cp-row.washed{background:#E6F3EC;border-color:#BFDCCB;}
  .wk-chip.cp-row .order-num{flex-shrink:0;}
  .wk-chip .nm{flex:1;min-width:0;font-weight:600;}
  .wash-btn{flex-shrink:0;font-size:13px;line-height:1;padding:6px 9px;border-radius:14px;border:1px solid var(--paper-line);background:var(--surface);color:var(--ink-soft);cursor:pointer;font-family:var(--sans);}
  .wash-btn.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700;}
  .wk-chip .tag{font-size:12px;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.08);white-space:nowrap;}
  .wk-empty{font-size:14px;color:var(--ink-soft);padding:4px 0;}
  .cc-cell{background:var(--surface);min-height:58px;padding:4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .cc-dow{text-align:center;}
  .cc-cell.out{background:#F7F8F4;} .cc-cell.out .n{opacity:.35;}
  .cc-cell .n{font-size:13px;font-weight:700;min-width:22px;text-align:center;border-radius:11px;padding:1px 0;}
  .cc-cell.today .n{background:var(--teal);color:#fff;}
  .cal-cell.today{background:#E3F0FB;box-shadow:inset 0 0 0 2px #2F6FB0;}
  .cal-cell.today .dn b{background:#2F6FB0;}
  .cc-cell.today{background:#E3F0FB;box-shadow:inset 0 0 0 2px #2F6FB0;}
  .cc-cell.today .n{background:#2F6FB0;}
  .cal-cell.today.sel,.cc-cell.today.sel{outline-color:#2F6FB0;}
  .cc-cell.sel{outline:2px solid var(--teal);outline-offset:-2px;background:#F1F7F5;}
  .cc-cell .dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:100%;padding:0 2px;}
  .cc-cell .dots i{width:7px;height:7px;border-radius:50%;background:#bbb;display:block;}
  .cc-cell .cn{margin-top:2px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink-soft);background:var(--surface);box-shadow:inset 0 0 0 1px #D2D0C4;border-radius:50%;line-height:1;}
  .cc-cell .cn.done{color:var(--teal);background:var(--teal-soft);box-shadow:none;}
  .cc-cell .cn b{font-size:12px;}
  .cc-panel{margin-top:12px;}
  .cc-panel .ph{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .cc-panel .ph b{font-size:16px;flex:1;}
  .cc-panel .ph button{border:1px solid var(--paper-line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:18px;line-height:1.2;cursor:pointer;font-family:var(--sans);color:var(--ink);}
  .cal-list-row{background:var(--surface);border:1px solid var(--paper-line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;}
  .cal-list-row.sel{outline:2px solid var(--teal);}
  .cal-list-row .d{font-weight:700;font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between;}
  .cal-list-row .chips{display:flex;flex-wrap:wrap;gap:4px;}
  .cal-list-row .cchip{font-size:12px;padding:3px 7px;margin:0;border-radius:6px;overflow:visible;}
  @media(min-width:700px){ .cal-cell{min-height:118px;} .cchip{font-size:11.5px;padding:2px 5px;} .cal-cell .dn{font-size:13px;} }
  .assign-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .assign-row select{flex:1;padding:8px;border-radius:8px;border:1px solid var(--paper-line);font-size:14px;font-family:var(--sans);background:#fff;}
  .warn-line{font-size:12px;color:var(--clay);margin-top:4px;line-height:1.4;}
  .worker-badge{flex-shrink:0;font-size:10px;font-weight:700;background:#eee;color:#444;border-radius:6px;padding:1px 6px;}
  .head-note{font-size:12.5px;color:var(--clay);font-weight:600;line-height:1.35;word-break:keep-all;}
.job-card.open .head-note{display:none;}
.worker-badge .wk-no{font-size:inherit;font-weight:inherit;color:inherit;line-height:inherit;}
  .day-note{width:100%;box-sizing:border-box;border:1px solid var(--paper-line);border-radius:8px;padding:8px;font-size:13px;font-family:var(--sans);resize:vertical;min-height:36px;}
  .staff-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--paper-line);font-size:13px;}
  .staff-item .sname{font-weight:700;font-size:14px;}
  .staff-item button{border:none;background:#f0f0f0;border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;}
  .section-divider{border-top:1px solid var(--paper-line);margin:12px 0;}
  .excluded-section{margin-top:6px;padding:12px 14px;background:var(--paper);border:1px dashed var(--paper-line);border-radius:var(--radius);}
  .excluded-title{font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:8px;}
  .excluded-item{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-soft);padding:4px 0;}
  .excluded-meta{font-size:11px;font-family:var(--mono);}
  .job-name{font-family:var(--serif);font-size:14.5px;font-weight:700;}
  .qchk{display:inline-flex;gap:9px;flex-shrink:0;}
  .qb{border:none;background:transparent;border-radius:8px;padding:2px 5px;font-size:15px;line-height:1.3;cursor:pointer;opacity:.28;filter:grayscale(1);}
  .qb.on{background:var(--teal-soft);opacity:1;filter:none;}
  .eta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .eta.warn{color:#B3321A;font-weight:700;}
  .job-owner{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .badge-row{display:flex;gap:6px;flex-shrink:0;}
  .badge{font-size:11px;font-family:var(--mono);padding:3px 6px;border-radius:5px;background:var(--mustard-soft);color:var(--mustard);white-space:nowrap;}
  .job-addr{font-size:13px;color:var(--ink-soft);margin-top:8px;line-height:1.4;}
  .job-addr a{color:var(--teal);text-decoration:none;}
  .job-addr a:active{opacity:0.7;}
  .job-notes{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5;background:var(--paper);border-radius:6px;padding:8px 10px;}

<script>
// ===== 빌드 설정 (개인용: 서버 없이 이 폰에만 저장 / 회사용: 로그인 + 서버 공유) =====
const CLOUD_ENABLED = true;
const COMPANY_MODE = true;
// ===== Firebase 연결 (로그인 + 실시간 공유 저장소) =====
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB3KSGfToHr1oPxDJTk7sAYof7pKelfNGY",
  authDomain: "bnbcare-d1603.firebaseapp.com",

  appId: "1:454006613109:web:589a7ed412af59e358843c"
};
const APP_BUILD = '1028-00';
const ADMIN_EMAILS = ['leeje@bnbcare.com','anyj@bnbcare.com','hanjs@bnbcare.com'];
const EMAIL_DOMAIN = '@bnbcare.com';
const FB_VER = '10.14.1';
let cloud = null; // { auth, db, user, fn }
const isAdmin = () => !CLOUD_ENABLED || !!(cloud && cloud.user && ADMIN_EMAILS.includes((cloud.user.email||'').toLowerCase()));

// 공유되는 데이터(숙소, 직원, 날짜별 일정, 보고기록)만 서버에 저장. 나머지(시급, 출퇴근, 카카오키 등)는 이 폰에만 저장
const isSharedKey = k => CLOUD_ENABLED && (k==='properties:list' || k==='staff:list' || k==='report-log:list' || k.startsWith('today:'));
const localStore = {
  async get(key){ const raw = localStorage.getItem(key); return (raw===null||raw===undefined) ? null : { key, value: raw }; },
  async set(key, value){ localStorage.setItem(key, value); return { key, value }; },
  async delete(key){ localStorage.removeItem(key); return { key, deleted:true }; },
  async list(prefix){ return { keys: Object.keys(localStorage).filter(k=>!prefix||k.startsWith(prefix)), prefix }; }
};
const kvDoc = key => cloud.fn.doc(cloud.db, 'kv', key);
window.storage = {
  async get(key, shared){
    if(isSharedKey(key)){
      if(!(cloud && cloud.user)) return null;
      if(window._bootCacheFirst && cloud.fn.getDocFromCache){
        try{ const cs = await cloud.fn.getDocFromCache(kvDoc(key)); if(cs.exists()) return { key, value: cs.data().value }; }catch(e){}
      }
      const snap = await cloud.fn.getDoc(kvDoc(key));
      return snap.exists() ? { key, value: snap.data().value } : null;
    }
    return localStore.get(key);
  },
  async set(key, value, shared){
    if(isSharedKey(key)){
      if(!(cloud && cloud.user)) throw new Error('로그인 필요');
      await cloud.fn.setDoc(kvDoc(key), { value, updatedAt: Date.now(), by: cloud.user.email });
      return { key, value };
    }
    return localStore.set(key, value);
  },
  async delete(key, shared){
    if(isSharedKey(key)){
      if(!(cloud && cloud.user)) return null;
      await cloud.fn.deleteDoc(kvDoc(key));
      return { key, deleted:true };
    }
    return localStore.delete(key);
  },
  // 오늘 이후 일정 기록을 한 번에(요청 1번) 가져옴: { 'YYYY-MM-DD': record }
  async recordsFrom(ds){
    const out = {};
    if(CLOUD_ENABLED && cloud && cloud.user){
      const q = cloud.fn.query(cloud.fn.collection(cloud.db,'kv'),
        cloud.fn.where(cloud.fn.documentId(),'>=','today:'+ds), cloud.fn.where(cloud.fn.documentId(),'<=','today:\uf8ff'));
      const snap = await cloud.fn.getDocs(q);
      snap.forEach(d=>{ try{ const rec = JSON.parse(d.data().value); if(rec) out[d.id.replace('today:','')] = rec; }catch(e){} });
      return out;
    }
    Object.keys(localStorage).filter(k=>k.startsWith('today:')).forEach(k=>{ const d = k.replace('today:',''); if(d>=ds){ try{ out[d] = JSON.parse(localStorage.getItem(k)); }catch(e){} } });
    return out;
  },
  async list(prefix, shared){
    if(CLOUD_ENABLED && prefix && prefix.startsWith('today:') && cloud && cloud.user){
      try{
        const q = cloud.fn.query(cloud.fn.collection(cloud.db,'kv'),
          cloud.fn.where(cloud.fn.documentId(),'>=',prefix), cloud.fn.where(cloud.fn.documentId(),'<=',prefix+'\uf8ff'));
        const snap = await cloud.fn.getDocs(q);
        const keys = []; snap.forEach(d=>keys.push(d.id));
        return { keys, prefix };
      }catch(e){}
    }
    return localStore.list(prefix);
  }
};
async function initCloud(){
  const base = 'https://www.gstatic.com/firebasejs/'+FB_VER;
  const [appM, authM, fsM] = await Promise.all([
    import(base+'/firebase-app.js'), import(base+'/firebase-auth.js'), import(base+'/firebase-firestore.js')
  ]);
  const app = appM.initializeApp(FIREBASE_CONFIG);
  const auth = authM.getAuth(app);
  let db;
  try{ db = fsM.initializeFirestore(app, { localCache: fsM.persistentLocalCache() }); }
  catch(e){ db = fsM.getFirestore(app); }
  cloud = { auth, db, user:null, fn:{ ...authM, ...fsM } };
}

const KEY_PROPS = 'properties:list';
const todayStr = () => {
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};
const todayKey = () => 'today:' + state.selectedDate;
const tomorrowStr = () => {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};
function tomorrowLabel(){
  const [y,m,d] = tomorrowStr().split('-').map(Number);
  const days = ['일','월','화','수','목','금','토'];
  const wd = new Date(y, m-1, d).getDay();
  return `${m}월 ${d}일 (${days[wd]})`;
}

let state = {
  tab: 'today',
  selectedDate: null, // 초기화 시 todayStr()로 세팅됨
  properties: [],
  todayRecord: null, // {propertyIds:[], tasks:{id:[{text,done}]}} - state.selectedDate 기준
  pickerSelection: new Set(),
  pickerPriority: new Set(),
  openJobIds: new Set(),
  toolsOpen: false,
  calPasteText: '',
  calPasteResultMsg: '',
  pasteMatchOrder: [],
  scheduleCalendarOpen: false,
  editTodayOpen: false,
  search: '',
  openIds: new Set(),
  editing: null, // property object being edited, or {} for new
  kakaoKey: null,
  companyLocation: null,
  hourlyWage: 0,
  staff: [],
  calMonth: (()=>{ const d=new Date(); return { year:d.getFullYear(), month:d.getMonth() }; })(),
  calView: 'grid',
  calSelDay: null,
  monthRecords: {},
  calWeekStart: null,
  photos: {}, // {propId:[{id,ts,by,thumb}]} 선택한 날짜 기준
  mapScope: 'today', // 'today' | 'all'
  mapReady: false,
  geocodeCache: {},
  photoLog: [],
  reportLog: [],
  workLog: [],
  historyDates: null, // Set of 'YYYY-MM-DD' strings that have records, loaded lazily
  historyMonth: (()=>{ const d=new Date(); return { year: d.getFullYear(), month: d.getMonth() }; })()
};

const DEFAULT_PROPERTIES = []; // 숙소 데이터는 서버(Firebase)에서 불러옴. 코드에는 넣지 않음


async function loadProperties(){
  try{
    const res = await window.storage.get(KEY_PROPS, false);
    if(res && res.value){ state.properties = cleanProps(JSON.parse(res.value)); return; }
  }catch(e){}
  state.properties = DEFAULT_PROPERTIES;
}
async function saveProperties(){
  try{ await window.storage.set(KEY_PROPS, JSON.stringify(state.properties), false); }catch(e){}
}
let lastTodayRaw = null;
// 비번이 '앞 손님 체크인 날짜'인 숙소(망원2룸): 바로 앞 일정 날짜를 찾아 MMDD* 로 제안
const _prevDateCache = {};
async function findPrevScheduleDate(pid, ds){
  const key = pid+'@'+ds;
  if(key in _prevDateCache) return _prevDateCache[key];
  const [y,m,d] = ds.split('-').map(Number);
  let found = null;
  for(let i=1; i<=62 && !found; i++){
    const dt = new Date(y, m-1, d-i);
    const k = ymd(dt.getFullYear(), dt.getMonth(), dt.getDate());
    let res = null; try{ res = await window.storage.get('today:'+k, false); }catch(e){}
    if(!res || !res.value) continue;
    try{ const rec = JSON.parse(res.value); if((rec.propertyIds||[]).includes(pid)) found = k; }catch(e){}
  }
  _prevDateCache[key] = found; return found;
}
async function fillPassSuggestions(){
  const els = document.querySelectorAll('[data-pass-suggest]');
  for(const el of els){
    const pid = el.dataset.passSuggest;
    el.textContent = '앞 일정 찾는 중…';
    const prev = await findPrevScheduleDate(pid, state.selectedDate);
    if(!document.body.contains(el)) continue;
    if(!prev){ el.textContent = '앞 일정(최근 2달)을 못 찾았어. 직접 입력해줘.'; continue; }
    const code = prev.slice(5,7)+prev.slice(8,10)+'*';
    const cur = ((state.todayRecord.dayPass||{})[pid]||'').trim();
    const label = `앞 일정 ${Number(prev.slice(5,7))}/${Number(prev.slice(8,10))} → ${code}`;

// ===== 배정 문서 붙여넣기: "조아라님 / 1.숙소 / 비번*" 형식을 읽어 작업자·순서·비번에 반영 =====
function parseAssignDoc(text){
  const groups = []; let cur = null;
  const staffByName = n=>{ n=String(n).replace(/님$/,'').trim(); return state.staff.find(st=>st.name===n) || state.staff.find(st=>st.name.includes(n) || n.includes(st.name)) || null; };
  String(text||'').split(/\r?\n/).forEach(raw=>{
    const line = raw.trim(); if(!line) return;
    const head = line.match(/^([가-힣]{2,4})\s*님\s*$/);
    if(head){ cur = { name: head[1], staff: staffByName(head[1]), items: [] }; groups.push(cur); return; }
    const m = line.match(/^(\d{1,2})\s*[.)]\s*(.+)$/);
    const body = m ? m[2] : (cur && !m && /\//.test(line) ? line : null);   // 번호 없는 한 줄짜리(예: 홍대102호 / 주소 / 비번)
    if(!body){ return; }
    if(!cur){ cur = { name: '', staff: null, items: [] }; groups.push(cur); }
    const parts = body.split('/').map(x=>x.trim());
    const nameRaw = parts[0]; const rest = parts.slice(1);
    // 비번: 뒤쪽 토막 중 숫자/*/영문 위주 또는 "비번:" 표기. 나머지는 메모
    let pass = '', notes = [];
    rest.forEach(t=>{
      if(!t) return;
      const pm = t.match(/^비번\s*[:：]?\s*(.+)$/);
      if(pm){ pass = pm[1].trim(); return; }
      if(!pass && /^[0-9A-Za-z*#,\s옥]+$/.test(t.replace(/\(.*?\)/g,'').replace(/수건\s*\d+\s*장/g,'').trim()) && /\d/.test(t)){ 
        const noteBits = []; let p = t.replace(/\((.*?)\)/g,(_,x)=>{ noteBits.push(x); return ''; }).replace(/(수건\s*\d+\s*장)/g,(_,x)=>{ noteBits.push(x); return ''; }).trim();
        pass = p; notes = notes.concat(noteBits); return; }
      if(/[가-힣]+(로|길)\s*\d/.test(t) || /^[가-힣]+구\s/.test(t)) return;   // 주소 토막은 무시
      notes.push(t);
    });
    // 비번 토막에 "수건16장" 처럼 붙은 꼬리 메모 분리
    const tail = pass.match(/^(.*?\*)\s+([가-힣].*)$/); if(tail && !/^옥/.test(tail[2])){ pass = tail[1].trim(); notes.push(tail[2].trim()); }
    // 숙소 찾기: 주소식 표기(예: 동교로 25길 9, 102호)는 정리해서, 그래도 안 되면 '동' 뺀 표기로 한 번 더
    let prop = null;
    const cleaned = nameRaw.replace(/\d+\s*길\s*\d+\s*,?/g,'').trim();
    if(cleaned !== nameRaw) prop = findBestPropertyMatch(cleaned);
    if(!prop) prop = findBestPropertyMatch(nameRaw);
    if(!prop){
      const k = normalizeForMatch(nameRaw).replace(/동/g,'');
      const hits = state.properties.filter(p=>normalizeForMatch(p.name).replace(/동/g,'').includes(k));
      if(hits.length===1) prop = hits[0];
    }
    cur.items.push({ nameRaw, prop, pass, notes: notes.filter(Boolean) });
  });
  return groups;
}
// ===== 청소 일정 캘린더 메시지 붙여넣기: "🔑 1208호 🔑 PW : … / 10월 22일(1박) / 게스트 2명 / [작은수건] 6" → 날짜별 특이사항 =====
// 주소 줄("마포구 잔다리로 6길 5, 804호")로 숙소 찾기: 도로명+번지가 같고, 호수가 있으면 호수도 맞는 숙소가 하나일 때만
function findPropByAddress(line){
  const norm = x=>String(x||'').replace(/\s+/g,'').replace(/[,，]/g,'');
  const rm = String(line).match(/[가-힣]+(?:로|길)\s*\d+\s*(?:길)?\s*\d*/);
  const lm = !rm ? String(line).match(/[가-힣]+동\s*\d+-\d+/) : null;
  const road = rm ? norm(rm[0]) : (lm ? norm(lm[0]) : '');
  const um = String(line).match(/(\d{3,4})\s*호/); const unit = um ? um[1] : '';
  if(!road) return null;
  const fm = String(line).match(/[가-힣]+로\s*\d+[가-힣]*길\s*\d+(?:-\d+)?/);
  let c = [];
  if(fm){ const fr = norm(fm[0]); c = state.properties.filter(p=> norm(p.address).includes(fr)); }
  if(!c.length) c = state.properties.filter(p=> norm(p.address).includes(road));
  if(unit){ const c2 = c.filter(p=> norm((p.address||'')+(p.name||'')).includes(unit)); if(c2.length) c = c2; }
  return c.length===1 ? c[0] : null;
}
// 비번이 매번 바뀌는 숙소인지: 비번 칸에 '매번'이 있거나, 비번이 비었거나, 참고사항에 '매번 바뀜/변경'이 적혀 있으면
function isMaebeonProp(p){ if(!p) return false; const pw = String(p.password||''); return /매번/.test(pw) || !pw.replace(/[\s*]/g,'') || /매번\s*(바뀜|바뀌|변경|변함)/.test(String(p.notes||'')); }
function parseCalMsg(text){
  const out = []; let prop = null, hdr = '', cur = null, slashDs = null, slashMd = '', dotHdr = '', dotProp = null; let dotLast = null, pwB = '', pwA = ''; let blk = null;
  const now = new Date();
  const toDs = (m,d)=>{
    let y = now.getFullYear();
    const dt = new Date(y, m-1, d);
    if(dt < new Date(now.getTime() - 180*86400000)) y++;
    return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  };
  const findProp = (raw)=>{
    const name = raw.trim(); if(!name) return null;
    const num = name.match(/^(\d{3,4})\s*호?$/);
    if(num){ const hits = state.properties.filter(p=> new RegExp('(^|\\D)'+num[1]+'(\\D|$)').test(p.name)); return hits.length===1 ? hits[0] : null; }
    return findBestPropertyMatch(name);
  };
  String(text||'').split(/\r?\n/).forEach(raw=>{
    const line = raw.trim(); if(!line || /^[-—_=\s]+$/.test(line)) return;
    // 창천동식 표: "11.1■당일 주소 303호" / "11.5■(2개)" 아래 "다음날 주소" 줄들 / "11.28■당일2개" 아래 주소 줄들
    const cm = line.match(/^(\d{1,2})\s*\.\s*(\d{1,2})\s*■\s*(.*)$/);
    if(cm){
      slashDs = null; cur = null; dotLast = null;
      const rest = cm[3];
      const dsC = toDs(+cm[1], +cm[2]), mdC = cm[1]+'/'+cm[2];
      const pr = /다음날/.test(rest) ? false : (/당일/.test(rest) ? true : null);
      const am = rest.match(/(?:(?:당일|다음날)\s*)?([가-힣]+[^\s]*.*\d.*호)\s*$/);
      if(am){
        out.push({ hdr:am[1].trim(), prop:findPropByAddress(am[1]), ds:dsC, md:mdC, nights:'', guests:'', small:'', large:'', none:false, note: pr?'당일 체크인':'', pri:!!pr, short:true, sched:true });
        blk = null;
      } else blk = { ds:dsC, md:mdC, pri:pr };
      return;
    }
    if(blk){
      const bm = line.match(/^(당일|다음날)?\s*([가-힣]+.*\d.*호)\s*$/);
      if(bm){
        const pr = bm[1] ? bm[1]==='당일' : !!blk.pri;
        out.push({ hdr:bm[2].trim(), prop:findPropByAddress(bm[2]), ds:blk.ds, md:blk.md, nights:'', guests:'', small:'', large:'', none:false, note: pr?'당일 체크인':'', pri:pr, short:true, sched:true });
        return;
      }
      blk = null;
    }
    // 스케줄표 형식: 주소·비번 줄 아래에 "11.01 일 (당일) 1~6" 줄들 (날짜 = 청소일, (당일) = 당일 체크인, 1~6 = 투숙 기간)
    const dr = line.match(/^(\d{1,2})\s*\.\s*(\d{1,2})\s*([월화수목금토일])?\s*(\(\s*당일\s*\))?\s*(\d{1,2})\s*~\s*(\d{1,2})/);
    if(dr){
      slashDs = null;
      const m1 = +dr[1], d1 = +dr[2], d2 = +dr[6];
      const endM = d2 < d1 ? m1 + 1 : m1;
      const stay = m1+'/'+d1+'~'+endM+'/'+d2;
      const pri = !!dr[4];
      dotLast = ({ hdr:dotHdr, prop:dotProp, ds: toDs(m1, d1), md: m1+'/'+d1, nights:'', guests:'', small:'', large:'', none:false, note: pri ? '당일 체크인' : '', pri, short:true, sched:true, pw:(pwA?{b:pwB,a:pwA}:null) }); out.push(dotLast);
      return;
    }
    if(line.indexOf('🔑')<0 && (/[가-힣]+(?:로|길)\s*\d/.test(line) || /[가-힣]+동\s*\d+-\d+/.test(line)) && !/^\d{1,2}\s*[./]/.test(line)){
      dotHdr = line; dotProp = findPropByAddress(line); slashDs = null; cur = null; dotLast = null; pwB = ''; pwA = ''; return;
    }
    { const pb = line.match(/변경\s*전[^:：]*[:：]\s*([^\s]+)/), pa = line.match(/변경\s*후[^:：]*[:：]\s*([^\s]+)/);
      if(dotHdr && (pb||pa) && /비번|비밀번호/.test(line) && !/^\d{1,2}\s*[./]/.test(line)){ if(pb) pwB = pb[1]; if(pa) pwA = pa[1]; return; } }
    // 주소 줄 다음의 숙소 이름 줄 (주소로 못 찾았을 때만)
    if(dotHdr && !dotProp && !dotLast && !/\d/.test(line) && line.length<=20){ const m = findBestPropertyMatch(line); if(m){ dotProp = m; dotHdr = dotHdr+' · '+line; return; } }
    // 안내 줄: "■ 당일 체크인 아닙니다" → 바로 앞 날짜의 당일 여부
    if(dotLast && /당일\s*체크인/.test(line) && !/^\d{1,2}\s*[./]/.test(line)){
      const no = /아닙|아님|없/.test(line);
      dotLast.pri = !no; dotLast.note = no ? '' : '당일 체크인'; return;
    }
    // "11.10일 화요일 체크아웃 청소" 형식
    const d2 = line.match(/^(\d{1,2})\s*\.\s*(\d{1,2})\s*일?\s*(?:[월화수목금토일]요일|[월화수목금토일])?\s*(.*)$/);
    if(d2 && dotHdr && /체크아웃|청소|당일/.test(d2[3])){
      slashDs = null;
      const pri2 = /당일/.test(d2[3]) && !/아닙|아님|없/.test(d2[3]);
      dotLast = { hdr:dotHdr, prop:dotProp, ds: toDs(+d2[1], +d2[2]), md: d2[1]+'/'+d2[2], nights:'', guests:'', small:'', large:'', none:false, note: pri2 ? '당일 체크인' : '', pri: pri2, short:true, sched:true, pw:(pwA?{b:pwB,a:pwA}:null) };
      out.push(dotLast); return;
    }
    // 짧은 형식: "10/23(금)" 날짜 줄 아래에 "301호-수건12장(체크인O)" 줄들
    const sd = line.match(/^(\d{1,2})\s*\/\s*(\d{1,2})\s*(?:\([월화수목금토일]\))?\s*$/);
    if(sd){ slashDs = toDs(+sd[1], +sd[2]); slashMd = sd[1]+'/'+sd[2]; cur = null; return; }
    if(slashDs && line.indexOf('🔑')<0){
      const sl = line.match(/^(.+?)\s*[-–—]\s*(.+)$/);
      if(sl){
        const name = sl[1].trim(), content = sl[2].trim();
        const pri = /체크인\s*[OoㅇⓄ○]/.test(content);
        const tw = content.match(/수건\s*(\d+)\s*장?/);
        let rest = content.replace(/\(?\s*체크인\s*[OoㅇⓄ○XxⓍ×]\s*\)?/g,'').replace(/수건\s*\d+\s*장?/g,'').replace(/[()\s]+$/,'').replace(/^[()\s,·]+/,'').trim();
        const note = [tw?'수건 '+tw[1]+'장':'', pri?'당일 체크인':'', rest].filter(Boolean).join(' · ');
        out.push({ hdr:name, prop:findProp(name), ds:slashDs, md:slashMd, nights:'', guests:'', small:'', large:'', none:false, note, pri, short:true });
        return;
      }
    }
    if(line.indexOf('🔑')>=0){
      slashDs = null;
      const m = line.match(/🔑\s*(.+?)\s*🔑/);
      hdr = m ? m[1].trim() : line.replace(/🔑/g,'').replace(/PW.*$/i,'').trim();
      prop = findProp(hdr); cur = null; return;
    }
    const dm = line.match(/^(\d{1,2})\s*월\s*(\d{1,2})\s*일\s*(?:\(\s*(\d+)\s*박\s*\))?\s*(.*)$/);
    if(dm){
      const rest = dm[4] || '';
      slashDs = null;
      cur = { hdr, prop, ds: toDs(+dm[1], +dm[2]), md: dm[1]+'/'+dm[2], nights: dm[3]||'', guests:'', small:'', large:'', none: /당일\s*예약/.test(rest) };
      out.push(cur); return;
    }
    if(!cur) return;
    const g = line.match(/게스트\s*(\d+)\s*명/); if(g){ cur.guests = g[1]; return; }
    const sm = line.match(/작은\s*수건\s*[\]}）)]?\s*[:：]?\s*(\d+)/); if(sm){ cur.small = sm[1]; return; }
    const lg = line.match(/큰\s*수건\s*[\]}）)]?\s*[:：]?\s*(\d+)/); if(lg){ cur.large = lg[1]; return; }
  });
  out.forEach(e=>{
    if(e.pw && e.pw.a){ e.note = [e.pri?'당일 체크인':'', '청소 후 비번 '+e.pw.a+'(으)로 변경'].filter(Boolean).join(' · '); }
    if(e.note) return;
    e.note = e.none ? '당일예약 없음' : [e.nights?e.nights+'박':'', e.guests?'게스트 '+e.guests+'명':'', e.small?'작은수건 '+e.small:'', e.large?'큰수건 '+e.large:''].filter(Boolean).join(' · ');
  });
  return out.filter(e=>e.note || e.sched);
}
async function calMsgLoadRec(ds){
  if(ds === state.selectedDate && state.todayRecord) return state.todayRecord;
  try{ const x = await window.storage.get('today:'+ds, false); if(x && x.value) return JSON.parse(x.value); }catch(e){}
  return null;
}

// ===== 통합 붙여넣기: 배정 문서("조아라님 / 1.숙소 / 비번*")와 청소 일정 캘린더 메시지("🔑 1208호 🔑 / 10월 22일(1박)…")를 자동 구분 =====

// 줄글 배정: "내일 조정이님 엘지2개 박미정님 창천동잇다3룸입니다" → 그날 카드에서 찾아 직원에게 배정
function parseLooseAssign(text){
  const r = state.todayRecord; if(!r) return [];
  const dayProps = (r.propertyIds||[]).map(id=>propById(id)).filter(Boolean);
  const esc2 = x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  let marks = [];
  state.staff.forEach(st=>{
    const re = new RegExp(esc2(st.name)+(st.name.length>=3?'\\s*님?':'\\s*님'),'g'); let m;
    while((m = re.exec(text))) marks.push({ i:m.index, end:m.index+m[0].length, st });
  });
  marks.sort((a,b)=>a.i-b.i);
  marks = marks.filter((m,k)=> k===0 || m.i >= marks[k-1].end);
  const STOP = /입니다|이에요|예요|이고|하고|그리고|담당|배정|청소|내일|오늘|모레|[,，·]/g;
  const groups = [];
  marks.forEach((mk,k)=>{
    const seg = text.slice(mk.end, k+1<marks.length ? marks[k+1].i : text.length).replace(STOP,' ');
    const items = [];
    seg.split(/\s+/).map(t=>t.trim()).filter(t=>t.length>=2).forEach(tok=>{
      const um = tok.match(/^(.*?)(\d+)\s*(개|곳|룸)$/);
      const base = um ? um[1] : tok;
      const key = nameKey(base);
      let cands = key ? dayProps.filter(p=> nameKey(p.name).includes(key) || (p.aliases||[]).some(a=>nameKey(a).includes(key))) : [];
      let need = null, note = '';
      if(um && um[3]==='룸'){
        const f = cands.filter(p=>roomCount(p)===+um[2]);
        if(f.length) cands = f; else if(cands.length) note = '룸 수가 달라서 직접 골라줘';
        need = 1;
      } else if(um){ need = +um[2]; }
      let pre = [];
      if(need===null) pre = cands.map(p=>p.id);
      else if(cands.length<=need && !note) pre = cands.map(p=>p.id);
      items.push({ tok, cands, pre:new Set(pre), need, note });
    });
    groups.push({ staff: mk.st, items });
  });
  return groups.filter(g=>g.items.length);
}
function looseAssignParts(groups){
  const r = state.todayRecord;
  const rows = groups.map((g,gi)=>{
    const items = g.items.map((it,ii)=>{
      if(!it.cands.length) return `<div style="font-size:13px;padding:3px 0 3px 8px;">"${esc(it.tok)}" <span style="color:var(--clay);">이 날 카드에서 못 찾았어 (건너뜀)</span></div>`;
      const boxes = it.cands.map(p=>{
        const cur = staffById((r.assign||{})[p.id]);
        return `<label style="display:block;font-size:13px;padding:2px 0 2px 14px;"><input type="checkbox" data-lo="${gi}:${ii}:${p.id}" ${it.pre.has(p.id)?'checked':''}> ${esc(p.name)}${cur&&cur.id!==g.staff.id?` <span style="color:var(--ink-soft);">(지금 ${esc(cur.name)})</span>`:''}</label>`;
      }).join('');
      const hint = it.note ? `<div style="font-size:12px;color:var(--clay);padding-left:14px;">${esc(it.note)}</div>` : (it.need!==null && it.cands.length>it.need ? `<div style="font-size:12px;color:var(--clay);padding-left:14px;">후보가 여러 곳이라 ${it.need}곳을 골라줘</div>` : '');
      return `<div style="font-size:13px;padding:3px 0 3px 8px;">"${esc(it.tok)}"${hint}${boxes}</div>`;
    }).join('');
    return `<div style="font-weight:700;margin-top:10px;">${esc(g.staff.name)}</div>${items}`;
  }).join('');
  const html = `<div style="font-weight:800;margin-top:12px;padding-top:8px;border-top:1px solid var(--paper-line);">줄글로 읽었어 · ${esc(renderDateLabel())}</div>
    <div style="font-size:12px;color:var(--ink-soft);">체크된 카드를 그 직원에게 배정해. 틀리면 체크를 바꿔줘.</div>${rows}`;
  const apply = (root)=>{
    r.assign = r.assign || {}; r.workOrder = r.workOrder || {};
    let n = 0;
    groups.forEach((g,gi)=>{
      const seq = [];
      root.querySelectorAll('[data-lo]').forEach(c=>{
        const [a,,pid] = c.dataset.lo.split(':');
        if(+a===gi && c.checked && !seq.includes(pid)) seq.push(pid);
      });
      if(!seq.length) return;
      seq.forEach(pid=>{ r.assign[pid] = g.staff.id; n++; });
      const rest = staffAssignedProps(g.staff.id).filter(id=>!seq.includes(id));
      seq.concat(rest).forEach((id,k)=>{ r.workOrder[id] = k+1; });
    });
    return n;
  };
  return { html, apply };
}
function openPasteSheet(){
  const root = document.createElement('div'); root.className='overlay'; root.id='overlay';
  root.innerHTML = `<div class="sheet" style="max-height:88vh;overflow:auto;"><h2>📥 메시지 붙여넣기</h2>
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:6px;">아래 두 가지를 구분해서 읽어줘. 둘이 섞여 있어도 돼. 미리보기부터 보여주고 저장은 "적용"을 눌러야 해.<br>
    · <b>배정 문서</b> 예) 조아라님 ↵ 1.창천동 잇다 302호 / 3198* → <b>${esc(renderDateLabel())}</b> 일정에 작업자·순서·오늘 비번·메모<br>
    · <b>수건·인원 메시지</b> 예) 🔑 1208호 🔑 ↵ 10월 22일(1박) ↵ 게스트 2명 ↵ [작은수건] 6 → 날짜별 카드의 오늘 특이사항<br>
    · <b>줄글</b> 예) 조정이님 엘지2개 박미정님 창천동잇다3룸 → 이 날 카드에서 찾아 배정</div>
    <textarea id="ps_text" style="width:100%;height:240px;font-size:13px;"></textarea>
    <div class="sheet-actions"><button class="cancel-btn" id="ps_cancel">닫기</button><button class="save-btn" id="ps_next">미리보기</button></div></div>`;
  document.body.appendChild(root);
  root.onclick = (ev)=>{ if(ev.target===root) root.remove(); };
  document.getElementById('ps_cancel').onclick = ()=> root.remove();
  document.getElementById('ps_next').onclick = ()=>{
    const text = document.getElementById('ps_text').value;
    const entries = parseCalMsg(text);
    let groups = parseAssignDoc(text).filter(g=>g.items.length);
    // 날짜 스케줄로 읽힌 경우, "01 일 (당일) 1~6" 같은 줄이 번호 줄로 잘못 잡힌 이름 없는 묶음은 버림
    if(entries.length) groups = groups.filter(g=>g.name);
    const loose = (!entries.length && !groups.length) ? parseLooseAssign(text) : [];
    if(!entries.length && !groups.length && !loose.length){ alert('읽을 수 있는 줄을 못 찾았어.\n배정 문서는 "조아라님" 다음 줄에 "1.숙소 / 비번",\n수건 메시지는 "10월 22일(1박)" 형식,\n줄글은 "조정이님 엘지2개 박미정님 창천동잇다3룸"처럼 직원 이름(님)이 들어 있어야 해.'); return; }
    root.remove(); openPastePreview(groups, entries, text, loose);
  };
}
// 배정 문서 미리보기 조각 + 적용(저장은 호출한 쪽에서)
function assignPreviewParts(groups){
  const r = state.todayRecord;
  const inDay = id=> r && (r.propertyIds||[]).includes(id);
  const rows = groups.map(g=>{
    const head = `<div style="font-weight:700;margin-top:10px;">${esc(g.name||'(작업자 이름 없음)')}${g.staff?'':' <span style="color:var(--clay);font-size:12px;">⚠️ 직원 목록에 없어</span>'}</div>`;
    const items = g.items.map((it,i)=>{
      const st = !it.prop ? '<span style="color:var(--clay);">숙소를 못 찾았어</span>' : (!inDay(it.prop.id) ? '<span style="color:var(--clay);">이 날 일정에 없어 (건너뜀)</span>' : '<span style="color:var(--teal);">✓</span>');
      return `<div style="font-size:13px;padding:3px 0 3px 8px;">${i+1}. ${esc(it.nameRaw)}${it.prop?` → <b>${esc(it.prop.name)}</b>`:''} ${st}${it.pass?`<div style="color:var(--ink-soft);padding-left:14px;">비번 ${esc(it.pass)}</div>`:''}${it.notes.length?`<div style="color:var(--ink-soft);padding-left:14px;">메모 ${esc(it.notes.join(', '))}</div>`:''}</div>`;
    }).join('');
    return head+items;
  }).join('');
  const html = `<div style="font-weight:800;margin-top:12px;padding-top:8px;border-top:1px solid var(--paper-line);">배정 문서로 읽었어 · ${esc(renderDateLabel())}</div>
    <div style="font-size:12px;color:var(--ink-soft);">적용하면 작업자 배정·작업 순서·오늘 비번·메모가 들어가.</div>${rows}`;
  const apply = ()=>{
    if(!r) return 0;
    r.assign = r.assign || {}; r.dayPass = r.dayPass || {}; r.dayNotes = r.dayNotes || {};
    let n = 0; const orderByStaff = [];
    groups.forEach(g=>{
      const seq = [];
      g.items.forEach(it=>{
        if(!it.prop || !inDay(it.prop.id)) return;
        const id = it.prop.id; seq.push(id);
        if(g.staff) r.assign[id] = g.staff.id;
        if(it.pass) r.dayPass[id] = it.pass;
        if(it.notes.length){ const old = (r.dayNotes[id]||'').trim(); const add = it.notes.join(', '); if(!old.includes(add)) r.dayNotes[id] = old ? old+' · '+add : add; }
        n++;
      });
      if(seq.length) orderByStaff.push(seq);
    });
    r.workOrder = r.workOrder || {};
    orderByStaff.forEach(seq=>{ seq.forEach((id,k)=>{ r.workOrder[id] = k+1; }); });
    return n;
  };
  return { html, apply };
}
// 수건·인원 메시지 미리보기 조각 + 적용
async function calPreviewParts(entries){
  const recs = {};
  for(const ds of [...new Set(entries.map(e=>e.ds))]) recs[ds] = await calMsgLoadRec(ds);
  entries.forEach(e=>{
    const rec = recs[e.ds];
    // "301호"처럼 번호만 있어 숙소가 여러 곳이면, 그날 일정에 있는 카드 중 하나로 정해지면 그걸 씀
    if(!e.prop){
      const num = String(e.hdr||'').match(/^(\d{3,4})\s*호?$/);
      if(num && rec){
        const hits = state.properties.filter(p=> new RegExp('(^|\\D)'+num[1]+'(\\D|$)').test(p.name) && (rec.propertyIds||[]).includes(p.id));
        if(hits.length===1) e.prop = hits[0];
      }
    }
    e.exists = !!(e.prop && rec && (rec.propertyIds||[]).includes(e.prop.id));
    const old = e.exists ? (((rec.dayNotes||{})[e.prop.id])||'').trim() : '';
    e.already = (e.exists && !e.note && !e.pri) || (!!old && !!e.note && (old.includes(e.note) || (/게스트/.test(old) && /수건/.test(old))));
  });
  const rows = []; let lastHdr = null;
  entries.forEach((e,i)=>{
    if(e.hdr !== lastHdr){
      lastHdr = e.hdr;
      const pick = e.prop ? '' : `<div style="font-weight:400;"><select data-cm-map="${i}" style="width:100%;margin-top:4px;padding:6px;border:1px solid var(--paper-line);border-radius:8px;"><option value="">숙소를 직접 고르기…</option>${state.properties.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),'ko')).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>`;
      rows.push(`<div style="font-weight:700;margin-top:10px;">${esc(e.hdr||'(숙소 이름 없음)')}${e.prop?` → ${esc(e.prop.name)}`:' <span style="color:var(--clay);font-size:12px;">⚠️ 숙소를 못 찾았어 (고르지 않으면 건너뜀)</span>'}${pick}</div>`);
    }
    let st = '';
    if(!e.prop) st = '';
    else if(e.already) st = '<span style="color:var(--ink-soft);">'+(e.note?'이미 입력돼 있어':'이미 일정에 있어')+' (건너뜀)</span>';
    else if(e.exists) st = '<span style="color:var(--teal);">✓ 이 날 카드에 넣어</span>';
    else st = `<label style="color:var(--clay);"><input type="checkbox" data-cm-add="${i}" ${e.sched?'checked':''}> 이 날 일정에 카드가 없어 · 카드도 추가</label>`;
    let pwChk = '';
    if(e.pw && e.pw.a && e.prop){
      const nz = x=>String(x||'').replace(/[\s*]/g,'');
      const saved = e.prop.password || '';
      if(isMaebeonProp(e.prop)) pwChk = `<div style="padding-left:14px;font-size:12px;color:var(--teal);">🔑 매번 바뀌는 곳 → 오늘 비번 칸에 ${esc(e.pw.b||'(없음)')} · 특이사항에 새 비번 ${esc(e.pw.a)}</div>`;
      else if(nz(saved) && nz(saved)===nz(e.pw.b)) pwChk = `<div style="padding-left:14px;font-size:12px;color:var(--teal);">🔑 변경 전 비번이 앱에 저장된 것(${esc(saved)})과 같아 ✓ · 이 날 이후 새 비번 ${esc(e.pw.a)}</div>`;
      else if(nz(saved)===nz(e.pw.a)) pwChk = `<div style="padding-left:14px;font-size:12px;color:var(--teal);">🔑 앱에 이미 새 비번(${esc(saved)})으로 저장돼 있어 ✓</div>`;
      else pwChk = `<div style="padding-left:14px;font-size:12px;color:var(--clay);">⚠️ 앱에 저장된 비번(${esc(saved||'없음')})이 변경 전(${esc(e.pw.b||'-')})·변경 후(${esc(e.pw.a)}) 둘 다와 달라</div>`;
    }
    const priBox = (e.pri && e.prop && !e.already) ? `<label style="display:block;padding-left:14px;"><input type="checkbox" data-cm-pri="${i}" checked> 🔴 당일 체크인으로도 표시</label>` : '';
    rows.push(`<div style="font-size:13px;padding:3px 0 3px 8px;"><b>${e.md}</b> ${esc(e.note)}${st?`<div style="padding-left:14px;">${st}</div>`:''}${pwChk}${priBox}</div>`);
  });
  const todo = entries.filter(e=>e.prop && !e.already && e.exists).length;
  const missing = entries.filter(e=>e.prop && !e.already && !e.exists).length;
  const html = `<div style="font-weight:800;margin-top:12px;padding-top:8px;border-top:1px solid var(--paper-line);">${entries.every(e=>e.sched)?'스케줄표로 읽었어':'수건·인원 메시지로 읽었어'}</div>
    <div style="font-size:12px;color:var(--ink-soft);">카드가 없는 날은 체크한 날만 카드를 만들어서 넣고, 체크 해제하면 건너뛰어.<br>카드에 넣을 곳 ${todo}건${missing?` · 카드 없는 곳 ${missing}건`:''}</div>${rows.join('')}`;
  const apply = (root)=>{
    const addSet = new Set([...root.querySelectorAll('[data-cm-add]')].filter(c=>c.checked).map(c=>+c.dataset.cmAdd));
    const priSet = new Set([...root.querySelectorAll('[data-cm-pri]')].filter(c=>c.checked).map(c=>+c.dataset.cmPri));
    let n = 0, added = 0, skipped = 0; const touched = new Set();
    entries.forEach((e,i)=>{
      if(!e.prop || e.already || (!e.exists && !addSet.has(i))){ skipped++; return; }
      let rec = recs[e.ds];
      if(!rec){ rec = { propertyIds:[], tasks:{}, priorityIds:[], excludedIds:[] }; recs[e.ds] = rec; }
      rec.propertyIds = rec.propertyIds||[]; rec.tasks = rec.tasks||{}; rec.priorityIds = rec.priorityIds||[]; rec.excludedIds = rec.excludedIds||[];
      const id = e.prop.id;
      if(!rec.propertyIds.includes(id)){
        rec.propertyIds.push(id);
        rec.tasks[id] = tasksForProperty(e.prop).map(text=>({text, done:false}));
        if(e.prop.alwaysPriority && !rec.priorityIds.includes(id)) rec.priorityIds.push(id);
        rec.excludedIds = rec.excludedIds.filter(x=>x.id!==id);
        added++;
      }
      rec.dayNotes = rec.dayNotes || {};
      const old = (rec.dayNotes[id]||'').trim();
      if(e.note) rec.dayNotes[id] = old ? old+' · '+e.note : e.note;
      if(e.pw && e.pw.b && isMaebeonProp(e.prop)){ rec.dayPass = rec.dayPass||{}; if(!rec.dayPass[id]) rec.dayPass[id] = e.pw.b; }
      if(priSet.has(i) && !rec.priorityIds.includes(id)) rec.priorityIds.push(id);
      touched.add(e.ds); n++;
    });
    return { n, added, skipped, touched, recs };
  };
  return { html, apply };
}

function buildPersonalText(st, withPw, withAddr, greet){
  if(withAddr===undefined) withAddr = true;
  const r = state.todayRecord;
  const ids = staffAssignedProps(st.id);
  const NUM = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
  const tm = (t)=> /^\d{1,2}$/.test(String(t).trim()) ? String(t).trim()+'시' : String(t).trim();

    if(note) lines.push(`- ${note}`);
  });
  if(greet){ lines.push(''); lines.push(greet); }

function loadImageEl(file){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); res(img); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('이미지를 열 수 없어')); };
    img.src = url;
  });
}
function imgToDataUrl(img, maxDim, quality){
  const r = Math.min(1, maxDim / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * r)), h = Math.max(1, Math.round(img.height * r));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  return c.toDataURL('image/jpeg', quality);
}
async function uploadPhotos(propId, files){
  const date = state.selectedDate;
  let ok = 0;
  for(const file of files){
    try{
      const img = await loadImageEl(file);
      let full = imgToDataUrl(img, 1280, 0.72);
      if(full.length > 700000) full = imgToDataUrl(img, 1000, 0.6);
      const thumb = imgToDataUrl(img, 240, 0.6);
      const id = date+'_'+propId+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
      const base = { pdate: date, propId, id, ts: Date.now(), by: cloud.user.email };
      await cloud.fn.setDoc(kvDoc('pf:'+id), { ...base, kind:'full', data: full });
      await cloud.fn.setDoc(kvDoc('photo:'+id), { ...base, kind:'thumb', thumb });
      ok++;
    }catch(e){ alert('사진 올리기에 실패했어: '+(e.message||e)); }
  }
  return ok;
}

    return { id, p, name:p.name, pri: pri.includes(id), done, wash, worker: (staffById((rec.assign||{})[id])||{}).name || '' };
  }).filter(Boolean).sort((x,y)=> (y.pri-x.pri) || cmpByColor(x.p, y.p));

async function moveProperty(id){
  const p = propById(id); const rec = state.todayRecord;
  if(!p || !rec) return;
  const v = prompt(p.name+' 일정을 어느 날짜로 옮길까? (예: 10/15)');
  if(!v) return;
  const m = v.match(/(\d{1,2})\s*[\/\-.월]\s*(\d{1,2})/);
  if(!m){ alert('날짜를 "10/15" 형식으로 입력해줘.'); return; }
  const yy = Number(state.selectedDate.slice(0,4));
  const ds = yy+'-'+pad2(Number(m[1]))+'-'+pad2(Number(m[2]));
  if(ds === state.selectedDate){ alert('같은 날짜야.'); return; }
  let tgt = null;
  try{ const x = await window.storage.get('today:'+ds, false); if(x && x.value) tgt = JSON.parse(x.value); }catch(e){}
  if(!tgt) tgt = { propertyIds:[], tasks:{}, priorityIds:[], excludedIds:[] };
  tgt.propertyIds = tgt.propertyIds||[]; tgt.tasks = tgt.tasks||{}; tgt.priorityIds = tgt.priorityIds||[]; tgt.excludedIds = tgt.excludedIds||[];
  if(tgt.propertyIds.includes(id)){ alert('그 날짜에 이미 있어.'); return; }
  if(!confirm(p.name+' 일정을 '+Number(m[1])+'/'+Number(m[2])+'로 옮길까?')) return;
  tgt.propertyIds.push(id);
  tgt.tasks[id] = (rec.tasks||{})[id] || tasksForProperty(p).map(text=>({text, done:false}));
  if((rec.priorityIds||[]).includes(id) && !tgt.priorityIds.includes(id)) tgt.priorityIds.push(id);
  if((rec.assign||{})[id]){ tgt.assign = tgt.assign||{}; tgt.assign[id] = rec.assign[id]; }
  if((rec.dayNotes||{})[id]){ tgt.dayNotes = tgt.dayNotes||{}; tgt.dayNotes[id] = rec.dayNotes[id]; }
  // 오늘 비번은 그날 전용이라 다른 날짜로 옮기지 않음
  try{ await window.storage.set('today:'+ds, JSON.stringify(tgt), false); }catch(e){ alert('저장에 실패했어.'); return; }
  // 저장 직후 실시간 반영으로 state.todayRecord가 새 객체로 바뀔 수 있어서 다시 가져옴
  const cur = state.todayRecord || rec;
  cur.propertyIds = (cur.propertyIds||[]).filter(x=>x!==id);
  if(cur.tasks) delete cur.tasks[id];
  cur.priorityIds = (cur.priorityIds||[]).filter(x=>x!==id);
  if(cur.assign) delete cur.assign[id];
  if(cur.dayNotes) delete cur.dayNotes[id];
  if(cur.dayPass) delete cur.dayPass[id];
  state.todayRecord = cur;
  await saveTodayRecord();
  render();
}

// 붙여넣은 글에서 날짜로 시작하는데 결과에 반영되지 않은 줄 찾기 ("읽지 못한 줄" 경고용)
function findUnreadLines(text, data){
  const days = {}; // 일 → Set(월)
  Object.keys(data||{}).forEach(ds=>{ const m = Number(ds.slice(5,7)), d = Number(ds.slice(8,10)); (days[d] = days[d] || new Set()).add(m); });
  const out = [];
  String(text||'').split(/\r?\n/).forEach(raw=>{
    const line = raw.replace(/[|*#`]/g,' ').trim(); if(!line) return;
    const m = line.match(/^(?:(\d{1,2})\s*[\/월.]\s*)?(\d{1,2})\s*(?:일|\(|\)|■|-|–|:|：|\s|$)/);
    if(!m) return;
    const mo = m[1] ? Number(m[1]) : 0, d = Number(m[2]);
    if(d<1 || d>31 || (mo && (mo<1 || mo>12))) return;
    const hit = days[d] && (!mo || days[d].has(mo));
    if(!hit) out.push(line);
  });
  return out;
}
// 호실별 표: "LG 729호" 머리글 + 줄마다 청소일·(체크인→체크아웃)·박수·인원·당일 O/X
//  - 채팅 표 복사: "11/2 | 10/30 → 11/2 | 4박 | 2명 | X"
//  - 엑셀 복사: "11월2일 10월30일 11월2일 4박 2명 X"
//  - 문자: "508호 청소" 아래 "11/2) 4박3명 x" (모르면 ?)
function parseUnitSchedule(text, defYear){
  const out = {}; let hdr = '';
  const clean = x=> String(x||'').replace(/[|*#`]/g,' ').replace(/\s+/g,' ').trim();
  String(text||'').split(/\r?\n/).forEach(raw=>{
    const line = clean(raw); if(!line) return;
    let m = line.match(/^(\d{1,2})\s*월\s*(\d{1,2})\s*일\s+\d{1,2}\s*월\s*\d{1,2}\s*일\s+\d{1,2}\s*월\s*\d{1,2}\s*일\s+(.*)$/);   // 엑셀
    let rest = '', mo = 0, dd = 0;
    if(m){ mo = +m[1]; dd = +m[2]; rest = m[3]; }
    else {
      m = line.match(/^(\d{1,2})\s*\/\s*(\d{1,2})\s*\)?\s*(.*)$/);   // 11/2) … 또는 11/2 …
      if(m && hdr){ mo = +m[1]; dd = +m[2]; rest = m[3]; }
      else {
        // 머리글: 호수가 들어 있고 날짜로 시작하지 않는 줄
        if(!/^\d{1,2}\s*[\/월.]/.test(line) && /\d{3,4}\s*호/.test(line) && !/청소일|체크인\s*체크아웃/.test(line.replace(/\d{3,4}\s*호/,'')) ){
          const hm = line.match(/^(.*?\d{3,4}\s*호)/); hdr = hm ? hm[1].replace(/\s*청소.*$/,'').trim() : line;
        }
        return;
      }
    }
    const nights = (rest.match(/(\d+)\s*박/)||[])[1], guests = (rest.match(/(\d+)\s*명/)||[])[1];
    const flag = (rest.match(/([OoXx○×ㅇ])\s*$/)||[])[1];
    if(!flag && !nights && !guests && !/[?？미정]/.test(rest)) return;
    const today = !!flag && /[Oo○ㅇ]/.test(flag);
    const bits = []; if(nights) bits.push(nights+'박'); if(guests) bits.push(guests+'명');
    const note = (nights||guests) ? bits.join(' · ') : '박수·인원 미정';
    const ds = defYear+'-'+pad2(mo)+'-'+pad2(dd);
    (out[ds] = out[ds] || []).push({ raw: hdr || '(숙소 이름 없음)', today, note });
  });
  return out;
}
// 호수만으로 숙소 찾기 ("LG 729호" → 이름에 729가 든 숙소가 하나뿐이면)
function matchByUnitNumber(name){
  const n = String(name||'').match(/(\d{3,4})\s*호/); if(!n) return null;
  let c = state.properties.filter(p=> new RegExp('(^|\\D)'+n[1]+'(\\D|$)').test(p.name));
  if(c.length>1){ const brand = /(LG|엘지|파라다이스)/i.test(name) ? c.filter(p=>/(LG|엘지|파라다이스)/i.test(p.name)) : c; if(brand.length) c = brand; }
  return c.length===1 ? c[0] : null;
}
function parseScheduleText(text, defYear){
  const out = {}; let hdrName = '', brand = '';
  String(text||'').split(/\r?\n/).forEach(line=>{
    // "***** 망원동 1층 스케쥴표 *****" 머리글 → 아래 "10/28(수) - 1층 (당일체크인 o)" 줄들의 숙소 이름
    // "< 11월 스테이동교 청소 >" 같은 제목 → "스테이C"를 "동교스테이C"로
    { const bm = !/^\s*\d/.test(line) ? line.match(/스테이\s*([가-힣]{1,4})/) : null; if(bm) brand = bm[1]+'스테이'; }
    const hm = line.match(/^[\s*★☆■▶\-=]*(.+?)\s*스케[줄쥴]\s*표[\s*★☆■▶\-=]*$/);
    if(hm){ hdrName = hm[1].replace(/[*★☆]/g,'').trim(); return; }
    const m = line.match(/^\s*(?:(\d{4})[-\/.])?(\d{1,2})\s*[\/\-.월]\s*(\d{1,2})\s*일?\s*(?:\([^)]*\))?\s*[:：]?\s*(.*)$/);
    if(!m) return;
    const y = m[1] ? Number(m[1]) : defYear;
    const ds = y+'-'+pad2(Number(m[2]))+'-'+pad2(Number(m[3]));
    if(hdrName && /^[-–]/.test(m[4].trim())){
      const c = m[4];
      const yes = /당일\s*체크인\s*[OoㅇⓄ○]/.test(c), pending = /당일\s*체크인\s*(미정|확인|\?)/.test(c);
      (out[ds] = out[ds] || []).push({ raw: hdrName, today: yes, note: pending ? '당일 체크인 미정' : '' });
      return;
    }
    m[4].split(/[,，\/]/).map(x=>x.trim()).filter(Boolean).forEach(it=>{
      const parts = it.split('|');
      let raw = parts[0].trim().replace(/^[\-–•·*▶▷\s]+/, '');
      const today = /_?\s*당일|\(당일\)/.test(raw);
      raw = raw.replace(/_?\s*당일/g,'').replace(/\((?:수정|추가|변경|취소)\)/g,'').replace(/[_\s]+$/,'').trim();
      if(!raw) return;
      if(brand && /^스테이\s*[A-Za-z]$/.test(raw)) raw = brand+raw.replace(/^스테이\s*/,'');
      (out[ds] = out[ds] || []).push({ raw, today, note: parts.slice(1).join('|').trim() });
    });
  });
  return out;
}


// "19(월)-2개(101호X,301호O)" 형식: 월/건물이름은 따로 받음. O=당일체크인, X=없음
function isDayParenFormat(text){
  return String(text||'').split(/\r?\n/).some(l=>/^\s*(?:\d{1,2}\s*\/\s*)?\d{1,2}\s*\(\s*[월화수목금토일]\s*\)\s*[-–:]/.test(l) && /\d{3,4}\s*호/.test(l));
}
// "28(수)-1개(301호X)" / "11/1(일)-3개(101호X,102호O,301호O)": 월이 없는 줄은 요일로 월을 알아냄 (O=당일체크인, X=아님)
function parseDayParen(text, year, prefix){
  const out = {}; const WD = '일월화수목금토';
  const now = new Date(); const base = new Date(now.getFullYear(), now.getMonth(), now.getDate()-10);
  let curM = null, lastD = 0, lastM = null;
  String(text||'').split(/\r?\n/).forEach(line=>{
    const m = line.match(/^\s*(?:(\d{1,2})\s*\/\s*)?(\d{1,2})\s*\(\s*([월화수목금토일])\s*\)\s*[-–:]\s*(.*)$/);
    if(!m) return;
    const day = Number(m[2]); let mo, yy;
    if(m[1]){ mo = Number(m[1]); yy = year; if(new Date(yy, mo-1, day) < new Date(base.getFullYear(), base.getMonth()-6, 1)) yy++; }
    else {
      // 요일이 맞는 가장 가까운 날짜 (오늘 10일 전부터 4달 안)
      let found = null;
      for(let k=0; k<5 && !found; k++){
        const cand = new Date(base.getFullYear(), base.getMonth()+k, day);
        if(cand.getDate()===day && WD[cand.getDay()]===m[3] && cand >= base) found = cand;
      }
      if(!found && lastM!==null){ const mm = day < lastD ? lastM+1 : lastM; found = new Date(year, mm-1, day); }
      if(!found) return;
      mo = found.getMonth()+1; yy = found.getFullYear();
    }
    lastM = mo; lastD = day;
    const ds = yy+'-'+pad2(mo)+'-'+pad2(day);
    const inside = (m[4].match(/\(([^)]*)\)/)||[])[1] || '';
    inside.split(/[,，]/).forEach(tok=>{
      const t = tok.match(/(\d{3,4})\s*호?\s*([OoXx○×])?/);
      if(!t) return;
      (out[ds] = out[ds] || []).push({ raw: (prefix+' '+t[1]).trim(), today: /[Oo○]/.test(t[2]||''), note: '' });
    });
  });
  return out;
}
function parseKakaoSchedule(text, defYear){
  const out = []; const seen = new Set();
  const nowM = new Date().getMonth()+1;
  String(text||'').split(/\r?\n/).forEach(line=>{
    const m = line.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일\s*(?:\([^)]*\))?\s*(.*)$/);
    if(!m) return;
    const mo = Number(m[1]), d = Number(m[2]); let yy = defYear;
    if(mo < nowM - 6) yy = defYear + 1;

function cleanAddr(a){ return typeof a==='string' ? a.replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').trim() : a; }
function cleanProps(list){ return Array.isArray(list) ? list.map(p=> (p && typeof p.address==='string' && p.address.includes('](')) ? Object.assign({}, p, {address: cleanAddr(p.address)}) : p) : list; }
function normalizeAddressSpacing(address){
  if(!address) return address;
  // "로" 뒤에 바로 건물번호 숫자가 오면 띄어씀. 단 "OO로25길"처럼 로 다음이 길로 이어지는
  // 도로명(번길)은 규정상 붙여 쓰는 게 맞아서 그대로 둠.
  let a = address.replace(/(로)(\d+)(?!\d)(?!길)/g, '$1 $2');
  a = a.replace(/(길)(\d+)(?!\d)/g, '$1 $2');
  return a;
}

async function cleanupAddressSpacing(){

  state.properties = state.properties.map(p=>{

    if(fixed !== p.address) changed++;

  await saveProperties();

}

function unitFromAddr(a){ const t = String(a||''); const b = t.match(/([A-Za-z])\s*동\s*(\d{3,4})\s*호/); if(b) return b[1].toUpperCase()+b[2]; const ms = [...t.matchAll(/(\d{3,4})\s*호/g)]; return ms.length ? ms[ms.length-1][1] : ''; }
// 대표별 색 (원본 엑셀의 색을 그대로 옮김: bg=엑셀색, bar=같은 색을 진하게)
const OWNER_COLORS = {
  '구정택': {bg:'#FCE4D6', bar:'#F4B183'},
  '이수현': {bg:'#DDEBF7', bar:'#9DC3E6'},
  '김현진': {bg:'#F2CEEF', bar:'#E08AD6'},
  '이미선': {bg:'#E2EFDA', bar:'#A9D18E'},
  '조기환': {bg:'#FFF2CC', bar:'#FFD966'},  // 동교스테이 (이미선 연두와 구분되게 노랑)
};
// 대표가 비어 있는 숙소: 전화번호 또는 이름으로 색 지정 (순서 = 숙소 탭 정렬 순서)
const GROUP_COLORS = [
  {key:'잇다',   bg:'#E4DCF4', bar:'#9B86D6', phone:'01091409067', name:/^창천(동)?\s*잇다/},
  {key:'망원3룸', bg:'#D5F0EE', bar:'#4DB6AC', name:/^망원(동)?\s*3룸/},
];
function groupOf(p){
  const ph = String(p.phone||'').replace(/\D/g,''), nm = String(p.name||'').trim();
  return GROUP_COLORS.findIndex(g => (g.phone && g.phone===ph) || (g.name && g.name.test(nm)));
}
function barStyle(p){ return ''; }
function ownerStyle(p, tint){
  if(!p) return 'padding-left:21px;';
  let c = OWNER_COLORS[String(p.owner||'').trim()];
  if(!c){ const gi = groupOf(p); if(gi>=0) c = GROUP_COLORS[gi]; }
  if(!c) return 'padding-left:21px;';
  return `border-left:8px solid ${c.bar};` + (tint ? `background:${c.bg};` : '');
}
// 숙소 탭 정렬: 색(대표)별로 묶고, 그 안에서 이름순. 색 없는 건 맨 아래(대표/전화번호별)
function colorRank(p){
  const o = String(p.owner||'').trim();
  const keys = Object.keys(OWNER_COLORS);
  if(o && keys.includes(o)) return [keys.indexOf(o), ''];
  if(groupOf(p)>=0) return [keys.length+groupOf(p), ''];
  return [keys.length+GROUP_COLORS.length, o || String(p.phone||'').replace(/\D/g,'') || '~'];
}
function cmpByColor(a,b){
  const ra = colorRank(a), rb = colorRank(b);
  return (ra[0]-rb[0]) || ra[1].localeCompare(rb[1],'ko') || String(a.name||'').localeCompare(String(b.name||''),'ko');
}
function suggestPropName(old, all, addr){
  if(/^창천/.test(String(old||'').trim()) && addr && unitFromAddr(addr)) { const rm = /투룸/.test(old) ? '2룸' : ((String(old).match(/([123])\s*룸/)||[])[1] ? String(old).match(/([123])\s*룸/)[1]+'룸' : '2룸'); return ((/잇다/.test(old) || /신촌로\s*3나?길\s*8-10/.test(addr)) ? '창천잇다 ' : '창천 ')+rm+' '+unitFromAddr(addr); }
  let r = suggestPropName0(old, all).replace(/(\d)호(?=\s|$)/g,'$1');
  if(addr && !/\d{3,}/.test(r) && !/\d층$/.test(r) && !/\s[A-D]$/.test(r)){ const u = unitFromAddr(addr); if(u) r += ' '+u; else { const f = String(addr).match(/(\d{1,2})\s*층/); if(f) r += ' '+f[1]+'층'; } }
  return r;
}
function suggestPropName0(old, all){
  let n = String(old||'').trim().replace(/\s+/g,' ');
  let m;
  if((m = n.match(/^(?:LG|엘지)\s*팰리스\s*(\d{3,4})호?$/i))) return `LG팰리스 ${m[1]}호`;
  if((m = n.match(/^파라다이스텔\s*(\d{3,4})호?$/))) return `파라다이스텔 ${m[1]}호`;
  if((m = n.match(/^동교스테이\s*([A-Da-d])$/))) return `동교스테이 ${m[1].toUpperCase()}`;
  if((m = n.match(/^창천동?\s*잇다\s*(\d룸)\s*(\d{3}호)?$/))) return `창천잇다 ${m[1]}${m[2]?' '+m[2]:''}`;
  if((m = n.match(/^홍대\s*(\d{3})호?$/))) return `홍대 ${m[1]}호`;
  if((m = n.match(/^와우산로\s*(\d+)$/))) return `와우산로 ${m[1]}`;
  n = n.replace(/투룸/g,'2룸').replace(/원룸/g,'1룸').replace(/북측/g,'복층');
  if((m = n.match(/^(망원|연남|용강|서교|창천|이대|합정|상수|연희)동?\s*([123]룸|복층)(\s*\d층)?$/))) n = `${m[1]} ${m[2]}${m[3]?' '+m[3].trim():''}`;
  if(n==='망원 3룸' && all.some(x=>/^망원동?\s*3룸\s*2층$/.test(x.name))) n = '망원 3룸 1층';
  return n;
}

  document.body.appendChild(root);

async function upsertWorkEntry(dateStr, patch){

function nowHHMM(){
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function durationMinutes(clockIn, clockOut){
  const [ih, im] = clockIn.split(':').map(Number);
  const [oh, om] = clockOut.split(':').map(Number);
  let mins = (oh*60+om) - (ih*60+im);
  if(mins < 0) mins += 24*60; // 자정 넘어간 경우
  return mins;
}
function formatMinutes(mins){
  const h = Math.floor(mins/60), m = mins%60;
  return `${h}시간 ${m}분`;
}
function formatDuration(clockIn, clockOut){
  return formatMinutes(durationMinutes(clockIn, clockOut));
}
function computeThisMonthPay(){
  const now = new Date();
  const monthPrefix = `${now.getFullYear()}-${pad2(now.getMonth()+1)}`;
  const entries = state.workLog.filter(e => e.date.startsWith(monthPrefix) && e.clockIn && e.clockOut);
  const totalMinutes = entries.reduce((sum,e)=> sum + durationMinutes(e.clockIn, e.clockOut), 0);
  const pay = Math.round((totalMinutes/60) * (state.hourlyWage || 0));
  return { totalMinutes, pay };
}

async function stepClockTime(field, delta){
  const cdate = state.selectedDate || todayStr();
  const entry = getWorkEntry(cdate) || { clockIn: null, clockOut: null };
  const cur = entry[field] || nowHHMM();
  const [h, m] = cur.split(':').map(Number);
  let total = ((h*60 + m + delta) % 1440 + 1440) % 1440;
  const nh = Math.floor(total/60), nm = total%60;
  const newVal = `${String(nh).padStart(2,'0')}:${String(nm).padStart(2,'0')}`;
  await upsertWorkEntry(cdate, { [field]: newVal });
  render();
}

function pad2(n){ return String(n).padStart(2,'0'); }
function dateKeyOf(year, month, day){ return `${year}-${pad2(month+1)}-${pad2(day)}`; }

function renderScheduleCalendar(){
  const dateLabel = formatDateLabel(state.selectedDate);
  const isTodaySelected = state.selectedDate === todayStr();

  if(!state.scheduleCalendarOpen){
    return `
      <div class="schedule-cal-bar">
        <div style="display:flex;align-items:center;gap:6px;min-width:0;">
          <button class="dnav" data-day-nav="-1" aria-label="전날">◀</button>
          <div style="white-space:nowrap;">${isTodaySelected ? '오늘 · ' : ''}<b>${dateLabel}</b></div>
          <button class="dnav" data-day-nav="1" aria-label="다음날">▶</button>
        </div>
        <button id="toggleScheduleCal">달력 ▾</button>
      </div>
    `;
  }

  const { year, month } = state.historyMonth;
  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStrVal = todayStr();

  let cells = '';
  for(let i=0;i<firstWeekday;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const key = dateKeyOf(year, month, d);
    const hasRecord = state.historyDates && state.historyDates.has(key);
    const isTodayCell = key === todayStrVal;
    const isSelected = key === state.selectedDate;
    const _wd = new Date(year, month, d).getDay(); const _dc = (_wd===0 || holidayName(key)) ? 'dow-red' : (_wd===6 ? 'dow-blue' : '');
    cells += `
      <div class="cal-day ${_dc} ${hasRecord?'has-record':''} ${isTodayCell?'is-today':''} ${isSelected?'selected':''}" data-select-date="${key}">
        ${d}${hasRecord?'<div class="dot"></div>':''}
      </div>
    `;
  }

  return `
    <div class="history-nav">
      <button data-month-nav="-1">‹ 이전달</button>
      <div class="month-label">${year}년 ${month+1}월</div>
      <button data-month-nav="1">다음달 ›</button>
    </div>
    <div class="cal-weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="cal-grid">${cells}</div>
    <button class="relist-btn" id="toggleScheduleCal" style="width:100%;margin-bottom:12px;">달력 접기 ▴</button>
  `;
}

function formatDateLabel(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const days = ['일','월','화','수','목','금','토'];
  const wd = new Date(y, m-1, d).getDay();
  return `${m}월 ${d}일 (${days[wd]})`;
}

async function setupHistoryIfNeeded(){
  if(state.historyDates) return;
  try{
    const res = await window.storage.list('today:', false);
    const dates = (res && res.keys ? res.keys : []).map(k => k.replace('today:',''));
    state.historyDates = new Set(dates);
  }catch(e){
    state.historyDates = new Set();
  }
  render();
}

function renderWorkMonthList(){
  const base = new Date(); const ym = state.workMonth || `${base.getFullYear()}-${pad2(base.getMonth()+1)}`;
  const [Y,M] = ym.split('-').map(Number);
  const list = state.workLog.filter(e=>e.date.startsWith(ym) && (e.clockIn||e.clockOut)).sort((a,b)=>a.date.localeCompare(b.date));
  const done = list.filter(e=>e.clockIn&&e.clockOut);
  const mins = done.reduce((t,e)=>t+durationMinutes(e.clockIn,e.clockOut),0);
  const pay = Math.round(mins/60*(state.hourlyWage||0));
  const sel = state.selectedDate || todayStr();
  const rows = list.map(e=>{
    const d=new Date(e.date+'T00:00:00'); const dur=(e.clockIn&&e.clockOut)?formatDuration(e.clockIn,e.clockOut):'<span style="color:var(--clay);">미완료</span>';
    return `<div data-work-day="${e.date}" style="display:flex;gap:8px;align-items:center;padding:8px 6px;border-top:1px solid var(--paper-line);font-size:14px;cursor:pointer;${e.date===sel?'background:var(--teal-soft,#dcebe7);border-radius:6px;':''}">
      <span style="width:62px;">${d.getMonth()+1}/${d.getDate()} (${DAY_NAMES[d.getDay()]})</span>
      <span style="flex:1;">${e.clockIn||'-'} ~ ${e.clockOut||'-'}</span><b>${dur}</b></div>`; }).join('');
  return `<div style="display:flex;align-items:center;gap:8px;margin-top:12px;">
      <button class="pill-btn" data-work-month="-1">◀</button>
      <b style="flex:1;text-align:center;">${Y}년 ${M}월</b>
      <button class="pill-btn" data-work-month="1">▶</button></div>
    <div style="font-size:13px;margin:6px 0;text-align:center;">${done.length}일 · ${formatMinutes(mins)}${state.hourlyWage?' · 예상 '+pay.toLocaleString()+'원':''}</div>
    ${rows || '<div style="font-size:13px;color:var(--ink-soft);text-align:center;padding:10px;">이 달 기록 없음</div>'}
    ${rows?'<div style="font-size:11px;color:var(--ink-soft);margin-top:4px;">날짜를 누르면 위 출퇴근 칸에서 고칠 수 있어</div>':''}`;
}
async function importWorkLog(text){
  const T=/^\d{1,2}:\d{2}$/, norm=t=>{ if(!t) return null; t=String(t).trim(); if(!T.test(t)) return null; const [h,m]=t.split(':'); return pad2(+h)+':'+pad2(+m); };
  let rows=[];
  try{
    const j=JSON.parse(text);
    const arr=Array.isArray(j)?j:(j.workLog||j.entries||[]);
    rows=arr.map(e=>({date:e.date,clockIn:norm(e.clockIn||e.in),clockOut:norm(e.clockOut||e.out)}));
  }catch(e){
    text.replace(/^\uFEFF/,'').split(/\r?\n/).forEach(line=>{
      const c=line.split(',').map(x=>x.replace(/^"|"$/g,'').trim());
      const m=(c[0]||'').match(/^(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);
      if(m) rows.push({date:`${m[1]}-${pad2(+m[2])}-${pad2(+m[3])}`,clockIn:norm(c[1]),clockOut:norm(c[2])});
    });
  }
  rows=rows.filter(r=>r.date && (r.clockIn||r.clockOut));
  if(!rows.length){ alert('가져올 기록을 못 찾았어. 개인용에서 내보낸 CSV 파일인지 확인해줘.'); return; }
  const dup=rows.filter(r=>getWorkEntry(r.date)).length;
  if(!confirm(`${rows.length}일치 기록을 가져올까?`+(dup?`\n(이미 있는 ${dup}일은 가져온 값으로 바뀌어)`:''))) return;
  rows.forEach(r=>{ const i=state.workLog.findIndex(e=>e.date===r.date); const o={date:r.date,clockIn:r.clockIn,clockOut:r.clockOut}; if(i<0) state.workLog.push(o); else state.workLog[i]={...state.workLog[i],...o}; });
  await saveWorkLog(); render(); alert(rows.length+'일치 기록을 가져왔어.');
}
function exportWorkLogCSV(){
  const hasWage = !!state.hourlyWage;
  const header = hasWage ? ['날짜','출근','퇴근','근무시간','예상급여(원)'] : ['날짜','출근','퇴근','근무시간'];
  const rows = [header];
  state.workLog.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
    const duration = (e.clockIn && e.clockOut) ? formatDuration(e.clockIn, e.clockOut) : '';
    const row = [e.date, e.clockIn || '', e.clockOut || '', duration];
    if(hasWage){
      const pay = (e.clockIn && e.clockOut) ? Math.round((durationMinutes(e.clockIn, e.clockOut)/60) * state.hourlyWage) : '';
      row.push(pay);
    }
    rows.push(row);
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '출퇴근기록.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// 숙소 설정(항상 당일·체크할 항목)을 오늘 이후에 이미 만들어 둔 일정에도 반영
async function applyPropToFuture(pid){
  const p = propById(pid); if(!p) return 0;
  let keys = [];
  try{ const res = await window.storage.list('today:', false); keys = (res && res.keys) || []; }catch(e){}
  const today = todayStr(); const ALL = ['세탁 완료','세탁물 전달','컨디션 체크'];
  const want = tasksForProperty(p); let n = 0;
  for(const k of keys){
    const ds = k.replace('today:',''); if(ds < today) continue;
    let rec = null;
    try{ const x = await window.storage.get('today:'+ds, false); if(!x || !x.value) continue; rec = JSON.parse(x.value); }catch(e){ continue; }
    if(!(rec.propertyIds||[]).includes(pid)) continue;
    const before = JSON.stringify([rec.priorityIds||[], (rec.tasks||{})[pid]||[]]);
    rec.priorityIds = rec.priorityIds || [];
    if(p.alwaysPriority && !rec.priorityIds.includes(pid)) rec.priorityIds.push(pid);
    rec.tasks = rec.tasks || {};
    let next = (rec.tasks[pid]||[]).filter(t=> !ALL.includes(t.text) || want.includes(t.text) || t.done);
    want.forEach(t=>{ if(!next.some(x=>x.text===t)) next.push({text:t, done:false}); });
    next.sort((a,b)=> (ALL.indexOf(a.text)<0?9:ALL.indexOf(a.text)) - (ALL.indexOf(b.text)<0?9:ALL.indexOf(b.text)));
    rec.tasks[pid] = next;
    if(JSON.stringify([rec.priorityIds, next]) === before) continue;
    try{ await window.storage.set('today:'+ds, JSON.stringify(rec), false); n++; }catch(e){}
  }
  if(n && state.selectedDate) await loadTodayRecord();
  return n;
}

let kakaoSDKPromise = null;
function loadKakaoSDK(key){
  if(window.kakao && window.kakao.maps && window.kakao.maps.services){
    return Promise.resolve();
  }
  if(kakaoSDKPromise) return kakaoSDKPromise;
  kakaoSDKPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&autoload=false&libraries=services`;
    script.onload = ()=>{
      window.kakao.maps.load(()=> resolve());
    };
    script.onerror = ()=>{ kakaoSDKPromise = null; reject(new Error('sdk load failed')); };
    document.head.appendChild(script);
  });
  return kakaoSDKPromise;
}

function cleanAddressForGeocode(address){
  if(!address) return address;
  let a = address.trim();
  // "도로명 156, 1408호"처럼 콤마 뒤에 호수가 붙은 경우 콤마 앞부분만 사용
  const commaIdx = a.lastIndexOf(',');
  if(commaIdx > 0){
    return a.slice(0, commaIdx).trim();
  }
  // "4-17 102호" / "483-33 201호" / "b동201호" 처럼 끝에 붙은 호수/층 제거
  const stripped = a.replace(/\s*[a-zA-Z0-9]*\s*\d+\s*(호|층)\s*$/, '').trim();
  return stripped || a;
}

function geocodeAddress(address){
  if(state.geocodeCache[address]) return Promise.resolve(state.geocodeCache[address]);
  const geocoder = new kakao.maps.services.Geocoder();
  return new Promise((resolve)=>{
    const tryGeocode = (addr, onFail)=>{
      geocoder.addressSearch(addr, (result, status)=>{
        if(status === kakao.maps.services.Status.OK && result[0]){
          const coord = { lat: Number(result[0].y), lng: Number(result[0].x) };
          state.geocodeCache[address] = coord; // 원본 주소를 키로 캐싱
          resolve(coord);
        } else if(onFail){
          onFail();
        } else {
          resolve(null);
        }
      });
    };
    // 1차: 원본 주소 그대로 시도, 실패하면 호수/층 뗀 주소로 재시도
    tryGeocode(address, ()=>{
      const cleaned = cleanAddressForGeocode(address);
      if(cleaned && cleaned !== address){
        tryGeocode(cleaned, ()=> resolve(null));
      } else {
        resolve(null);
      }
    });
  });
}
