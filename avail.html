<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-title" content="bnb 근무일">
<meta name="application-name" content="bnb 근무일">
<title>bnb 근무일</title>
<style>
  :root{ --bg:#EEF1EA; --card:#fff; --ink:#1f2a24; --soft:#6b7568; --line:#dfe3d8; --teal:#2f7a67; --clay:#b4432c; --amber:#f6e7b6; --amber-ink:#7a5a00; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; line-height:1.5; }
  .wrap{ max-width:520px; margin:0 auto; padding:18px 16px 40px; }
  h1{ font-size:20px; margin:6px 0 2px; }
  .sub{ color:var(--soft); font-size:14px; margin:0 0 14px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .legend{ display:flex; flex-wrap:wrap; gap:8px 12px; font-size:13px; color:var(--soft); margin-top:8px; }
  .lg{ display:inline-flex; align-items:center; gap:5px; }
  .dot{ width:18px; height:18px; border-radius:5px; display:inline-block; border:1px solid var(--line); }
  .mhead{ font-weight:700; margin:12px 0 6px; font-size:15px; }
  .grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .dow{ text-align:center; font-size:12px; color:var(--soft); padding-bottom:2px; }
  .dow.s{ color:var(--clay); } .dow.t{ color:#3b6ea5; }
  .day{ border:1px solid var(--line); background:#fff; border-radius:10px; padding:0; min-height:54px; font-size:15px; font-weight:600; color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; font-family:inherit; }
  .day small{ font-size:11px; font-weight:700; min-height:14px; }
  .day.empty{ visibility:hidden; }
  .day.past{ opacity:.35; cursor:default; }
  .day.today{ border-color:var(--teal); box-shadow:0 0 0 1px var(--teal) inset; }
  .day.all{ background:var(--clay); border-color:var(--clay); color:#fff; }
  .day.am,.day.pm{ background:var(--amber); border-color:#e5cf85; color:var(--amber-ink); }
  textarea{ width:100%; min-height:70px; border:1px solid var(--line); border-radius:10px; padding:10px; font:inherit; font-size:15px; resize:vertical; }
  .btn{ width:100%; border:0; border-radius:12px; background:var(--teal); color:#fff; font:inherit; font-size:17px; font-weight:700; padding:14px; cursor:pointer; margin-top:6px; }
  .btn:disabled{ opacity:.5; }
  .msg{ text-align:center; font-size:14px; margin-top:10px; min-height:20px; }
  .msg.ok{ color:var(--teal); font-weight:700; } .msg.err{ color:var(--clay); font-weight:700; }
  .big{ text-align:center; padding:40px 10px; color:var(--soft); }
  .tabs{ display:flex; gap:6px; margin:4px 0 10px; }
  .tab{ flex:1; border:1px solid var(--line); background:#fff; border-radius:10px; padding:9px 4px; font:inherit; font-size:14px; font-weight:700; color:var(--soft); cursor:pointer; line-height:1.25; }
  .tab small{ display:block; font-weight:500; font-size:11px; }
  .tab.on{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .wk{ display:flex; flex-direction:column; gap:6px; }
  .row{ display:flex; align-items:center; justify-content:space-between; border:1px solid var(--line); background:#fff; border-radius:12px; padding:0 14px; min-height:54px; font:inherit; font-size:16px; font-weight:700; color:var(--ink); cursor:pointer; width:100%; text-align:left; }
  .row .st{ font-size:14px; font-weight:700; color:var(--soft); }
  .row.past{ opacity:.35; cursor:default; }
  .row.today{ border-color:var(--teal); box-shadow:0 0 0 1px var(--teal) inset; }
  .row.ok{ background:var(--teal); border-color:var(--teal); color:#fff; } .row.ok .st{ color:#fff; }
  .row.am,.row.pm{ background:var(--amber); border-color:#e5cf85; color:var(--amber-ink); } .row.am .st,.row.pm .st{ color:var(--amber-ink); }
  .row.all{ background:var(--clay); border-color:var(--clay); color:#fff; } .row.all .st{ color:#fff; }
  .quick{ display:flex; gap:8px; margin:10px 0 0; }
  .qbtn{ flex:1; border:1px solid var(--line); background:#fff; border-radius:10px; padding:9px; font:inherit; font-size:14px; color:var(--ink); cursor:pointer; }
  .dirty{ color:var(--clay); font-size:13px; text-align:center; min-height:18px; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="big">불러오는 중…</div></div>
<script type="module">
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB3KSGfToHr1oPxDJTk7sAYof7pKelfNGY",
  authDomain: "bnbcare-d1603.firebaseapp.com",
  projectId: "bnbcare-d1603",
  storageBucket: "bnbcare-d1603.firebasestorage.app",
  messagingSenderId: "454006613109",
  appId: "1:454006613109:web:589a7ed412af59e358843c"
};
const FB_VER = '10.14.1';
const app = document.getElementById('app');
const DOW = ['일','월','화','수','목','금','토'];
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WEEKS = 8;
const ORDER = ['', 'all', 'am', 'pm'];
const LABEL = { all:'불가', am:'오전만', pm:'오후만' };

function fail(text){ app.innerHTML = '<div class="big">'+esc(text)+'</div>'; }

const token = new URLSearchParams(location.search).get('t') || '';
if(!token){ fail('링크가 올바르지 않아요. 받으신 링크를 다시 눌러주세요.'); }
else main().catch(e=>{ console.error(e); fail('불러오지 못했어요. 잠시 뒤에 다시 열어보세요. (관리자에게 문의)'); });

async function main(){
  const base = 'https://www.gstatic.com/firebasejs/'+FB_VER;
  const [appM, fsM] = await Promise.all([ import(base+'/firebase-app.js'), import(base+'/firebase-firestore.js') ]);
  const db = fsM.getFirestore(appM.initializeApp(FIREBASE_CONFIG));
  const ref = fsM.doc(db, 'avail', token);
  const snap = await fsM.getDoc(ref);
  if(!snap.exists()){ fail('링크가 올바르지 않아요. 관리자에게 새 링크를 요청해주세요.'); return; }
  const data = snap.data();
  const todayD = new Date(); const today = ymd(todayD);
  const mode = data.mode === 'off' ? 'off' : 'can'; // can: 가능한 날만 체크 / off: 불가한 날만 체크
  const ORD = mode === 'can' ? ['', 'ok', 'am', 'pm'] : ['', 'all', 'am', 'pm'];
  const mapKey = mode === 'can' ? 'can' : 'off';
  const keep = ymd(new Date(todayD.getFullYear(), todayD.getMonth(), todayD.getDate()-7));
  const marks = {}; Object.entries(data[mapKey]||{}).forEach(([k,v])=>{ if(k>=today && ORD.includes(v) && v) marks[k]=v; });
  const done = {}; Object.entries(data.done||{}).forEach(([k,v])=>{ if(k>=keep && v) done[k]=v; });
  const touched = new Set();
  let note = data.note || '', dirty = false, saving = false, lastSaved = data.confirmedAt || 0;
  const hourly = !!data.hourly; const clock = {};
  const cutoff = ymd(new Date(todayD.getFullYear(), todayD.getMonth(), todayD.getDate()-62));
  Object.entries(data.clock||{}).forEach(([k,v])=>{ if(k>=cutoff && v) clock[k] = { ...(v.in?{in:v.in}:{}), ...(v.out?{out:v.out}:{}) }; });
  const nowHM = ()=>{ const x = new Date(); return pad(x.getHours())+':'+pad(x.getMinutes()); };
  const toMin = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(t||''); return m ? +m[1]*60+ +m[2] : null; };
  const dur = c => { const a = toMin(c&&c.in), b = toMin(c&&c.out); if(a==null||b==null||b<=a) return ''; const m=b-a; return (m>=60?Math.floor(m/60)+'시간 ':'')+(m%60?m%60+'분':''); };
  async function saveClock(msgText){
    const m = document.getElementById('cmsg'); if(m){ m.className='msg'; m.textContent='저장 중…'; }
    try{ await fsM.updateDoc(ref, { clock: { ...clock }, updatedAt: Date.now() }); draw(); const m2=document.getElementById('cmsg'); if(m2){ m2.className='msg ok'; m2.textContent=msgText; } }
    catch(e){ console.error(e); const m2=document.getElementById('cmsg'); if(m2){ m2.className='msg err'; m2.textContent='저장하지 못했어요. 다시 눌러주세요.'; } }
  }

  // 주 단위(월~일). 0=이번 주, 1=다음 주, 2=다다음 주
  const dow0 = (todayD.getDay()+6)%7; // 월=0
  const mon0 = new Date(todayD.getFullYear(), todayD.getMonth(), todayD.getDate()-dow0);
  const weeks = [0,1,2].map(i=>{ const m = new Date(mon0.getFullYear(), mon0.getMonth(), mon0.getDate()+7*i);
    const days = [0,1,2,3,4,5,6].map(k=>{ const d = new Date(m.getFullYear(), m.getMonth(), m.getDate()+k); return { ds:ymd(d), d:d.getDate(), mo:d.getMonth()+1, wd:d.getDay() }; });
    return { key:days[0].ds, days, label:['이번 주','다음 주','다다음 주'][i], range:(days[0].mo)+'/'+days[0].d+' ~ '+(days[6].mo)+'/'+days[6].d }; });
  let wi = 1;
  const fmt = t => { const x = new Date(t); return (x.getMonth()+1)+'/'+x.getDate()+' '+pad(x.getHours())+':'+pad(x.getMinutes()); };
  const LABEL = mode === 'can' ? { ok:'가능', am:'오전만 가능', pm:'오후만 가능' } : { all:'불가', am:'오전만 가능', pm:'오후만 가능' };
  const EMPTY = mode === 'can' ? '일 못 해요' : '가능';
  function draw(){
    const wk = weeks[wi]; const cnt = Object.keys(marks).length;
    const isDone = !!done[wk.key];
    app.innerHTML = `
      <h1>${esc(data.name||'')}님 근무 가능일</h1>
      <p class="sub">${mode==='can' ? '<b>일할 수 있는 날</b>을 눌러서 표시해 주세요.<br>안 누른 날은 <b>일할 수 없는 날</b>로 알고 있을게요.' : '일하기 어려운 날만 눌러서 표시해 주세요.<br>안 누른 날은 <b>모두 가능</b>으로 알고 있을게요.'}</p>
      ${hourly ? (()=>{ const c = clock[today]||{}; const hist = Object.keys(clock).filter(k=>k<today).sort().reverse().slice(0,7);
        return `<div class="card">
        <div style="font-size:15px;font-weight:700;margin-bottom:8px;">⏱ 오늘 근무 시간</div>
        <div style="display:flex;gap:8px;">
          <button class="btn" id="cin" style="margin:0;${c.in?'background:#9fb8ae;':''}">청소 시작${c.in?'<br><small>'+c.in+'</small>':''}</button>
          <button class="btn" id="cout" style="margin:0;background:#8a4b3a;${c.out?'opacity:.6;':''}">청소 끝${c.out?'<br><small>'+c.out+'</small>':''}</button>
        </div>
        ${(c.in||c.out)?`<div style="font-size:13px;color:var(--soft);margin-top:8px;">잘못 눌렀으면 아래에서 고쳐주세요.<br>시작 <input type="time" id="cin_t" value="${c.in||''}"> 끝 <input type="time" id="cout_t" value="${c.out||''}"> <button class="day" id="csave" style="display:inline-flex;min-height:0;padding:4px 10px;font-size:13px;">고치기</button></div>`:''}
        <div class="msg" id="cmsg"></div>
        ${hist.length?`<div style="font-size:13px;margin-top:6px;color:var(--soft);">${hist.map(k=>`<div>${+k.slice(5,7)}/${+k.slice(8)} · ${clock[k].in||'?'} ~ ${clock[k].out||'?'} ${dur(clock[k])}</div>`).join('')}</div>`:''}
      </div>`; })() : ''}
      <div class="card">
        <div class="tabs">${weeks.map((w,i)=>`<button class="tab ${i===wi?'on':''}" data-wi="${i}">${w.label}<small>${w.range}${done[w.key]?' ✓':''}</small></button>`).join('')}</div>
        <div style="font-size:14px;margin-bottom:8px;"><b>누를 때마다</b> 바뀌어요 · ${wk.range}${isDone?' · <span style="color:var(--teal);font-weight:700;">입력 완료 ✓</span>':''}</div>
        <div class="wk">
          ${wk.days.map(c=>{ const past = c.ds < today, v = marks[c.ds]||'';
            return `<button class="row ${past?'past':''} ${c.ds===today?'today':''} ${v}" data-ds="${c.ds}" ${past?'disabled':''}><span>${c.mo}/${c.d} (${DOW[c.wd]})${c.ds===today?' · 오늘':''}</span><span class="st">${LABEL[v]||(past?'':EMPTY)}</span></button>`; }).join('')}
        </div>
        <div class="quick">${mode==='can'
          ? '<button class="qbtn" id="allok">이 주 전부 가능</button><button class="qbtn" id="allno">이 주 전부 불가</button>'
          : '<button class="qbtn" id="allno">이 주 표시 모두 지우기</button>'}</div>
      </div>
      <div class="card">
        <div style="font-size:14px;font-weight:700;margin-bottom:6px;">전달할 말 (선택)</div>
        <textarea id="note" maxlength="280" placeholder="예: 17일은 병원 때문에 오전만 가능해요">${esc(note)}</textarea>
      </div>
      <div class="dirty" id="dirty">${dirty?'아직 저장 전이에요. 아래 "입력 완료"를 눌러주세요':''}</div>
      <button class="btn" id="save" ${saving?'disabled':''}>입력 완료</button>
      <div class="msg ${lastSaved?'ok':''}" id="msg">${lastSaved?'마지막 입력 '+fmt(lastSaved)+' ✓':''}</div>
      <div class="sub" style="text-align:center;margin-top:14px;">${mode==='can'?'가능으로 표시한 날':'불가로 표시한 날'} ${cnt}일</div>`;
    app.querySelectorAll('.tab[data-wi]').forEach(b=> b.onclick = ()=>{ wi = Number(b.dataset.wi); draw(); window.scrollTo(0,0); });
    app.querySelectorAll('.row[data-ds]').forEach(b=> b.onclick = ()=>{
      const ds = b.dataset.ds; const next = ORD[(ORD.indexOf(marks[ds]||'')+1)%ORD.length];
      if(next) marks[ds] = next; else delete marks[ds];
      touched.add(wk.key); dirty = true; const sc = window.scrollY; draw(); window.scrollTo(0, sc);
    });
    const aok = document.getElementById('allok'), ano = document.getElementById('allno');
    if(aok) aok.onclick = ()=>{ wk.days.forEach(c=>{ if(c.ds>=today) marks[c.ds]='ok'; }); touched.add(wk.key); dirty = true; draw(); };
    if(ano) ano.onclick = ()=>{ wk.days.forEach(c=>{ delete marks[c.ds]; }); touched.add(wk.key); dirty = true; draw(); };
    const ta = document.getElementById('note'); ta.oninput = ()=>{ note = ta.value; if(!dirty){ dirty = true; document.getElementById('dirty').textContent = '아직 저장 전이에요. 아래 "입력 완료"를 눌러주세요'; } };
    document.getElementById('save').onclick = async ()=>{
      if(saving) return; saving = true; const btn = document.getElementById('save'), msg = document.getElementById('msg');
      btn.disabled = true; msg.className = 'msg'; msg.textContent = '저장 중…';
      try{
        const now = Date.now();
        touched.add(wk.key); touched.forEach(k=>{ done[k] = now; });
        await fsM.updateDoc(ref, { [mapKey]: { ...marks }, done: { ...done }, note: note.trim(), confirmedAt: now, updatedAt: now });
        dirty = false; lastSaved = now; saving = false; draw();
        document.getElementById('msg').textContent = '저장됐어요 ✓ ' + fmt(now);
      }catch(e){
        console.error(e); saving = false; btn.disabled = false; msg.className = 'msg err'; msg.textContent = '저장하지 못했어요. 인터넷을 확인하고 다시 눌러주세요.';
      }
    };
  }
  window.addEventListener('beforeunload', e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });
  draw();
}
</script>
</body>
</html>
